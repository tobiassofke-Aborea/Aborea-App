# Baut bei jeder Änderung eine Android-App (APK) aus der Web-App und
# veröffentlicht sie unter "Releases". Direktlink zur neuesten Version:
# https://github.com/tobiassofke-Aborea/Aborea-App/releases/latest/download/Aborea.apk
name: Android-App bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - 'kofferliste/**'
      - 'kampf-tracker/**'
      - 'quelle/kampf-tracker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web-App bauen
        run: python3 tools/build.py

      - name: Capacitor-Projekt anlegen
        run: |
          mkdir -p build/www
          cp -r index.html manifest.webmanifest sw.js fonts icons build/www/
          cd build
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "de.aborea.charakterbogen",
            "appName": "Aborea",
            "webDir": "www",
            "android": { "backgroundColor": "#e9e5dc" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: App-Symbol
        continue-on-error: true
        run: |
          cd build
          mkdir -p assets
          cp ../android-assets/icon-*.png assets/
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#e9e5dc' --iconBackgroundColorDark '#e9e5dc' --splashBackgroundColor '#e9e5dc' --splashBackgroundColorDark '#1c1814'

      - name: Eigene Symbol-Ebenen
        run: |
          # ohne den Einzug, den das Werkzeug sonst einfügt; mit Monochrom-Ebene für Android-13-Designsymbole
          cp -r android-assets/res/. build/android/app/src/main/res/
          cat build/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Version und Rechte setzen
        run: |
          cd build/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" app/build.gradle

      - name: APK bauen
        run: |
          # Immer derselbe Schlüssel, damit Updates sich über die alte Version installieren lassen
          # (fest im Gradle-Build eingetragen; nur nach ~/.android kopieren reichte nicht)
          KS="$GITHUB_WORKSPACE/android-assets/debug.keystore"
          cd build/android
          sed -i "0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file('$KS')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }#" app/build.gradle
          grep -n -A7 "signingConfigs" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Aborea.apk
          # Prüfen, dass wirklich mit dem festen Schlüssel signiert wurde
          SOLL=$(keytool -list -v -keystore "$KS" -storepass android | grep -m1 "SHA256:" | awk '{print $2}')
          IST=$(keytool -printcert -jarfile ../../Aborea.apk | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Schlüssel soll: $SOLL"; echo "Schlüssel ist:  $IST"
          test "$SOLL" = "$IST"

      - uses: actions/upload-artifact@v4
        with:
          name: Aborea-apk
          path: Aborea.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Aborea 1.${{ github.run_number }}
          body: "Android-App zum Installieren: Aborea.apk herunterladen und auf dem Handy öffnen."
          files: Aborea.apk
          make_latest: true
