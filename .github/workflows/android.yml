# Baut bei jeder Änderung eine Android-App (APK) aus der Web-App und
# veröffentlicht sie unter "Releases". Direktlink zur neuesten Version:
# https://github.com/tobiassofke-Aborea/Aborea-App/releases/latest/download/Aborea.apk
name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web-App bauen
        run: python3 tools/build.py

      - name: Capacitor-Projekt anlegen
        run: |
          mkdir -p build/www
          cp -r index.html manifest.webmanifest sw.js fonts icons build/www/
          cd build
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "de.aborea.charakterbogen",
            "appName": "Aborea",
            "webDir": "www",
            "android": { "backgroundColor": "#e9e5dc" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: App-Symbol
        continue-on-error: true
        run: |
          cd build
          mkdir -p assets
          cp ../android-assets/icon-*.png assets/
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#6b4c25' --iconBackgroundColorDark '#6b4c25' --splashBackgroundColor '#e9e5dc' --splashBackgroundColorDark '#1c1814'

      - name: Version und Rechte setzen
        run: |
          cd build/android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" app/build.gradle

      - name: APK bauen
        run: |
          # Immer derselbe Schlüssel, damit Updates sich über die alte Version installieren lassen
          mkdir -p ~/.android
          cp android-assets/debug.keystore ~/.android/debug.keystore
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Aborea.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aborea-apk
          path: Aborea.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Aborea 1.${{ github.run_number }}
          body: "Android-App zum Installieren: Aborea.apk herunterladen und auf dem Handy öffnen."
          files: Aborea.apk
          make_latest: true
