# Veröffentlicht die Web-App auf GitHub Pages (fürs iPhone: in Safari öffnen,
# Teilen → „Zum Home-Bildschirm“). Einmalig nötig: im Repository unter
# Settings → Pages bei „Source“ den Punkt „GitHub Actions“ wählen.
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web-App bauen
        run: |
          python3 tools/build.py
          mkdir -p site
          cp -r index.html manifest.webmanifest sw.js fonts icons kofferliste kampf-tracker site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub findet das gerade hochgeladene Paket manchmal nicht sofort
      # („Fetching artifact metadata failed“). Dann kurz warten und erneut.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
