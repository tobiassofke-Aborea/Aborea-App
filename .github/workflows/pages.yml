# Veröffentlicht die Web-App auf GitHub Pages (fürs iPhone: in Safari öffnen,
# Teilen → „Zum Home-Bildschirm“). Einmalig nötig: im Repository unter
# Settings → Pages bei „Source“ den Punkt „GitHub Actions“ wählen.
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Web-App bauen
        run: |
          python3 tools/build.py
          mkdir -p site
          cp -r index.html manifest.webmanifest sw.js fonts icons site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
