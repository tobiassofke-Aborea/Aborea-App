<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicola packt</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nicola packt">
<meta name="application-name" content="Nicola packt">
<meta name="theme-color" content="#F1F6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18201B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte, oben der kleine Tobi mit Sprechblase, darunter der Schritt vom Kopf bis zu den Füßen, unten der Koffer */
:root{
  --bg:#F1F6EE; --surface:#FFFFFF; --ink:#24352B; --muted:#66776C; --line:#D8E3D5;
  --accent:#3E8B5C; --accent-soft:#E0EFE3; --sun:#F2B84B; --sun-soft:#FCEFD2; --blush:#F3A39B;
  --on-accent:#FFFFFF; --warn:#D08A15; --bad:#C2483A;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18201B; --surface:#212B24; --ink:#E8F0E9; --muted:#9DB0A2; --line:#33423A;
  --accent:#7FCB98; --accent-soft:#273A2E; --sun:#F2C266; --sun-soft:#3A3220; --blush:#E3928A;
  --on-accent:#12261A; --warn:#E8AE4E; --bad:#EE8A7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18201B; --surface:#212B24; --ink:#E8F0E9; --muted:#9DB0A2; --line:#33423A;
  --accent:#7FCB98; --accent-soft:#273A2E; --sun:#F2C266; --sun-soft:#3A3220; --blush:#E3928A;
  --on-accent:#12261A; --warn:#E8AE4E; --bad:#EE8A7C; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
body.has-gauge{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem}
h2{font-size:1.7rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.group{display:flex;flex-direction:column;gap:10px}

/* Tobi + Sprechblase */
.buddy{display:flex;align-items:flex-end;gap:10px}
.tobi{flex:none;width:96px;height:122px;overflow:visible}
.tobi.big{width:124px;height:157px}
.tobi.tiny{width:58px;height:74px}
.buddy.tiny{gap:8px}
.buddy.tiny .bubble{margin-bottom:16px;padding:8px 12px;font-size:.92rem;border-radius:14px}
.buddy.tiny .bubble::before{bottom:10px;width:12px;height:12px;left:-8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.buddy-tap{background:none;border:0;padding:0;cursor:pointer;flex:none}
.tobi.hop{animation:hop .45s ease}
.tobi .wave{transform-origin:82px 108px;animation:wave 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(8deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:34px;font-weight:600}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:.95rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{opacity:.75;font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.4rem;cursor:pointer}
.stepper output{font-family:var(--display);font-size:2.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{font:inherit;font-weight:600;font-size:.9rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zone{flex:none;font:inherit;font-weight:600;font-size:.8rem;padding:6px 11px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.zone.done{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.zone.cur{border-color:var(--accent);color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}

.list{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:2px solid var(--line);cursor:pointer;user-select:none}
.item:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:14px;height:14px;opacity:0}
.item.on .box svg{opacity:1}
.name{flex:1;min-width:0;font-weight:600}
.item.on{background:var(--accent-soft)}
.item.pk{cursor:default}
.item.pk .ms{width:38px;height:38px;font-size:1.25rem}
.name small.rec{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.item.on .name small.rec{text-decoration:none}
.mini-step{flex:none;display:flex;align-items:center;gap:4px}
.ms{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;line-height:1;cursor:pointer;padding:0}
.ms:disabled{opacity:.35;cursor:default}
.qty{min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.95rem}
.qty.changed{color:var(--accent)}
.qty.zero{color:var(--line)}
.qty.match{background:var(--sun);color:#5A3A00;border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--sun-soft);animation:matchpop .35s ease}
@keyframes matchpop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.rec.ok{color:var(--warn)!important;font-weight:700;display:flex;align-items:center;gap:4px}
@media (prefers-reduced-motion:reduce){.qty.match{animation:none}}
.qty.in{color:var(--ink)}
.item:not(.on) .ms.plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.del{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.add button{font:inherit;font-weight:700;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.empty{padding:16px;color:var(--muted)}
.summary{display:flex;flex-direction:column;gap:6px}

/* Koffer unten */
.gauge{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gauge-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:16px}
.case-wrap{position:relative;flex:none;padding-top:8px}
.case-handle{position:absolute;width:20px;height:11px;border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;left:50%;top:0;transform:translateX(-50%)}
.case{position:relative;width:54px;height:64px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--bg)}
.case::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16px,color-mix(in srgb,var(--ink) 18%,transparent) 16px 18px);pointer-events:none}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sun);transition:height .35s ease,background .2s}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.stats{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stat-top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;align-items:baseline}
.stat-top b{font-family:var(--display);font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat-top span{color:var(--muted);font-variant-numeric:tabular-nums}
.mini{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease}
.mini i.warn{background:var(--warn)} .mini i.bad{background:var(--bad)}
.gauge-note{font-size:.8rem;color:var(--muted)}
.gauge-note.bad{color:var(--bad);font-weight:700}

.item.kv{flex-direction:column;align-items:flex-start;gap:3px;cursor:default}
.item.kv span:last-child{font-weight:600;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);border-radius:12px;padding:3px}
.seg button{font:inherit;font-weight:700;font-size:.88rem;border:0;border-radius:9px;padding:8px 4px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:.85rem}
.gnav{display:flex;gap:10px;max-width:520px;margin:10px auto 0}
.gnav .btn{flex:1;padding:12px 14px}
.chip.locked{opacity:.45;border-style:dashed;cursor:default}
.clockbar{display:flex;align-items:center;gap:12px;background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:10px 14px}
.clockbar b{flex:1;font-family:var(--display);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.rank{flex:none;width:2ch;font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--muted)}
.tagw{flex:none;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px}
.tagw.won{background:var(--accent-soft);color:var(--accent)}
.tagw.lost{background:var(--line);color:var(--muted)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);box-shadow:-50vw 0 0 var(--bg),50vw 0 0 var(--bg);display:flex;flex-direction:column;gap:6px;padding-block:8px 6px;border-bottom:2px solid var(--line)}
.stage .bubble{margin-bottom:28px}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:100vh;background:var(--bg);box-shadow:-50vw 0 0 var(--bg),50vw 0 0 var(--bg);pointer-events:none}
body:has(.stage)::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:30;width:min(480px,calc(100% - 32px));
  background:var(--surface);border:2px solid var(--sun);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.toast span{font-size:.9rem;color:var(--muted)}
.toast.in{animation:toastin .35s ease}
@keyframes toastin{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.item.ach{cursor:default}
.item.ach .medal{color:var(--muted);font-weight:700}
.medal{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.item.ach.got .medal{background:var(--sun);border:2px solid var(--sun)}
.item.ach.got .medal svg path{stroke:var(--ink)}
.item.ach .medal svg{width:15px;height:15px}
.item.ach:not(.got) .name{color:var(--muted)}
.settop{display:flex;justify-content:space-between;width:100%;gap:8px}
.setitems{font-size:.85rem;color:var(--muted);font-weight:400 !important}
@media (prefers-reduced-motion:reduce){.toast.in{animation:none}}
.slot{background:var(--surface);border:3px solid var(--ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.slot-top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.slot-top b{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--warn)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--sun-soft);border-radius:16px;padding:10px}
.reel{height:96px;overflow:hidden;border-radius:12px;background:var(--bg);border:2px solid var(--line);position:relative}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bg),transparent 22%,transparent 78%,var(--bg));pointer-events:none;opacity:.7}
.sym{height:96px;display:grid;place-items:center}
.sym svg{width:64px;height:64px}
.window .sym svg{width:72px;height:72px}
.spin{font-size:1.1rem;background:var(--warn)}
.coinbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 14px}
.coinbar > span:nth-child(2){flex:1;min-width:140px}
.coin{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--warn);display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#5A3A00}
.toast[hidden]{display:none}
.voucher .code{white-space:nowrap;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:16px}
.card.resume{border-color:var(--accent);gap:10px}
.field{display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;gap:8px}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.t5{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:420px){.tiles.t5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--muted);cursor:pointer;min-width:0}
.tile span{font-size:.74rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.15;hyphens:auto;max-width:100%}
.tile small{font-size:.72rem;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.betrow{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px}
.bettxt{flex:1;min-width:140px;display:flex;flex-direction:column}
.switch{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{left:23px}
.ministep{display:flex;align-items:center;gap:6px}
.ministep button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer;padding:0}
.ministep output{font-family:var(--display);font-size:1.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.btn.big{font-size:1.1rem;padding:16px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mtile{font:inherit;position:relative;display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.mico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mtxt{display:flex;flex-direction:column;min-width:0}
.mtxt b{font-size:.95rem}
.mtxt small{color:var(--muted);font-size:.8rem}
#slot,#statsm{grid-column:1/-1}
.mini3{grid-template-columns:repeat(3,auto);padding:2px}
.mini3 button{padding:5px 10px;font-size:.8rem}
.ovzone{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ovlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ovlist li{display:flex;gap:8px;align-items:center;font-size:.92rem;min-height:38px}
.ovlist .mini-step{flex:none;display:flex;align-items:center;gap:6px}
.ovlist .qty.match{min-width:26px;height:26px}
.ovlist li span:nth-child(2){flex:1;min-width:0}
.ovmark{width:1.1em;flex:none;font-weight:700}
.ovlist li.in .ovmark{color:var(--accent)}
.ovlist li.out{color:var(--muted)}
.ovq{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem}
.ovlist li.out .ovq{font-weight:400;font-size:.78rem}
.stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stile b{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stile span{font-weight:700;font-size:.88rem}
.stile small{color:var(--muted);font-size:.78rem}
.mtile.hot{border-color:var(--sun);background:var(--sun-soft)}
.mtile.hot .mico{background:var(--sun);color:#5A3A00}
.badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center;padding:0 6px}
.coinbar.revive{background:color-mix(in srgb,var(--accent-soft) 70%,var(--sun-soft));border-color:var(--accent)}
.coinbar.revive .ico{color:var(--accent)}
.reveal.small{padding:14px 12px;gap:6px}
.reveal.small .prev{width:96px;height:96px}
.iname{font-family:var(--display);font-weight:600;font-size:1.3rem}
.coinbar .ico{color:var(--warn);flex:none}
/* Lootbox */
.boxstage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.boxbtn{background:none;border:0;padding:0;cursor:pointer}
.boxbtn:disabled{cursor:default;opacity:.55}
.lootbox{width:200px;height:175px;overflow:visible}
.lootbox .sparkle{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2}}
.boxbtn:not(:disabled) .lootbox{animation:bob 2.2s ease-in-out infinite}

const tagsNow=()=>new Set([S.occ,...S.wx,...(S.mode==="bus"?["t3"]:[]),...(S.days>=7?["lang"]:[])]);

const KEY="kofferliste-v1";
let S={days:4,occ:"urlaub",wx:["mild"],bags:["mittel"],checks:{},custom:{},qty:{},step:-1};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) S=Object.assign(S,s);}catch(e){}
if(S.tobi&&(S.tobiV||0)<3){S.tobi.mode="auto"; if(!S.tobi.base||S.tobi.base==="auto") S.tobi.base="hoodie";} S.tobiV=3;
if(!S.bags) S.bags=[S.bag==="rucksack"?"r38":(S.bag||"mittel")];
S.qty=S.qty||{}; S.mode=S.mode||"koffer"; if(S.mode!=="bus"&&S.bags) S.bags=S.bags.filter(b=>b!=="t3"); S.custom=S.custom||{}; S.checks=S.checks||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cnt=i=>S.qty[i.id]??i.q??1;

function itemsFor(zone){
  const tags=tagsNow();
  const list=ITEMS.filter(it=>it.z===zone).filter(it=>{
    if(it.min && S.days<it.min) return false;
    if(it.if && !it.if.some(t=>tags.has(t))) return false;
    if(it.not && it.not.some(t=>tags.has(t))) return false;
    return true;
  }).map(it=>({id:it.id,n:it.n,q:it.q?it.q(S.days):null,wv:it.w}));
  (S.custom[zone]||[]).forEach((n,i)=>list.push({id:zone+":custom:"+n,n,q:null,custom:i,wv:CUSTOM_WV}));
  return list;
}
const zoneDone=z=>{const l=itemsFor(z);return l.length>0&&l.every(i=>S.checks[i.id])};
const allItems=()=>ZONES.flatMap(z=>itemsFor(z.id));

function totals(){
  const bs=bagList().map(k=>BAGS[k]);
  const bag={n:bagNames(),l:bs.reduce((a,b)=>a+b.l,0),leer:bs.reduce((a,b)=>a+b.leer,0),lim:bs.reduce((a,b)=>a+b.lim,0),multi:bs.length>1};
  let g=0,l=0;
  allItems().forEach(i=>{if(S.checks[i.id]){const n=cnt(i);g+=i.wv[0]*n;l+=i.wv[1]*n}});
  const kg=bag.leer+g/1000;
  return {bag,kg,liters:l,volPct:l/bag.l*100,kgPct:kg/bag.lim*100};
}

// Was Tobi automatisch anzieht: Anlass × Wetter
function autoBase(occ,wx){
  const has=k=>wx.includes(k), cold=has("kalt"), rain=has("regen"), hot=has("heiss")&&!cold;
  if(occ==="strand"){
    if(rain) return {top:"regenjacke",bot:"badehose"};
    if(hot)  return {top:"none",bot:"badehose"};
    return {top:"tshirt",bot:"badehose"};            // mild: + T-Shirt, kalt: + T-Shirt + Mütze
  }
  if(occ==="business"||occ==="feier") return {top:"hemd",bot:"hose"};
  if(occ==="ski") return hot?{top:"tshirt",bot:"hose"}:{top:"skijacke",bot:"hose"};
  if(rain) return {top:"regenjacke",bot:hot?"shorts":"hose"};
  if(cold) return {top:"pulli",bot:"hose"};
  if(hot)  return {top:"tshirt",bot:"shorts"};
  return {top:"hoodie",bot:"hose"};
}

  const L=look(), auto=L.mode!=="frei", o=(auto&&!show)?occ:null, W=new Set(show?[]:wx);

  B=Object.assign({},B); if(wBody&&!wBody.back) B.top="ward";
  const hotNow=W.has("heiss")&&!W.has("kalt");

  const arm=(x1,y1,x2,y2)=>{
    const hand=`<circle cx="${x2}" cy="${y2}" r="${W.has("kalt")?6.5:5.5}" fill="${handC}"/>`;

  app.querySelector("#rand").onclick=()=>{

    save();say="Huch! Wer bin ich?";hop=true;render()};

      if(Lc.mode==="frei"){addSet("bases",Lc.base); if(Lc.base==="unterhose") ST().naked++;}
      if(keptSurprise) ST().surprise++;}
    editStart=null; keptSurprise=false;
    previewOcc=null;previewWx=null;S.step=-1;save();render();scrollTo(0,0)};
  app.querySelector("#done").onclick=close; app.querySelector("#done2").onclick=close;
}

function reactToCheck(zoneId,itemName){
  const all=allItems(), done=all.filter(i=>S.checks[i.id]).length, pct=all.length?done/all.length*100:0, prev=all.length?(done-1)/all.length*100:0;
  const t=totals(), now_=Date.now(); checkTimes=[...checkTimes.filter(x=>now_-x<25000),now_];

  const h=new Date().getHours();
  if(t.volPct>100){say="Uff, Nicola… der Koffer platzt gleich. Brauchen wir das alles?";mood="worried";}
  else if(t.kgPct>100){say="Puh, ganz schön schwer! Vielleicht was Schweres anziehen statt einpacken?";mood="worried";}
  else if(zoneDone(zoneId)){say=pickNew([ZONES.find(z=>z.id===zoneId).name+" ist komplett! Weiter geht's.","Bereich "+ZONES.find(z=>z.id===zoneId).name+" erledigt. High five!",ZONES.find(z=>z.id===zoneId).name+": fertig! Du bist eine Maschine."]);mood="cheer";}
  else if(prev<50&&pct>=50){say="Halbzeit, Nicola! Kaffeepause verdient.";mood="cheer";}
  else if(prev<75&&pct>=75){say="Schon drei Viertel. Gleich hast du's!";mood="cheer";}
  else if(checkTimes.length===6){say="Wow, sechs Sachen in ein paar Sekunden. Du bist im Flow!";mood="cheer";}
  else if(t.volPct>85){say="Wird langsam kuschelig im Koffer.";}
  else if(S.bet&&elapsed()>S.bet.target*60*.8&&elapsed()<S.bet.target*60){say="Endspurt! Die Zeit wird knapp, Nicola!";}
  else{
    const q=ITEM_QUIP.find(([re])=>re.test(itemName||"")), cq=CHEEKY_ITEM.find(([re])=>re.test(itemName||""));
    const r=Math.random();
    if(cq&&r<.5){say=cq[1];mood="wink";ST().cheeky++;}
    else if(r>.93){say=pickNew(CHEEKY);mood="wink";ST().cheeky++;}
    else if(q&&r<.7) say=q[1];
    else if(S.bet&&r<.3) say=pickNew(BET_LINES);
    else if((h>=22||h<5)&&r<.15) say="Nachtschicht, Nicola? Respekt.";
    else if(h>=5&&h<8&&r<.15) say="So früh schon so fleißig!";
    else if(itemName&&r<.45) say=pick(ITEM_TPL).replace("{i}",itemName.split(/ [\/+(]/)[0]);
    else say=pickNew(PRAISE);
  }
  lastSay=say;
}

/* ---------- Konfetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"), x=c.getContext("2d"); c.hidden=false;
  const W=c.width=innerWidth, H=c.height=innerHeight, cs=getComputedStyle(document.documentElement);
  const cols=["--accent","--sun","--blush"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:pick(cols)}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<180) requestAnimationFrame(step); else {x.clearRect(0,0,W,H);c.hidden=true}})();
}

  const fill=document.getElementById("g-fill"); fill.style.height=Math.min(volPct,100)+"%"; fill.className="fill "+lvl(volPct);
  document.getElementById("g-case").hidden=isBus(); document.getElementById("g-bus").hidden=!isBus();

  const bp=isBus()?volPct:kgPct; const kb=document.getElementById("g-kgbar"); kb.style.width=Math.min(bp,100)+"%"; kb.className=lvl(bp);
  document.getElementById("g-kg").textContent="≈ "+fmt(kg)+" kg";

const clock=sec=>{sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const occName=k=>(OCC.find(o=>o[0]===k)||["",k])[1];
const BUCKETS=[[1,1,"1 Tag"],[2,3,"2–3 Tage"],[4,6,"4–6 Tage"],[7,999,"7+ Tage"]];

const big=n=>{const u=[[1e12,"Billionen"],[1e9,"Milliarden"],[1e6,"Millionen"]];for(const [v,w] of u) if(n>=v) return fmt(n/v,n/v<10?1:0)+" "+w; return Math.round(n).toLocaleString("de-DE");};
// Pilz-Fakten, abwechselnd
const FUNGI=[
  sec=>"Ein handflächengroßes Stück Flacher Lackporling hat in der Zeit bis zu "+big(4.65e9/86400*sec)+" Sporen in die Luft geblasen.",
  sec=>{const cm=sec/3600*12.5;return cm<21?"Die Schleierdame, ein tropischer Pilz, wächst bis zu 12,5 cm pro Stunde. In deiner Zeit wäre sie bis zu "+fmt(cm,1)+" cm in die Höhe geschossen.":"Die Schleierdame wächst bis zu 12,5 cm pro Stunde. In deiner Zeit wäre sie schon komplett ausgewachsen, gut 20 cm hoch."},
  sec=>"Bäckerhefe ist auch ein Pilz und verdoppelt sich etwa alle 90 Minuten. Aus 1.000 Hefezellen wären in deiner Zeit rund "+Math.round(1000*Math.pow(2,sec/5400)).toLocaleString("de-DE")+" geworden.",
  sec=>{const mm=sec*0.5/1000;return "Ein einzelner Faden vom Roten Brotschimmel wächst etwa einen halben Mikrometer pro Sekunde. In deiner Zeit wäre er "+(mm<1?fmt(mm*1000,0)+" Mikrometer":fmt(mm,1)+" mm")+" länger geworden."},
  sec=>"Ein einziger Wiesen-Champignon schießt rund 31.000 Sporen pro Sekunde von seinen Lamellen. In deiner Zeit wären das "+big(31000*sec)+" gewesen."
];
function funFacts(sec,items,r){
  if(r&&!r.ff){const idx=FUNGI.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,2);r.ff=idx;const sc=(S.scores||[]).find(x=>x.date===r.date);if(sc)sc.ff=idx;save();}
  const pickF=(r&&r.ff)||[0,4];
  const f=[], km=sec*17, earth=km/40075;
  f.push("Die Raumsonde Voyager 1 ist in der Zeit rund "+Math.round(km).toLocaleString("de-DE")+" km weiter ins All geflogen"+(earth>=1?", das ist "+fmt(earth,1)+"-mal um die Erde.":", das ist "+Math.round(earth*100)+" % einer Erdumrundung."));
  f.push("Dein Körper hat währenddessen rund "+big(2.4e6*sec)+" neue rote Blutkörperchen gebildet, etwa 2,4 Millionen pro Sekunde.");
  pickF.forEach(i=>f.push(FUNGI[i](sec)));
  f.push("Die Erde ist dabei rund "+Math.round(sec*29.8).toLocaleString("de-DE")+" km um die Sonne gesaust.");
  if(items) f.push("Das sind im Schnitt "+fmt(sec/items,1)+" Sekunden pro eingepacktem Teil.");
  return f;
}

function unlockRandom(equip=true){
  const pool=WARD.filter(w=>!unlocked().includes(w.id));
  if(!pool.length) return null;
  const w=pick(pool); unlocked().push(w.id);
  if(equip){const L=look(); S.tobi=Object.assign(L,{w:Object.assign({},L.w||{},{[w.slot]:w.id})});}

function recordResult(){
  if(!S.bet) return;

  const sec=Math.round(elapsed()), items=allItems().filter(i=>S.checks[i.id]).length;
  const prevBest=best(bucketOf(S.days));
  const res={sec,target:S.bet.target,won:sec<=S.bet.target*60,date:new Date().toISOString(),occ:S.occ,days:S.days,items,record:prevBest==null||sec<prevBest,prize:[]};
  res.bonus=res.won?1:0; S.taler=(S.taler||0)+res.bonus; ST().talerEarned=(ST().talerEarned||0)+res.bonus;
  S.scores.push(res); S.lastResult=res; S.bet=null; save();
}

function weightedLocked(exclude){
  const locked=WARD.filter(w=>!unlocked().includes(w.id)&&!exclude.includes(w.id));
  if(!locked.length) return null;
  const tot=locked.reduce((a,w)=>a+rarityOf(w)[2],0); let r=Math.random()*tot;
  for(const x of locked){r-=rarityOf(x)[2]; if(r<=0) return x.id}
  return locked[0].id;
}
function makeContents(){

        <span class="tico"><svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.ic}</svg></span>
        <b>${t.n}</b><small>${S.todo[t.id]?"Erledigt":t.d}</small></button>`).join("")}</div></div>`).join("")}
    <button class="btn big" id="abfahrt">${all?"Abfahrt!":"Trotzdem losfahren"}</button>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t;S.todo[id]=!S.todo[id];
    if(S.todo[id]){say=TODO_SAY[id];mood="cheer";hop=true}save();render()});
  app.querySelector("#edit").onclick=()=>{S.step=-1;save();render();scrollTo(0,0)};
  app.querySelector("#abfahrt").onclick=()=>{S.checkDone=true;save();render();scrollTo(0,0)};
}

/* ---------- Glücksrad ---------- */
const WSHORT={"Kuchen mit Tobi im Café":"Kuchen","Sandwich im Cocoon":"Sandwich","Tanzen im Wohnzimmer":"Tanzen","Dringende Uber-Fahrt in Berlin":"Uber",
  "Handmassage":"Handmassage","Fußmassage":"Fußmassage","Tobi wäscht deine Wäsche":"Wäsche","Essen beim Da Giorgio":"Da Giorgio",
  "Tobi verrät ein Aborea-Geheimnis":"Aborea","Tobi kocht, was immer du willst":"Tobi kocht"};
const WCOL=["#F2B84B","#3E8B5C","#E86A8A","#4C7BD9","#9B6BD6","#F28B5B","#5BB6B0","#C2185B","#7A8C3A","#E5A100"];
S.wspins=S.wspins||0;
let wRot=0, wTurning=false, wResult=null, wShow=null;
function wheelSegs(){
  const counts={}; S.deck.forEach(t=>counts[t]=(counts[t]||0)+1);
  const types=GUTSCHEINE.map(g=>g[0]).filter(t=>counts[t]);
  const tot=S.deck.length; let a=0;
  return types.map((t,i)=>{const sweep=counts[t]/tot*360, seg={t,n:counts[t],a0:a,a1:a+sweep,col:WCOL[GUTSCHEINE.findIndex(g=>g[0]===t)%WCOL.length]};a+=sweep;return seg});
}
function wheelSvg(segs){
  const R=140,c=150,pt=(ang,r)=>[c+r*Math.sin(ang*Math.PI/180),c-r*Math.cos(ang*Math.PI/180)];
  if(!segs.length) return `<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="140" fill="var(--bg)" stroke="var(--line)" stroke-width="4"/></svg>`;
  const paths=segs.map(s=>{
    if(segs.length===1) return `<circle cx="${c}" cy="${c}" r="${R}" fill="${s.col}"/>`;
    const [x0,y0]=pt(s.a0,R),[x1,y1]=pt(s.a1,R),large=s.a1-s.a0>180?1:0;
    return `<path d="M${c} ${c} L${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} Z" fill="${s.col}" stroke="#fff" stroke-width="2"/>`;}).join("");
  const labels=segs.map(s=>{const mid=(s.a0+s.a1)/2,[x,y]=pt(mid,R*.62),rot=mid>180?mid+90:mid-90;
    return `<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" text-anchor="middle" dominant-baseline="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="${s.a1-s.a0<22?9:12}" fill="#fff">${esc(WSHORT[s.t]||s.t)}${s.n>1?" ×"+s.n:""}</text>`}).join("");
  return `<svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="146" fill="#2B2233"/>${paths}${labels}<circle cx="150" cy="150" r="20" fill="#2B2233"/><circle cx="150" cy="150" r="8" fill="#FFD54F"/></svg>`;
}
function renderWheel(){
  const segs=(wResult||wTurning)&&wShow?wShow:wheelSegs(), open=S.vouchers.filter(v=>!v.used);
  const talk=say||(wResult?"Gewonnen: "+wResult+"! Einlösen bei Tobi persönlich.":wTurning?"Es dreht sich… es dreht sich…":S.wspins?"Du hast "+S.wspins+" Dreh"+(S.wspins>1?"s":"")+" am Glücksrad! Na los!":S.deck.length?"Drehs fürs Glücksrad gibt's mit drei Würmern am Jackpot.":"Alle Gutscheine sind vergeben. Wow, Nicola!");
  app.innerHTML=`
    <div class="top"><span class="label">Glücksrad</span><button class="link" id="back">Zurück</button></div>
    ${buddy(talk,wResult?"cheer":"wave")}
    <div class="wheelbox">
      <div class="pointer"></div>
      <div class="wheel" id="wheel" style="transform:rotate(${wRot}deg)">${wheelSvg(segs)}</div>
    </div>
    <span class="muted" style="text-align:center">${S.wspins&&S.deck.length?"Schubs das Rad mit dem Daumen an oder tipp auf den Knopf. ":""}${S.deck.length} Gutscheine übrig · ${wheelSegs().length} Felder.</span>
    <button class="btn big" id="wspin" ${S.wspins&&S.deck.length&&!wTurning?"":"disabled"}>${wTurning?"Dreht…":S.wspins?"Rad drehen ("+S.wspins+")":"Kein Dreh übrig"}</button>
    ${S.wspins?"":`<button class="link" id="tojp" style="align-self:center">Zum Tobi-Jackpot</button>`}
    <div class="group">
      <span class="label">Deine Gutscheine · ${open.length} offen</span>
      ${open.length?`<div class="list">${open.map(v=>`
        <div class="item kv voucher">
          <span class="settop"><b>${esc(v.text)}</b><span class="code">${v.code}</span></span>
          <span class="muted" style="font-weight:400">${v.revived?"Wiederbelebt":"Gewonnen"} am ${new Date(v.date).toLocaleDateString("de-DE")}. Bei Tobi persönlich einlösen.</span>
          <button class="link redeem" data-v="${v.id}">${confirmId===v.id?"Wirklich eingelöst? Nochmal tippen.":"Als eingelöst markieren"}</button>
        </div>`).join("")}</div>`:`<div class="list"><div class="empty">Noch keine Gutscheine.</div></div>`}
    </div>
    <div class="group">
      <span class="label">Gutschein-Sammlung · ${S.vouchers.length} gewonnen · ${S.deck.length} noch im Rad</span>
      <div class="vgrid">${S.vouchers.map(v=>`<div class="vcard${v.used?" used":""}${v.id===newVoucher?" fresh":""}"><b>${esc(v.text)}</b><small>${v.used?"Eingelöst":v.revived?"Wiederbelebt":"Offen"}</small></div>`).join("")}${Array.from({length:S.deck.length},()=>`<div class="vcard back"><span>?</span></div>`).join("")}</div>
    </div>`;
  const q=x=>app.querySelector(x);
  q("#back").onclick=()=>{if(wTurning)return;wResult=null;wShow=null;confirmId=null;S.step=-1;save();render();scrollTo(0,0)};
  if(q("#tojp")) q("#tojp").onclick=()=>{wResult=null;slotMsg=null;S.step=-6;save();render();scrollTo(0,0)};
  app.querySelectorAll(".redeem").forEach(b=>b.onclick=()=>{const id=b.dataset.v;
    if(confirmId===id){S.vouchers.find(x=>x.id===id).used=Date.now();confirmId=null;save();} else confirmId=id; render()});
  const canSpin=()=>!wTurning&&S.wspins>0&&S.deck.length>0;
  function doSpin(dir=1,turns=6){
    if(!canSpin()) return;
    const w=app.querySelector("#wheel");
    if(wResult){wResult=null;wShow=null;w.innerHTML=wheelSvg(wheelSegs());}
    const cur=wheelSegs(); wShow=cur;
    const idx=Math.floor(Math.random()*S.deck.length), text=S.deck[idx], seg=cur.find(x=>x.t===text);
    const target=seg.a0+(seg.a1-seg.a0)*(.15+Math.random()*.7);
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const want=((360-target)%360+360)%360, mod=x=>((x%360)+360)%360;
    if(reduce) turns=1;
    wRot = dir>0 ? wRot+turns*360+mod(want-wRot) : wRot-turns*360-mod(wRot-want);
    S.wspins--; S.deck.splice(idx,1);
    S.vouchers.push({id:String(Date.now())+Math.random().toString(36).slice(2,5),text,code:voucherCode(),date:Date.now(),used:null});
    newVoucher=S.vouchers[S.vouchers.length-1].id; save();
    wTurning=true;
    const dur=reduce?0:3.2+turns*.25;
    w.style.transition=reduce?"none":`transform ${dur}s cubic-bezier(.12,.8,.2,1)`; void w.offsetWidth; w.style.transform=`rotate(${wRot}deg)`;
    const btn=app.querySelector("#wspin"); btn.disabled=true; btn.textContent="Dreht…";
    setTimeout(()=>{wTurning=false;wResult=text;hop=true;render();confetti()},reduce?60:dur*1000+200);
  }
  q("#wspin").onclick=()=>doSpin(1,6);
  // Mit dem Daumen anschubsen
  const wb=q(".wheelbox"), w=q("#wheel");
  let drag=null;
  const ang=e=>{const r=wb.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
  wb.onpointerdown=e=>{ if(wTurning) return;
    if(wResult&&canSpin()){wResult=null;wShow=null;w.innerHTML=wheelSvg(wheelSegs());}
    wb.setPointerCapture(e.pointerId); w.style.transition="none";
    drag={a0:ang(e),r0:wRot,last:ang(e),t:performance.now(),v:0,moved:0}; };
  wb.onpointermove=e=>{ if(!drag) return;
    const a=ang(e); let d=a-drag.last; if(d>180)d-=360; if(d<-180)d+=360;
    const now=performance.now(), dt=Math.max(1,now-drag.t);
    drag.v=.6*drag.v+.4*(d/dt); drag.last=a; drag.t=now; drag.moved+=Math.abs(d);
    wRot+=d; w.style.transform=`rotate(${wRot}deg)`; };
  const up=()=>{ if(!drag) return; const v=drag.v, moved=drag.moved; drag=null;
    if(Math.abs(v)>.25&&moved>15){
      if(canSpin()) doSpin(v>0?1:-1, Math.round(Math.min(9,Math.max(3,Math.abs(v)*6))));
      else { say=S.deck.length?"Erst brauchst du einen Dreh. Drei Würmer am Jackpot!":"Alle Gutscheine sind vergeben."; hop=true; render(); }
    } };
  wb.onpointerup=up; wb.onpointercancel=up;
}

/* ---------- Einstellungen: Probemodus & Zurücksetzen ---------- */
let wipeArm=false;
function enterTest(){
  try{localStorage.setItem(KEY+"-real",JSON.stringify(S))}catch(e){}
  S.realBackup=JSON.stringify(Object.assign({},S,{realBackup:undefined}));
  S.test=true; S.vRound={min:1,max:2,wins:0}; S.taler=(S.taler||0)+10; S.wspins=(S.wspins||0)+1; save();
}
function exitTest(){
  let real=null; try{real=JSON.parse(S.realBackup||localStorage.getItem(KEY+"-real")||"null")}catch(e){}
  if(real){ delete real.realBackup; S=real; }
  S.test=false; delete S.realBackup; try{localStorage.removeItem(KEY+"-real")}catch(e){}
  S.step=-1; save();
}
function renderSettings(){
  app.innerHTML=`
    <div class="top"><span class="label">Einstellungen</span><button class="link" id="back">Zurück</button></div>
    ${buddy(S.test?"Probemodus läuft. Klick dich ruhig durch, nichts davon zählt.":"Hier kannst du alles ausprobieren oder ganz von vorn anfangen.","wave")}
    <div class="card">
      <div class="settop"><b>Probemodus</b><span class="muted">${S.test?"an":"aus"}</span></div>
      <span class="muted">Zum Rumklicken: Du bekommst 10 Taler und einen Glücksrad-Dreh zum Testen. Wenn du den Probemodus beendest, ist alles wieder genau wie vorher. Gewonnene Gutscheine, Erfolge und Rekorde aus dem Probemodus zählen nicht.</span>
      <button class="btn ${S.test?"ghost":""}" id="testbtn">${S.test?"Probemodus beenden":"Probemodus starten"}</button>
    </div>
    <div class="card">
      <div class="settop"><b>Alles zurücksetzen</b></div>
      <span class="muted">Löscht Reisen, Taler, Erfolge, Bestenliste, Tobis Garderobe und die Gutscheine. Der Gutschein-Stapel wird neu gemischt.</span>
      <button class="btn ghost danger" id="wipe">${wipeArm?"Wirklich alles löschen? Nochmal tippen.":"Alles zurücksetzen"}</button>
    </div>`;
  app.querySelector("#back").onclick=()=>{wipeArm=false;S.step=-1;save();render();scrollTo(0,0)};
  app.querySelector("#testbtn").onclick=()=>{ if(S.test){exitTest();say="Probemodus beendet. Alles wie vorher!";} else {enterTest();S.step=-1;say="Probemodus! Klick dich durch, nichts davon zählt.";} hop=true;save();render();scrollTo(0,0)};
  app.querySelector("#wipe").onclick=()=>{ if(!wipeArm){wipeArm=true;render();return}
    try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-real")}catch(e){}
    location.reload(); };
}

/* Bulli-Belohnung: ein schon gezogener Gutschein kommt nochmal */
function reviveVoucher(){
  const texts=[...new Set((S.vouchers||[]).map(v=>v.text))];
  if(!texts.length){S.wspins=(S.wspins||0)+1;return {spin:true};}
  const text=pick(texts);
  S.vouchers.push({id:String(Date.now())+Math.random().toString(36).slice(2,5),text,code:voucherCode(),date:Date.now(),used:null,revived:true});
  return {text};
}
const TRIP_COINS=2;
function grantItem(){ const id=weightedLocked([]); if(id) unlocked().push(id); return id; }
S.boxes=0;
/* ---------- Gesamtleistung ---------- */
function renderStats(){
  const s=ST(), sc=S.scores||[], won=sc.filter(r=>r.won).length;
  const betSec=sc.reduce((a,r)=>a+r.sec,0), bestSec=sc.length?Math.min(...sc.map(r=>r.sec)):null;
  const vou=S.vouchers||[], used=vou.filter(v=>v.used).length, rev=vou.filter(v=>v.revived).length;
  const oc=s.occCount||{}, fav=Object.entries(oc).sort((a,b)=>b[1]-a[1])[0];

  app.innerHTML=`
    <div class="top"><span class="label">Gesamtleistung</span><button class="link" id="back">Zurück</button></div>
    ${buddy(s.trips?`Nicola, schau dir das an: ${s.trips} ${s.trips===1?"Reise":"Reisen"} gepackt! Ich bin richtig stolz.`:"Hier sammelt sich alles, was du schaffst. Pack deine erste Reise!","cheer")}
    <div class="group"><span class="label">Packen</span>
      <div class="stiles">
        ${tile(s.trips,"Reisen gepackt",(s.t3?s.t3+" davon mit dem T3":""))}
        ${tile((s.pieces||0).toLocaleString("de-DE"),"Teile eingepackt",s.trips&&s.pieces?"im Schnitt "+Math.round(s.pieces/s.trips)+" pro Reise":"")}
        ${tile(fav?esc(OCC_SHORT[fav[0]]||fav[0]):"–","Lieblingsanlass",fav?fav[1]+"-mal":"")}
        ${tile((s.days||0),"Reisetage verplant","")}
      </div></div>
    <div class="group"><span class="label">Wetten & Spielen</span>
      <div class="stiles">
        ${tile(won+" / "+sc.length,"Wetten gewonnen","")}
        ${tile(bestSec!=null?clock(bestSec):"–","Bestzeit","")}
        ${tile(s.talerEarned||0,"Taler verdient",(s.spins||0)+" Jackpot-Drehs")}
        ${tile(vou.length,"Gutscheine gewonnen",used+" eingelöst"+(rev?" · "+rev+" wiederbelebt":""))}
      </div></div>
    <div class="group"><span class="label">Sammeln</span>
      <div class="stiles">
        ${tile(unlocked().length+" / "+WARD.length,"Teile für Tobi",THEMES().filter(themeDone).length+" Sammlungen komplett")}
        ${tile(achN+" / "+ACH.length,"Erfolge","")}
      </div></div>
    ${betSec?`<div class="group"><span class="label">In all deiner Wett-Zeit (${hours(betSec)})</span>
      <div class="list">
        <div class="item" style="cursor:default">Voyager 1 ist ${Math.round(betSec*17).toLocaleString("de-DE")} km weiter ins All geflogen.</div>
        <div class="item" style="cursor:default">Dein Körper hat ${big(2.4e6*betSec)} rote Blutkörperchen gebildet.</div>
        <div class="item" style="cursor:default">Ein Wiesen-Champignon hätte ${big(31000*betSec)} Sporen geschossen.</div>
      </div></div>`:""}`;
  app.querySelector("#back").onclick=()=>{S.step=statsBack;save();render();scrollTo(0,0)};
}
let statsBack=-1;

/* Packliste im Überblick am Ende */
let ovFilter="all";
function overviewHtml(){
  const parts=ZONES.map(z=>{
    const l=itemsFor(z.id), inn=l.filter(i=>S.checks[i.id]);
    const show=l.filter(i=>ovFilter==="all"||(ovFilter==="in")===!!S.checks[i.id]);
    if(!show.length) return "";
    return `<div class="ovzone"><div class="settop"><b>${z.name}</b><span class="muted">${inn.length} / ${l.length}</span></div>
      <ul class="ovlist">${show.map(i=>{const on=!!S.checks[i.id];return `<li class="${on?"in":"out"}" data-ov-id="${esc(i.id)}"><span class="ovmark">${on?"✓":"–"}</span><span>${esc(i.n)}</span>
        <span class="mini-step"><button class="ms" data-ovd="-1" aria-label="Eins raus" ${on?"":"disabled"}>−</button><span class="qty ${on?(cnt(i)!==(i.q??1)?"changed":"match"):"zero"}">${on?cnt(i):0}</span><button class="ms plus" data-ovd="1" aria-label="${on?"Eins mehr":"Einpacken"}">+</button></span></li>`}).join("")}</ul></div>`;
  }).join("");
  const all=allItems(), n=all.filter(i=>S.checks[i.id]).length;
  return `<span class="muted" style="font-size:.85rem">Was umpacken? Mit + und − kannst du hier noch alles ändern.</span><span class="muted" style="font-size:.85rem">${n} von ${all.length} Sachen eingepackt, ${all.filter(i=>S.checks[i.id]).reduce((a,i)=>a+cnt(i),0)} Stück insgesamt.</span>`+(parts||`<div class="list"><div class="empty">${ovFilter==="out"?"Nichts vergessen. Alles drin!":"Noch nichts eingepackt."}</div></div>`);
}
render();
