<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aborea Charakterbogen</title>
<meta name="theme-color" content="#e9e5dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>
@font-face{font-family:"IM Fell English SC";src:url(fonts/fell.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Alegreya Sans";font-weight:400;src:url(fonts/alegreya-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Alegreya Sans";font-weight:500;src:url(fonts/alegreya-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Alegreya Sans";font-weight:700;src:url(fonts/alegreya-700.woff2) format("woff2");font-display:swap}
</style>
</head><body>
<style>
/* Layout: one column for the phone, sticky character bar on top, four tabs in a fixed bottom bar, roll results slide up above the tabs */
:root{
  --bg:#e9e5dc; --card:#f7f5f0; --ink:#2a231b; --muted:#6c6253; --line:#d2c9b9;
  --accent:#6b4c25; --lp:#a3302a; --lp-soft:#f1dcd9; --mp:#2d5a87; --mp-soft:#dbe5ef;
  --ok:#3d6b35; --bad:#a3302a;
  --display:"IM Fell English SC","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1814; --card:#24211c; --ink:#ece5d7; --muted:#a59a89; --line:#3b352c;
  --accent:#d0ab72; --lp:#e2685e; --lp-soft:#3a2321; --mp:#76a7d8; --mp-soft:#1f2c3a;
  --ok:#8cc07f; --bad:#e2685e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1814; --card:#24211c; --ink:#ece5d7; --muted:#a59a89; --line:#3b352c;
  --accent:#d0ab72; --lp:#e2685e; --lp-soft:#3a2321; --mp:#76a7d8; --mp-soft:#1f2c3a;
  --ok:#8cc07f; --bad:#e2685e; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.charbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.charbtn .n{font-family:var(--display);font-size:1.45rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.charbtn .s{font-size:.85rem;color:var(--muted)}
.mini{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem}
.mini span{padding:3px 8px;border-radius:6px}
.mini .l{background:var(--lp-soft);color:var(--lp)} .mini .m{background:var(--mp-soft);color:var(--mp)}
.mini button.l,.mini button.m{border:0;font:inherit;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer;min-width:36px}
.pool.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.pool.flash{animation:none}}
.mini{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini .a{display:grid;place-items:center;min-width:40px;min-height:30px;border:0;font:inherit;font-weight:700;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);cursor:pointer}
.mini .undo{border:1px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:.85rem;padding:3px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:22px 0 8px;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=number],input:not([type]),textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:42px}
input[type=number]{font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:500}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--card);border-color:var(--accent)}
.btn.small{min-height:36px;padding:0 10px;font-size:.9rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
/* pools */
.pool{display:grid;gap:10px}
.pool + .pool{margin-top:12px}
.pool .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pool .val{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pool .val small{font-size:1.1rem;color:var(--muted);font-weight:500}
.pool.lp .val{color:var(--lp)} .pool.mp .val{color:var(--mp)}
.prow{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.prow .minus{color:var(--lp);font-weight:700} .mp .prow .minus{color:var(--mp)}
.qrow{display:flex;gap:6px;flex-wrap:wrap}
.qrow .btn{flex:1;min-width:52px;font-variant-numeric:tabular-nums}
.maxrow{display:flex;align-items:center;gap:6px}
.maxrow input{width:72px}
.cright{margin-left:auto;display:flex;gap:8px;align-items:center}
.cright .armor{margin-left:0}
/* dice */
.die{width:44px;height:44px;flex:none;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;cursor:pointer}
.die svg{width:24px;height:24px}
.die:active{background:var(--accent);color:var(--card)}
/* rows */
.rows{display:grid;gap:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{flex:1;min-width:0;font-weight:500}
.row .name input{min-height:38px}
.row .tot{min-width:38px;text-align:right;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.attr .key{font-family:var(--display);font-size:1.35rem;width:52px}
.attr .f{width:70px} .attr .f .lab{font-size:.65rem}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{width:34px;height:38px;border:0;background:var(--bg);cursor:pointer;font-size:1.1rem}
.step input{width:40px;min-height:38px;border:0;border-radius:0;padding:0;background:var(--card)}
.skill{display:grid;grid-template-columns:1fr auto auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .nm{font-weight:500;min-width:0}
.skill .det{grid-column:1/-1;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.skill .det > div{display:grid;gap:3px}
.skill .det input[type=number]{width:62px}
.skill .det .kost{width:84px}
.skill .tot{font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.comb{display:grid;gap:8px}
.comb .head{display:flex;align-items:center;gap:10px}
.comb .head .t{flex:1;font-family:var(--display);font-size:1.3rem}
.comb .head .tot{font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.comb .parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.comb .parts > div{display:grid;gap:3px;min-width:0}
.comb .parts .lab{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.kw b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.kw span{font-size:.85rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kparts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;align-items:end}
.comb .head .tot small{font-size:.8rem;color:var(--muted);font-weight:600}
.initog{background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.initog i{font-style:normal;font-family:var(--body);font-size:.75rem;color:var(--muted)}
.inil{display:grid;gap:2px;font-size:.92rem}
.inil>div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.inil>div:last-child{border-bottom:0}
.inil i{font-style:normal;color:var(--muted);font-size:.8rem}
.inil b{font-variant-numeric:tabular-nums}
.comb + .comb{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
/* bottom nav */
nav{background:var(--bg)}
nav .in{max-width:560px;margin:0 auto;display:flex;padding-inline:6px}
nav button{flex:1 1 0;padding:0 4px;background:none;border:0;min-height:58px;cursor:pointer;color:var(--muted);font-size:1.02rem;font-weight:700;letter-spacing:.02em;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
/* roll panel */
#roll{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:7;pointer-events:none}
#roll .box{pointer-events:auto;max-width:528px;margin:0 auto 10px;width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#roll .box{animation:none}}
#roll .res{font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
#roll .info{flex:1;min-width:0}
#roll .what{font-weight:700}
#roll .calc{font-size:.88rem;opacity:.8;font-variant-numeric:tabular-nums}
#roll .tag{display:inline-block;margin-top:3px;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--bg);color:var(--ink)}
.dz{position:relative;width:50px;height:50px;display:grid;place-items:center;flex:none}
.dz svg{position:absolute;inset:0;width:100%;height:100%}
.dz svg .f{fill:var(--bg);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.dz svg .e{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:.6}
.dz span{position:relative;font-weight:700;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:-4px}
#roll .box.rb{flex-direction:column;align-items:stretch;gap:8px}
#roll .brow{display:flex;align-items:center;gap:12px}
#roll .track{position:relative;height:56px;overflow:hidden;border-radius:8px;background:color-mix(in srgb,var(--bg) 9%,transparent);border-right:3px solid color-mix(in srgb,var(--bg) 35%,transparent)}
.track .dz{position:absolute;left:0;top:3px;will-change:transform}
.dz.max span{color:var(--ok)} .dz.min span{color:var(--bad)}
.dz.max svg .f{stroke:var(--ok);stroke-width:3}
#roll .res.wait{opacity:.35}
#roll .res.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){#roll .res.pop{animation:none}}
.die.again,.btn.again{background:var(--ok);border-color:var(--ok);color:var(--card);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ok) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.die.again,.btn.again{animation:none}}
#roll .track.waiting{cursor:pointer}
#roll .x{background:none;border:0;color:var(--bg);opacity:.7;font-size:1.4rem;cursor:pointer;min-width:36px;min-height:36px}
/* sheet (char list) */
.clist{display:grid;gap:6px;margin:10px 0 14px}
.clist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;min-height:48px}
.clist button.on{border-color:var(--accent)}
.empty{text-align:center;padding:40px 10px}
.empty h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 6px}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
/* kampf */
.pips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.pips i{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent)}
.pips i.on{background:var(--accent)}
.kstack{display:grid;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:18px;min-height:36px;padding:0 14px;cursor:pointer;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.w10s .lab{margin-bottom:6px}
.wsl{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;background:var(--card);touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;outline:none}
.wsl:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.wsl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wsl-top b{font-size:1.6rem;letter-spacing:0;font-variant-numeric:tabular-nums;vertical-align:-2px}
.wsl-top .t b{color:var(--accent)} .wsl-top .s b{color:var(--lp)}
.wsl-track{position:relative;display:grid;align-items:center;justify-items:center;min-height:48px;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent) 0 var(--p),color-mix(in srgb,var(--lp) 13%,transparent) var(--p) 100%)}
.wsl-track i{width:24px;height:24px;border-radius:4px;transform:rotate(45deg) scale(.8);transition:background .12s}
.wsl-track i.t{background:var(--accent)} .wsl-track i.s{background:var(--lp)}
.wsl-knob{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px var(--card);transition:left .12s}
.wsl.drag .wsl-knob{transition:none;width:8px;margin-left:-4px}
.dots i{width:16px;height:16px;transform:rotate(45deg);border-radius:3px}
.btn.big{min-height:52px;font-size:1.05rem;font-weight:700;width:100%}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--card)}
.result{border-left:4px solid var(--accent);padding:4px 0 4px 12px;display:grid;gap:8px}
.result.kopf{border-color:var(--ok)} .result.koerper{border-color:var(--accent)} .result.verfehlt{border-color:var(--bad)}
.result .rl{font-size:1.05rem;font-variant-numeric:tabular-nums} .result .rl b{font-size:1.3rem} .result b.big{font-size:1.8rem}
.result .rz{font-weight:700}
.mana{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.weapon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.weapon:first-child{padding-top:0}
.weapon .full{grid-column:1/-1}
select{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 8px;font:inherit;color:inherit}
.dz.sm span{font-size:.95rem}
.dz.neg svg .f{stroke:var(--bad);stroke-width:2.5}
.dz.neg span{color:var(--bad)}
.rules p,.rules ol,.rules dl{margin:0 0 10px} .rules > :last-child{margin-bottom:0}
.rules ol{padding-left:20px;display:grid;gap:6px}
.rules dl{display:grid;grid-template-columns:1fr;gap:0}.rules dd{margin:0 0 8px;color:var(--ink)}.rules dt{color:var(--accent)} .rules dt{font-weight:700} .rules dd{margin:0}
.slots{display:grid;gap:8px}
.slots.bottom{border-top:1px solid var(--line);padding-top:12px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.slot.full{border-style:solid;border-color:var(--accent);background:var(--bg)}
.slot .sn{font-weight:700;font-size:1.1rem}
.slot:not(.full) .sn{color:var(--muted);font-weight:500}
.stepbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.stepbox.act{border-color:var(--accent);border-width:2px}
.stepbox.off{opacity:.6}
.stepbox .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepbox .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.pcs{display:flex;gap:6px;flex-wrap:wrap}
.pc{display:grid;padding:4px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line);line-height:1.2}
.pc small{font-size:.72rem;color:var(--muted)}
.zbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn:disabled{opacity:.5;cursor:default}
.weapon.eq{background:color-mix(in srgb,var(--accent) 7%,transparent);margin-inline:-14px;padding-inline:14px}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:1.1rem}
.badge{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--accent);color:var(--card)}
.wbtns{display:flex;gap:8px;flex-wrap:wrap}
#apbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
#apbar .in{max-width:560px;margin:0 auto;padding:8px 12px;display:grid;gap:8px}
#apbar .aprow{display:flex;align-items:center;gap:10px}
#apbar .btnrow{display:flex;gap:6px}
#apbar .cnt{display:grid;flex:1;min-width:0;padding-left:10px;border-left:1px solid var(--line)}
#apbar .cnt .lab{font-size:.62rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#apbar .cnt b{font-size:1.35rem;line-height:1.05;font-variant-numeric:tabular-nums}
#apbar .cnt.on b{color:var(--ok)}
#apbar .cnt small{font-size:.75rem;color:var(--muted);white-space:nowrap}
#apbar .apn{display:grid;min-width:76px;flex:none}
#apbar .apn .lab{font-size:.62rem}
#apbar .apn b{font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
#apbar .apn small{font-size:.9rem;color:var(--muted);font-weight:500}
#apbar .pips{margin:4px 0 0;gap:3px}
#apbar .pips i{width:9px;height:9px;border-width:1.5px}
#apbar .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:.85rem;min-height:40px}
body.kampf #roll{bottom:calc(118px + env(safe-area-inset-bottom,0px))}
body.kampf .wrap{padding-bottom:250px}
.pool{grid-template-columns:minmax(0,1fr) 70px;gap:12px;align-items:stretch}
.pmain{display:grid;gap:10px;min-width:0}
.valrow{display:flex;align-items:baseline;gap:10px}
.delta{font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}

ify-content:flex-end; gap:8px; margin-top:16px; }\n\n  /* ---- an den Charakterbogen angeglichen ---- */\n  :root{\n    --bg:#e9e5dc; --panel:#f7f5f0; --panel-2:#e9e5dc; --line:#d2c9b9; --text:#2a231b; --muted:#6c6253;\n    --accent:#6b4c25; --accent-dim:#e8ddcb; --danger:#a3302a; --danger-dim:#f1dcd9; --ok:#3d6b35; --mana:#2d5a87; --on-accent:#f7f5f0;\n    --sans:\"Alegreya Sans\",\"Segoe UI\",system-ui,sans-serif; --heading:\"IM Fell English SC\",\"Palatino Linotype\",Georgia,serif;\n  }\n  @media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n    --bg:#1a1814; --panel:#24211c; --panel-2:#1a1814; --line:#3b352c; --text:#ece5d7; --muted:#a59a89;\n    --accent:#d0ab72; --accent-dim:#3a3021; --danger:#e2685e; --danger-dim:#3a2321; --ok:#8cc07f; --mana:#76a7d8; --on-accent:#1a1814; color-scheme:dark}}\n  :root[data-theme=\"dark\"]{\n    --bg:#1a1814; --panel:#24211c; --panel-2:#1a1814; --line:#3b352c; --text:#ece5d7; --muted:#a59a89;\n    --accent:#d0ab72; --accent-dim:#3a3021; --danger:#e2685e; --danger-dim:#3a2321; --ok:#8cc07f; --mana:#76a7d8; --on-accent:#1a1814; color-scheme:dark}\n  body{font-size:16px}\n  header{padding:12px 16px}\n  header h1{font-weight:400;font-size:22px}\n  .panel-title{font-weight:400;font-size:20px}\n  main{padding:16px}\n  .sticky-toolbar{top:64px}\n  .icon-btn{width:40px;height:40px;color:var(--accent);background:var(--panel)}\n  .icon-btn svg{width:20px;height:20px}\n  .icon-btn.primary{color:var(--on-accent);box-shadow:none}\n  .icon-btn.primary:hover,.icon-btn.primary.active{background:var(--accent);border-color:var(--accent);filter:brightness(.9)}\n  .settings-menu{background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.22);border-radius:12px}\n  .settings-menu-item{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;min-height:42px;color:var(--text)}\n  .settings-menu-item svg{color:var(--accent);flex:none}\n  button.btn{font-family:var(--sans);font-weight:700;font-size:14px;min-height:38px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}\n  button.btn.small{min-height:32px;font-size:13px}\n  button.btn.primary{color:var(--on-accent)}\n  button.btn.primary:hover{background:var(--accent);filter:brightness(.92)}\n  .tab-chip,.tab-add-select{font-family:var(--sans);font-weight:700;font-size:14px;min-height:38px}\n  .tab-chip.active,.info-subnav button.active{color:var(--on-accent)}\n  .spell-name{font-family:var(--sans);font-weight:700;font-size:17px}\n  .spell-desc,.points-spell-body .spell-desc{font-size:14px}\n  .spell-effekt,.points-spell-body .spell-effekt{font-size:14.5px}\n  .spell-details{font-size:13px}\n  .stufe-badge{font-family:var(--sans);background:var(--accent);color:var(--on-accent);border-color:var(--accent)}\n  .lvl-tag{font-family:var(--sans);background:transparent}\n  .cost-badge{font-family:var(--sans);background:var(--mana);color:var(--panel)}\n  .counter{font-family:var(--sans);font-size:14px}\n  .counter-btn{width:30px;height:30px;line-height:28px;font-size:16px;border-radius:7px}\n  .points-spell-title{font-size:15px}\n  .points-spell-lvl,.points-note,input[type=number],textarea{font-family:var(--sans)}\n  select,input[type=text],input[type=number],textarea{font-size:15px;border-radius:7px;color:var(--text)}\n  .kegel-icon{display:inline-block;vertical-align:-1px;color:var(--accent)}\n  .kegel-icon svg{width:13px;height:13px}\n  footer.status{font-size:12px}\n  .modal-box{border-radius:12px}\n  .tab-scroll{scrollbar-width:none;touch-action:pan-y;will-change:transform}\n  .tab-scroll::-webkit-scrollbar{display:none}\n  #activeSpellsList{touch-action:pan-y;will-change:transform}\n  .slidel{animation:slidel .26s cubic-bezier(.2,.8,.3,1)} .slider{animation:slider .26s cubic-bezier(.2,.8,.3,1)}\n  @keyframes slidel{from{transform:translateX(40%);opacity:.3}to{transform:none;opacity:1}}\n  @keyframes slider{from{transform:translateX(-40%);opacity:.3}to{transform:none;opacity:1}}\n  @media (prefers-reduced-motion:reduce){.slidel,.slider{animation:none}}\n  .tab-chip.active{color:var(--on-accent)}\n\n\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <h1>Spruchbuch<\/h1>\n  <div style=\"display:flex; gap:8px; position:relative;\">\n    <button class=\"icon-btn\" id=\"infoToggleBtn\" title=\"Regeln anzeigen\" aria-label=\"Regeln anzeigen\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v6\"/><circle cx=\"12\" cy=\"7.6\" r=\".6\" fill=\"currentColor\"/><\/svg><\/button>\n    <div style=\"position:relative;\">\n      <button class=\"icon-btn\" id=\"settingsMenuBtn\" title=\"Speichern, Laden, Drucken\" aria-label=\"Speichern, Laden, Drucken\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6\"/><circle cx=\"12\" cy=\"12\" r=\"6.3\"/><\/svg><\/button>\n      <div class=\"settings-menu\" id=\"settingsMenu\" style=\"display:none;\">\n        <button class=\"settings-menu-item\" id=\"saveFileBtn\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11M7.5 10.5 12 15l4.5-4.5\"/><path d=\"M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2\"/><\/svg>Speichern<\/button>\n        <button class=\"settings-menu-item\" id=\"loadFileBtn\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 15V4M7.5 8.5 12 4l4.5 4.5\"/><path d=\"M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2\"/><\/svg>Laden<\/button>\n        <button class=\"settings-menu-item\" id=\"printBtn\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 9V4h10v5\"/><rect x=\"4\" y=\"9\" width=\"16\" height=\"7\" rx=\"1.5\"/><path d=\"M7 14h10v6H7z\"/><\/svg>Drucken / PDF<\/button>\n      <\/div>\n    <\/div>\n    <button class=\"icon-btn primary\" id=\"verwaltungToggleBtn\" title=\"Bibliothek öffnen\" aria-label=\"Bibliothek öffnen\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5c-.8 0-1.5.5-1.5 1.2z\"/><path d=\"M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5.5 1.5 1.2z\"/><path d=\"M6.5 8h2.5M15 8h2.5\"/><\/svg><\/button>\n  <\/div>\n<\/header>\n<input type=\"file\" id=\"loadFileInput\" accept=\"application/json\" style=\"display:none;\">\n\n<main>\n\n  <section id=\"view-zauberbuch\">\n\n    <div id=\"infoPanel\" style=\"display:none;\">\n      <div class=\"toolbar\">\n        <button class=\"btn\" id=\"closeInfoBtn\">← Zurück zu Spruchlisten<\/button>\n      <\/div>\n      <nav class=\"info-subnav\">\n        <button class=\"btn small active\" data-act=\"infoTab\" data-tab=\"grundlagen\">Grundlagen<\/button>\n        <button class=\"btn small\" data-act=\"infoTab\" data-tab=\"begriffe\">Symbole &amp; Begriffe<\/button>\n      <\/nav>\n\n      <div id=\"infoTabGrundlagen\" class=\"info-block\">\n        <div class=\"section-title\" style=\"margin-top:0;\">Level<\/div>\n        <p>Jeder Zauber gehört zu einem Level (1–10) innerhalb seiner Spruchliste. Es beschreibt, wie mächtig bzw. anspruchsvoll der Zauber grundsätzlich ist, und geht direkt in die Mana-Kosten ein.<\/p>\n\n        <div class=\"section-title\">Stufe (erlernt)<\/div>\n        <p>In der Bibliothek (Buch-Symbol oben rechts) kannst du jeden freigeschalteten Zauber auf eine Stufe von 1–10 steigern. Das ist die maximale Kraft, die du in diesem Zauber \"gelernt\" hast — sie bestimmt, bis zu welcher Stufe du ihn später wirken kannst.<\/p>\n\n        <div class=\"section-title\">Wirken auf Stufe<\/div>\n        <p>Wenn du einen Zauber tatsächlich einsetzt, wählst du auf der Hauptseite, mit welcher Stufe du ihn diesmal wirkst — von 1 bis zu deiner erlernten Stufe. Eine niedrigere Wirk-Stufe kostet weniger Mana, bringt aber auch weniger Steigerung.<\/p>\n\n        <div class=\"section-title\">Mana-Kosten<\/div>\n        <p>Mana-Kosten = Level des Zaubers + gewirkte Stufe. Die Kosten stehen bei jedem Zauber direkt sichtbar in der Karte.<\/p>\n\n        <div class=\"section-title\">Effekt<\/div>\n        <p>Die Grundwirkung des Zaubers bei Stufe 1. Hat ein Zauber mehrere Effekte, sind sie einzeln als \"Effekt 1\", \"Effekt 2\" usw. aufgeführt und gelten immer alle zusammen.<\/p>\n\n        <div class=\"section-title\">Steigerung<\/div>\n        <p>Ab Stufe 2 kommt für jede weitere gewirkte Stufe eine Steigerung hinzu. Wie viele Steigerungs-Schritte du zur Verfügung hast, ergibt sich aus (gewirkte Stufe − 1).<\/p>\n        <p><b>UND:<\/b> Hat ein Zauber mehrere Steigerungs-Optionen, die mit UND verknüpft sind, gelten bei jedem Steigerungs-Schritt automatisch alle Optionen zusammen — hier gibt es nichts auszuwählen.<\/p>\n        <p><b>ODER:<\/b> Bei ODER-verknüpften Optionen verteilst du deine verfügbaren Steigerungs-Punkte frei auf die einzelnen Optionen (z.B. 2× Option A und 1× Option B bei 3 verfügbaren Punkten). Wie viel du bereits verteilt hast, siehst du direkt bei jeder Option.<\/p>\n\n        <div class=\"section-title\">Details<\/div>\n        <p>Zusätzliche Hinweise zum Zauber wie Reichweite, ob Berührung oder Sicht nötig ist, ob es sich um einen Fluch handelt, oder ob Konzentration (K*) erforderlich ist. Was diese Kürzel genau bedeuten, steht im Reiter \"Symbole &amp; Begriffe\".<\/p>\n\n        <div class=\"section-title\">Spruchlisten &amp; \"Liste gelernt\"<\/div>\n        <p>Zauber sind in Spruchlisten gruppiert. Über den Button \"Liste gelernt\" in der Verwaltung markierst du eine Liste als aktiv — erst dann erscheint sie als Reiter auf der Hauptseite mit deinen darin erlernten Zaubern.<\/p>\n      <\/div>\n\n      <div id=\"infoTabBegriffe\" class=\"info-block\" style=\"display:none;\">\n        <div class=\"section-title\" style=\"margin-top:0;\">Meter-Angabe (z.B. \"25m\")<\/div>\n        <p>Die maximale Reichweite, auf die der Zauber wirkt bzw. eingesetzt werden kann.<\/p>\n\n        <div class=\"section-title\">\"o&lt;\"<\/div>\n        <p>Der Zauber geht immer von dir selbst als Zaubernde*r aus — z.B. als Fläche, Kegel oder Linie, die direkt bei dir beginnt.<\/p>\n\n        <div class=\"section-title\">Berührung<\/div>\n        <p>Du musst das Ziel berühren, damit der Zauber wirkt.<\/p>\n\n        <div class=\"section-title\">Sicht<\/div>\n        <p>Das Ziel muss nur sichtbar sein — eine Berührung ist nicht nötig.<\/p>\n\n        <div class=\"section-title\">Gezielt<\/div>\n        <p>Das Ziel muss getroffen werden, in der Regel über die Fähigkeit \"Gezielte Sprüche\".<\/p>\n\n        <div class=\"section-title\">Fluch<\/div>\n        <p>Der Zauber gilt als Fluch und erhält dadurch eine Qualitätsstufe, basierend auf einem INT- oder CHA-Test. Flüche können durch einen Zauber gebrochen werden, dessen INT- oder CHA-Test höher ausfällt als die ursprüngliche Qualitätsstufe. Sie können auf Personen, Flächen oder Objekte gelegt werden.<\/p>\n\n        <div class=\"section-title\">K* (Konzentration)<\/div>\n        <p>Der Zauber muss durchgehend konzentriert werden, um aktiv zu bleiben. Es kann immer nur ein Konzentrationszauber gleichzeitig gewirkt sein. Erleidest du während der Konzentration Schaden, musst du einen Geistige-Stabilität-Test (GS-Test) bestehen — scheitert der, bricht die Konzentration ab.<\/p>\n      <\/div>\n    <\/div>\n\n    <div id=\"verwaltungPanel\" style=\"display:none;\">\n      <h2 class=\"panel-title\">Bibliothek<\/h2>\n\n      <div id=\"listDescWrap\" style=\"display:none;\">\n        <div class=\"rules-box clamp-3\" id=\"listDescBox\"><\/div>\n        <button class=\"rules-toggle-btn small\" id=\"listDescToggleBtn\">\n          <span class=\"expand-arrow\" id=\"listDescToggleArrow\">▶<\/span>\n          <span>mehr<\/span>\n        <\/button>\n      <\/div>\n\n      <button class=\"rules-toggle-btn small\" id=\"rulesToggleBtn\">\n        <span class=\"expand-arrow\" id=\"rulesToggleArrow\">▶<\/span>\n        <span>Regeln<\/span>\n      <\/button>\n      <div class=\"rules-box\" id=\"rulesBox\" style=\"display:none;\">\n        <b>Regeln:<\/b> Wähle eine Spruchliste und verteile Stufen (1–10) auf ihre Zauber. Aufgeklappt siehst du Details. Hat ein Zauber nur <b>eine<\/b> Steigerungs-Option, wird sie bei jeder Stufe über 1 automatisch angewendet. Hat er <b>mehrere<\/b> Optionen (ODER), verteilst du deine Punkte frei darauf. Mana-Kosten = Level des Zaubers + gewirkte Stufe. Ausführliche Erklärung: Info-Symbol oben rechts.\n      <\/div>\n\n      <div class=\"toolbar sticky-toolbar\" id=\"pointsToolbar\">\n        <select id=\"pointsListSelect\"><\/select>\n        <span class=\"counter\" id=\"listLevelCounter\" style=\"display:none;\">\n          Level\n          <button class=\"counter-btn\" data-act=\"listLevel-1\">−<\/button>\n          <span class=\"counter-val\" id=\"listLevelVal\">0<\/span>\n          <button class=\"counter-btn\" data-act=\"listLevel+1\">+<\/button>\n        <\/span>\n        <span class=\"points-note\" id=\"listPointsNote\" style=\"display:none;\"><\/span>\n      <\/div>\n\n      <div id=\"pointsSpellList\"><\/div>\n\n      <div class=\"db-gear-row\">\n        <button class=\"icon-btn\" id=\"dbGearBtn\" title=\"Zauber-Datenbank verwalten\" aria-label=\"Zauber-Datenbank verwalten\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6\"/><circle cx=\"12\" cy=\"12\" r=\"6.3\"/><\/svg><\/button>\n      <\/div>\n\n      <div id=\"dbManagePanel\" style=\"display:none;\">\n        <div class=\"section-title\">Spruchlisten verwalten<\/div>\n        <div class=\"toolbar\">\n          <input type=\"text\" id=\"newListName\" placeholder=\"Name der Spruchliste\">\n          <button class=\"btn primary\" id=\"addListBtn\">+ Neue Spruchliste<\/button>\n        <\/div>\n        <div class=\"toolbar\">\n          <select id=\"templateListSelect\"><\/select>\n          <button class=\"btn\" id=\"loadTemplateBtn\">Vorlage laden<\/button>\n        <\/div>\n        <div id=\"listManageContainer\"><\/div>\n\n        <div class=\"section-title\">Zauber-Datenbank<\/div>\n        <div class=\"toolbar\">\n          <select id=\"dbFilterList\"><\/select>\n          <button class=\"btn primary\" id=\"newSpellBtn\">+ Neuer Zauber<\/button>\n        <\/div>\n        <div id=\"dbSpellList\"><\/div>\n\n        <div class=\"section-title\">Speichern / Laden<\/div>\n        <div class=\"hint\" style=\"margin-bottom:8px;\">Datenbank oder Charakter als Datei sichern, oder eine bestehende Datenbank importieren.<\/div>\n        <div class=\"toolbar\">\n          <button class=\"btn\" id=\"exportDbBtn\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11M7.5 10.5 12 15l4.5-4.5\"/><path d=\"M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2\"/><\/svg>Datenbank exportieren<\/button>\n          <button class=\"btn\" id=\"exportCharBtn\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v11M7.5 10.5 12 15l4.5-4.5\"/><path d=\"M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2\"/><\/svg>Charakter exportieren<\/button>\n        <\/div>\n        <div class=\"hint\">Import: JSON hier einfügen und laden. \"effekt\" und \"steigerung\" können je ein Text oder eine Liste von Texten sein. \"steigerungModus\" ist \"UND\" oder \"ODER\" (Standard: UND).<\/div>\n        <textarea id=\"importDbArea\" placeholder='{\"spellLists\":[{\"name\":\"Elementare Magie\"}],\"spells\":[{\"list\":\"Elementare Magie\",\"level\":1,\"name\":\"Flammenpfeil\",\"desc\":\"...\",\"effekt\":[\"1W6 Feuerschaden\"],\"steigerung\":[\"+1W6\"],\"steigerungModus\":\"UND\",\"details\":\"- Gezielt\\n- 25m\"}]}'><\/textarea>\n        <div class=\"toolbar\" style=\"margin-top:8px;\">\n          <button class=\"btn\" id=\"importDbMergeBtn\">Datenbank importieren (ergänzen)<\/button>\n          <button class=\"btn danger\" id=\"importDbReplaceBtn\">Datenbank importieren (ersetzt alles)<\/button>\n        <\/div>\n        <textarea id=\"importCharArea\" placeholder=\"Charakter-JSON hier einfügen\" style=\"margin-top:10px;\"><\/textarea>\n        <div class=\"toolbar\" style=\"margin-top:8px;\">\n          <button class=\"btn danger\" id=\"importCharBtn\">Charakter importieren (ersetzt aktuellen)<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <h2 class=\"panel-title\">Spruchlisten<\/h2>\n    <div class=\"tab-scroll\" id=\"listTabBar\"><\/div>\n    <div id=\"activeSpellsList\"><\/div>\n  <\/section>\n\n<\/main>\n\n<footer class=\"status\" id=\"statusBar\">wird geladen…<\/footer>\n\n<div class=\"modal-overlay\" id=\"modalOverlay\">\n  <div class=\"modal-box\">\n    <div class=\"modal-msg\" id=\"modalMsg\"><\/div>\n    <input type=\"text\" id=\"modalInput\" style=\"display:none;\">\n    <div class=\"modal-actions\">\n      <button class=\"btn\" id=\"modalCancel\">Abbrechen<\/button>\n      <button class=\"btn primary\" id=\"modalOk\">OK<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n\n// ---------- Default-Daten: Elementare Magie ----------\n// effekt: Liste einzelner Effekt-Texte. steigerung: Liste einzelner Steigerungs-Optionen.\n// steigerungModus: 'UND' = bei jeder Stufe über 1 gelten alle Optionen zusammen automatisch.\n//                  'ODER' = der Spieler wählt pro Stufen-Schritt eine der Optionen.\nfunction defaultElementareMagie(){\n  const listId = uid();\n  const list = {id: listId, name: 'Elementare Magie', description: 'Elementarzauber sind die Verkörperung der rohen Naturkräfte, die die Welt formen. Ob Feuer, Wasser, Luft oder Erde – die Zaubernde ruft die Macht der Elemente herbei, um Verbündete zu stärken, Gegner zu bezwingen oder die Umgebung zu beeinflussen. Diese Magie erfordert Respekt und Geschick, denn die ungezähmte Natur kann ebenso zerstörerisch wie schöpferisch sein.'};\n  const raw = [\n    [1,'Flammenpfeil','Beschwört einen kleinen Flammenpfeil herauf, der einem Ziel in Reichweite Feuerschaden zufügt.',['1W6 Feuerschaden'],['+1W6'],'UND','- Gezielt\\n- 25m'],\n    [1,'Eisige Berührung','Berührt ein Ziel, fügt ihm leichten Kälteschaden zu und verlangsamt für eine kurze Dauer.',['Bewegungsunfähig (St-Test 5) | 1 Runde','1W4 Kälteschaden'],['+1W4'],'UND','- Berührung'],\n    [1,'Steinige Skulptur','Forme eine kleine Menge Stein in schöne Skulpturen oder repariere kaputte Stein Strukturen.',['Forme eine 1m³ große Steinskulptur nach deinem Willen.'],['+1m³'],'UND','- 5m'],\n    [1,'Schock-Funken','Setzt einen kleinen Stromstoß frei, der einem Ziel Schaden zufügt. Wenn das Ziel nass ist, verursacht der Zauber zusätzlichen Schaden.',['1W4 Stromschaden','Wenn Ziel nass, dann Schaden x2'],['+1W4'],'UND','- Gezielt\\n- 15m'],\n    [1,'Wasserfreund','Dem Ziel wachsen Kiemen, die es ermöglichen, unter Wasser zu atmen. Wenn die Person dies nicht will, ist ein Angriff (Gezielte Sprüche) notwendig.',['Unter Wasser atmen | 10 min'],['+1 Person','+10 min'],'ODER','- Berührung\\n- K*'],\n    [1,'Windschild','Beschwört einen wirbelnden Windstoß um eine Person, die einen leichten Verteidigungsschub gegen Fernkampfangriffe bewirkt.',['Fernkampf Treffer auf Ziel um 5 erschwert'],['+5 erschwert'],'UND','- 30m'],\n    [2,'Eisiger Pfad','Erschaffe – ausgehend vom Zaubernden – einen vereisten Pfad.',['Eispfad | 1x4m','Liegend (GE-Test 4)'],['+2m'],'UND','o<'],\n    [2,'Lodernder Schild','Hüllt ein Ziel in Flammen ein und fügt jedem Nahkampfangreifer leichten Feuerschaden zu.',['1W4 Rüstung + Feuerschaden | 1 Runde'],['+1W4','+1 Runde'],'ODER','- Sicht\\n- K*'],\n    [2,'Kräftige Böe','Beschwört einen Wind, der ein nicht verankertes Ziel bewegen kann.',['Bewegt 100kg Ziel (ST-Test 6) | 3m'],['+50kg','+1m'],'ODER','- 25m'],\n    [2,'Frostrüstung','Umhüllt die Rüstung eines Ziels mit Eis und reduziert so den Schaden physischer Angriffe.',['Rüstung +5 | 1 Runde'],['+5 Rüstung','+1 Runde'],'ODER','- 15m'],\n    [2,'Donnerschlag','Erzeugt ein lautes Donnergeräusch, das Gegner verwirren, ablenken oder in ihren Aktionen unterbrechen kann.',['Ein lauter Donnerschlag | 10m Durchmesser'],['+10m'],'UND','- Sicht'],\n    [2,'Entzünden','Entzündet brennbare Gegenstände oder Flächen in Sichtweite. Kleidung kann ohne AP-Verlust ausgeklopft werden. Schaden erfolgt erst in der zweiten Runde.',['Entzündet 1dm³ auf 5m','1W8 Feuerschaden'],['+1dm³','+5m'],'UND','- 5m\\n- Gezielt'],\n    [3,'Wasserschleier','Hüllt das Ziel in eine Wasserbarriere, die Feuerschaden halbiert und Verletzungen lindert.',['Halbiert Feuerschaden','1W4 Heilung | 3 Runden'],['+1 Runde','+1W4 Heilung'],'ODER','- 10m\\n- K*'],\n    [3,'Feuerball','Erschafft eine Kugel aus Flammen, die beim Aufprall explodiert und allen Kreaturen im Umkreis schweren Feuerschaden zufügt.',['2W8 Feuerschaden / 3m Durchmesser'],['+1W8 Feuerschaden','+1m Radius'],'ODER','- 15m\\n- Gezielt'],\n    [4,'Erdiger Griff','Beschwöre eine große Hand aus Erde, die Feinde packen oder Gegenstände bis zu einem bestimmten Gewicht bewegen kann.',['Festhalten (St-Test 10) | 2 Runden','150kg Objekt bewegen (ST-Test 8) / 6m'],['+1 Runde Festhalten','+100kg'],'ODER','- 20m\\n- Gezielt\\n- K*'],\n    [4,'Donnerschritt','Teleportiere dich über eine kurze Distanz und löse am Start eine erschütternde Explosion los.',['1xW10 Energieschaden bei Start | 1m Radius','Teleportation | 5m'],['+1W10','+2m'],'ODER','- Sicht'],\n    [4,'Blitz','Schickt einen Kettenblitz auf ein oder mehrere Ziele, wobei sich der Schaden bei jedem Treffer halbiert.',['2xW12 Blitzschaden','Springt auf 1 weiteres Ziel (Schaden/2)'],['+1W12','1 weiteres Ziel'],'ODER','- 20m\\n- Gezielt'],\n    [5,'Magmaschwall','Erzeugt – ausgehend vom Zaubernden – einen Magmaschwall, der durch das Schlachtfeld fließt und sich danach schnell verfestigt.',['4W8 Feuerschaden / 5x3m Kegel','2. Runde Magma breitet sich aus auf 6x5m'],['+1W8 Feuerschaden','+1x1m Kegel'],'ODER','o<'],\n    [5,'Kristall Chaos','Erzeugt eine oder mehrere Steinminen, welche nach einer Runde explodieren und Kristalle auf Gegner in der Nähe schleudern, sobald sich diese nähern. Schadenspotential kann auf kleinere Minen aufgeteilt oder in einer größeren Mine vereint werden.',['1-5 Steinminen | 1W10 Schaden/Mine | 1m Radius\\nAnm. 1: Steinminen sind nach 1 Runde aktiv\\nAnm. 2: Annäherung (1m) löst aus\\nAnm. 3: Steinminen können durch INT-Test bemerkt werden'],['+1W10 Schaden','+1 Stein'],'ODER','- 10m'],\n    [5,'Wall','Diese Form schafft einen Wall aus einem vorhandenen Element.',['1x Wallelement 1x2x0,5m | 100 LP\\nOpt.: +1 Wallelement pro weiterem MP\\nAnm.: Kann nicht schwerer heben als Eigengewicht'],['+1 Wallelement','+50 LP'],'UND','- 5m\\n- K*'],\n    [6,'Eislanze','Beschwört eine große Eislanze, die aus dem Boden hervorbricht und Feinde aufspießen kann.',['1 Eislanze | 2W20 Eisschaden pro Eislanze','Eingefroren für 1 Runde'],['+1 Eislanze','+1W20 Eisschaden'],'ODER','- 30m\\n- Gezielt'],\n    [6,'Steinfestung','Errichtet eine kleine, temporäre Steinstruktur, die als Schutz oder Verteidigung dient.',['Steinstruktur 5x5x3m | 300 LP | 8h\\nOpt.: +1h pro weiterem MP\\nAnm.: Errichten dauert 5 min | Platz muss frei sein'],['+1 weitere 5x5x3m Erweiterung'],'UND','- Berührung\\n- K*'],\n    [6,'Sturm','Hiermit entfesselt einen kaum zu beherrschenden Sturm im Umkreis; es dauert eine Minute, bis er sich zusammengezogen hat. Der Zauber kann nicht beendet werden.',['Sturm zufälliger Stärke | 1x1km | min. 1h\\nOpt.: +20 MP ermöglichen 1x grobe Richtungsangabe\\nAnm.: 1W12 entscheidet über Windstärke (Beaufort)'],['+1km Radius','+1 Einfluss auf Windstärke'],'UND','- Sicht'],\n    [7,'Elementar','Beschwört einen Elementar aus einem vorhandenen Element, der für kurze Zeit an deiner Seite kämpft im Nah- oder Fernkampf.',['1 Elementar | 50 LP | 1W12 Schaden | 5 AP | 1h\\nAnm.: +1W8 Schaden (Feuer) | +1 AP (Luft) | +10 LP (Erde) | +1W6 Heilung (Wasser)'],['+5 LP','+1W12 Schaden','+1AP','+1x Elementarbonus'],'UND','- 15m\\n- Elementar Fernkampf: 10m'],\n    [7,'Hagelschlag','Beschwört einen Sturm aus Eissplittern, die auf ein bestimmtes Gebiet niederregnen.',['4W8 Eisschaden | 6x6m','Bewegung halbiert | 2 Runden'],['+1x1m','+1W8 Eisschaden'],'ODER','- 15m'],\n    [7,'Erdverschmelzung','Verschmelze vorübergehend mit dem Boden, bewege dich in ihm und tauche in der nächsten Runde an einem anderen Ort wieder auf. Der Zielort muss nicht gesehen werden.',['Teleportation | 5m','Immunität gegen physische Angriffe\\nAnm.: Zauber kann ununterbrochen fortgeführt werden'],['+5m'],'UND','o<'],\n    [8,'Froststrahl','Lasse einen breiten Strahl aus Eis los, der alles in seinem Weg einfriert.',['5W10 Eisschaden | 10x2m Kegel','Einfrieren für 1 Runde (ST-Test 7)'],['+1W10'],'UND','o<'],\n    [8,'Geysir','Beschwöre einen Hochdruck-Wasserstrahl von unten herauf, der alles zurückwirft, was sich ihm in den Weg stellt.',['4W8 Schaden | 3m Durchmesser','Zurückschleudern (ST-Test 9) | 1W4m','Liegend (GE-Test 5)'],['+1W8'],'UND','- 12m'],\n    [8,'Flutwelle','Diese Formung lässt ein Gewässer so unruhig werden, dass eine Flutwelle entsteht. Es dauert bis zu 10 Minuten, bevor die Welle kommt.',['10W10 Schaden | 500m Durchmesser','Liegend (GE-Test 10)'],['+1W10','+100x100m'],'ODER','- Sicht'],\n    [9,'Mahlstrom','Beschwört einen spiralförmigen Wirbel aus Wasser, der alles in seiner Reichweite mitreißt und in die Tiefe zieht.',['4W20 Schaden | 15m Durchmesser | 2 Runden\\nAnm. 1: Ziele erhalten jede Runde Schaden\\nAnm. 2: Mahlstrom halbiert Bewegung'],['+1W20','+5m','+1 Runde'],'ODER','- Sicht\\n- K*'],\n    [9,'Titanisches Beben','Verursache ein massives Erdbeben, das Strukturen destabilisiert und Krater erzeugt.',['10W10 Schaden | 500m Durchmesser','Liegend (GE-Test 10)'],['+1W10','+100m Durchmesser'],'ODER','- Sicht'],\n    [9,'Gefrorenes Reich','Ein ganzes Gebiet in dickes Eis einhüllen, das die Bewegung behindert und glatte Oberflächen erzeugt.',['4W8 Kälteschaden | 20m Durchmesser | 1h','Vereistes Gelände (halbe Geschwindigkeit)','Liegend (GE-Test 4)'],['+1W8 Kälteschaden','+5x5m'],'ODER','- Sicht'],\n    [10,'Zorn der Elemente','Entfesseln Sie eine verheerende Kombination aus Feuer, Wasser, Erde und Luft, die in einem großen Gebiet zuschlägt.',['Kristall Chaos','Eislanze','Magmaschwall','Kräftige Böe'],['Stufe = Stufe der Effekte'],'UND','- 15m'],\n    [10,'Feuerregen','Lässt brennende Meteore auf ein Gebiet herabregnen, die alles in ihrem Radius verbrennen.',['5W20 Feuerschaden | 30m Durchmesser','Brennendes Gelände | 1W8 Feuerschaden pro Runde'],['+1W20','+10m Durchmesser'],'ODER','- 30m'],\n    [10,'Ewiger Frost','Erzeugt eine nahezu unzerbrechliche Eisschicht über einem Gebiet, die es für längere Zeit versiegelt.',['Eingefroren (ST-Test 19) | 100x100x5m | 24h','2W20 Kälteschaden'],['+1W20','+100x100x1m','+24h'],'ODER','- 100m']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Default-Daten: Zeichen & Wunder (Klerikerin/Paladine) ----------\nfunction defaultZeichenUndWunder(){\n  const listId = uid();\n  const list = {id: listId, name: 'Zeichen & Wunder', description: 'Zeichen & Wunder sind Manifestationen göttlicher Macht, die den Gläubigen zur Verfügung stehen. Sie heilen Wunden, bringen Licht in die Dunkelheit und strafen Ungläubige oder Monster. Jeder Zauber ist ein Akt des Glaubens und eine Verbindung zu den höheren Mächten. Hinweis: Alle Schadenseffekte dieser Zauber wirken gegen Untote eine Stufe verstärkt, da sie die Reinheit des Lichts nicht ertragen können.'};\n  const raw = [\n    [1,'Segen des Wächters','Gewährt einem Ziel einen vorübergehenden Schild aus göttlicher Energie. Wirken auf Untote erzeugt gegenteiligen Effekt.',['+2 Rüstung | 1 Runde'],['+2 Rüstung','+1 Runde'],'UND','- 15m'],\n    [1,'Göttliche Pein','Erzeugt eine Peitsche aus Licht, die einem einzelnen Ziel Strahlenschaden zufügt. Wenn das Ziel untot ist, wird zusätzlicher Schaden verursacht. Kann gegen Ketzer eingesetzt werden, um die Wahrheit zu erzwingen (abgewehrt durch schweren (>9) List-Test).',['1W8 Lichtschaden'],['+1W8 Lichtschaden','+1m'],'ODER','o<\\n- 3m\\n- Gezielt'],\n    [1,'Gesegnete Ernte','Ein kleines Stück Land wird mit göttlicher Energie durchdrungen, was den Ertrag und die Qualität von Pflanzen oder Kräutern für kurze Zeit verbessert.',['Gute Ernte | 1km Durchmesser','+1 LP Heilung | täglich'],['+100m²','+1 LP'],'UND','- 100m'],\n    [1,'Strenges Gebet','Intensiviere deine Gebete und hoffe auf eine göttliche Antwort auf eine Frage. Die göttlichen Rückmeldungen könnten allerdings kryptisch und zeitlich stark verzögert sein. Vorsicht: Strenge Gebete können auch den Zorn der Götter heraufbeschwören, wenn sie nicht in der Stimmung sind, die Fragen zu beantworten, oder zu häufig befragt werden.',['Beantwortung von Ja/Nein-Fragen\\nAnzahl der Fragen:\\nCHA-Test (6) = 1 Frage\\nCHA-Test (12) = 2 Fragen\\nCHA-Test (18) = 3 Fragen\\nAnm.: Anzahl der Fragen muss vorher angesagt werden.','Nicht Erreichen des Wertes erzeugt Schaden in Höhe des Charakter-Levels x 1W10'],['+1 auf CHA-Test'],'UND','o<'],\n    [2,'Predigt','Alle Ketzer im Umkreis müssen einen GS-Test (mit CHA-Malus) bestehen oder werden für eine Runde zu Boden gezwungen.',['Zu Boden zwingen | 1 Runde | 4m Radius'],['+1 Runde','+1m Radius'],'UND','o<'],\n    [2,'Umarmung des Lichts','Lege einem Ziel die Hand auf und heile dieses.',['+1W4 LP Heilung'],['+1W4'],'UND','- Berührung'],\n    [2,'Schild des Glaubens','Erzeugt eine leuchtende Barriere, welche eingehende und ausgehende Angriffe blockiert. Kann mit zusätzlichen MP erweitert werden. Das Schild ist nur so lange aufrecht, wie es aktiv gewirkt wird oder das Schild nicht durchbrochen wird.',['1x1m Barriere | 1 Runde | 100 LP'],['+1x1m','+10 LP'],'UND','- 5m\\n- K*'],\n    [2,'Heiliges Leuchtfeuer','Projiziere eine Aura, die Verbündeten in Reichweite Immunität gegen Furcht (GS-Angriffe) verleiht.',['100 GS | 1 Runde | 3m Radius'],['+1m Radius','+1 Runde'],'ODER','o<'],\n    [2,'Göttliche Vergeltung','Durchtränkt den nächsten Angriff eines Verbündeten mit strahlender Energie und fügt dämonischen Gegnern zusätzlichen Schaden zu.',['+1W8 Schaden | 1 Runde'],['+1W8','+1 Runde'],'ODER','- 8m'],\n    [2,'Geweihter Regen','Ruft einen sanften Regen herbei, der ein Gebiet reinigt und von Flüchen befreit. Nach 3 Runden ist der Boden vorübergehend geweihter Boden und erschwert Untoten und dämonischen Wesen das Betreten.',['Flüche werden aufgehoben | Runde 1-3 | 5m Radius\\nCHA-Test (höher als Qualität des Fluchs):\\nErfolg = Fluch aufgehoben\\nMisserfolg = Fluch nicht aufgehoben','Geweihter Boden im gleichen Umkreis gibt Untoten und dämonischen Wesen einen Malus von 2 AP | 3-6 Runden'],['+1m Umkreis'],'UND','- 30m'],\n    [3,'Echo der Seelen','Kommuniziere kurz mit den Geistern der kürzlich Verstorbenen und stelle eine Frage.',['Tote beantworten dir eine Frage'],['+1 Frage'],'UND','- Berührung'],\n    [3,'Strafender Blick','Ruft einen Strahl göttlichen Lichts herab, der einem Ziel direkten Schaden zufügt und auch Ziele im Umkreis trifft. Bonus gegen Untote und dämonische Wesen.',['1W10 Lichtschaden punktuell | 1W4 Lichtschaden in 1m Radius'],['+1W10 und +1W4 Lichtschaden','+1m Radius'],'ODER','- 15m\\n- Gezielt'],\n    [4,'Todesschutz','Die Gnade deiner Gottheit verleiht dem Ziel für kurze Zeit einen Schutz vor dem Tod. Wenn die Lebenskraft des Ziels durch erlittenen Schaden erstmals auf 0 sinken würde, sinkt sie stattdessen auf 1 und der Zauber endet.',['LP können nicht unter 1 fallen | 1 Runde'],['+1 Runde'],'UND','- 10m\\n- K*'],\n    [4,'Wogen des Glaubens','Eine heilende Welle durchdringt die Umgebung und gibt verletzten Verbündeten in Reichweite neue Kraft.',['+1W6 Heilung | 3m Radius'],['+1W6 Heilung','+1m'],'ODER','o<'],\n    [4,'Heiliger Hammer','Ein kraftvoller Lichtstoß schleudert Feinde zurück und fügt Schaden zu. Eventuell werden die Feinde durch den Rückschlag zu Boden geschleudert. Auch Objekte können mit dem Zauber verschoben werden.',['1W8 Schlagschaden','2m Rückstoß (ST-Test 8)','Liegend (GE-Test 4)'],['+1W8 Schlagschaden','+1m Rückstoß','+1 Schwierigkeit auf Attributswürfe'],'UND','o<'],\n    [5,'Lichtbringer','Eine Waffe wird mit göttlichem Licht durchdrungen, verstärkt die Zaubernde. Die Waffe leuchtet zudem im Dunklen.',['+2W8 Waffenschaden | 2 Runden'],['+1W8','+1 Runde'],'ODER','o<'],\n    [5,'Strahlende Fesseln','Leuchtende Ketten aus göttlichem Licht halten deine Feinde fest und fügen Untoten zusätzlichen Schaden zu.',['Bewegungsunfähig (ST-Test 13) | 2 Runden','2W6 Lichtschaden'],['+1 ST-Test Schwierigkeit','+1 Runde','+1W6 Lichtschaden'],'ODER','- 7m\\n- Gezielt'],\n    [5,'Schutzgeister','Du rufst Geister herbei, die dich beschützen und Gegnern Schaden zufügen. Sie umkreisen dich für die Dauer des Zaubers in einem Abstand von 3m.',['+5 Rüstung | 3 Runden oder 3 Angriffe','1W6 Schaden | 3m Radius'],['+1 Rüstung','+1W6'],'UND','o<\\n- K*'],\n    [6,'Kreis der Erlösung','Ein heiliger Kreis schützt Verbündete und vertreibt Feinde.',['+1 auf alle Würfe | 2 Runden | 4m','-1 auf alle Würfe für Feinde'],['+1 für Verbündete','-1 für Feinde'],'ODER','o<\\n- K*'],\n    [6,'Ruf der Märtyrer','Das Ziel kanalisiert göttliche Macht für einen alles entscheidenden Schlag, wird danach aber kampfunfähig und erleidet geistigen Schaden durch die Erschöpfung. Die negativen Effekte können auf andere Anhänger des gleichen Gottes übertragen werden (mit oder gegen ihren Willen).',['Garantierter Treffer | +4W20 Schaden zzgl. zum normalen Angriff','30 min Kampfunfähig | -2W6 GS\\nOpt.: Übertragung an Anhänger (GS-Test)'],['+1W20 Schaden','-1W6 GS'],'UND','o<'],\n    [6,'Heilung','Heilt ein Ziel.',['+4W10 Heilung'],['+1W10 Heilung'],'UND','- 15m'],\n    [7,'Göttlicher Avatar','Die Zaubernde wird kurzzeitig von göttlicher Macht durchdrungen, was sie zu einer strahlenden Kämpferin macht.',['+2W8 Kampfwürfel | Immunität physischer Schaden | +6AP | 2 Runden'],['+1W8 Kampfwürfel','+1AP'],'UND','o<'],\n    [7,'Ruf der Ahnen','Die Geister längst verstorbener Helden steigen auf, um im Kampf zu unterstützen.',['+2 Verbündete | 50 LP | 1W12 Schaden | 6AP'],['+5 LP','+1W12','+1AP'],'UND','o<'],\n    [7,'Göttliches Tribunal','Die Mächte des Himmels richten über Feinde, die durch göttliche Energie verurteilt werden.',['Feinde machen GS-Test | 10m\\nErfolg = Kein Schaden\\nMisserfolg = 1W12 Lichtschaden'],['-2 GS-Test Schwierigkeit','+1W12 Lichtschaden'],'UND','o<'],\n    [8,'Aufopferung','Ein göttliches Opfer schützt alle Verbündeten auf dem Schlachtfeld und leitet allen Schaden (halbiert) auf den Zaubernden.',['Halbierter Schaden aller Angriffe auf Zaubernde | 2 Runden','Verbündete erleiden keinen Schaden'],['+1 Schadensreduktion'],'UND','o<'],\n    [8,'Massenheilung','Eine göttliche Aura heilt eine gewisse Anzahl an Zielen in einem gewissen Umkreis.',['+1W10 Heilung | 2 Personen | 4m Radius'],['+1W10 Heilung','+1 Person','+1m'],'UND','o<'],\n    [8,'Hallen des Lichts','Ein heiliger Tempel aus Licht erscheint und schützt alle Verbündeten. Verbündete erhalten Immunität gegen Schaden und Regeneration. Bietet Schutz und Zuflucht in gefährlichen Situationen. Ein- und ausgehende Angriffe werden blockiert.',['Schutzstruktur = 200 LP | 25m²','Einmalig +1W4 Heilung bei Betreten','Nur Verbündete können die Hallen des Lichts betreten oder verlassen'],['+50 LP','+1m²'],'UND','o<'],\n    [9,'Reinigende Flammen','Reinigt ein Wesen oder Objekt von dunklen Mächten und vertreibt dämonische oder unheilige Einflüsse. Bricht Flüche, vertreibt Geister und befreit Wesen von dunklen Bindungen. Das Ziel wird gereinigt und geheilt. Der Eingriff kann für das Ziel gefährlich sein.',['+5W12 Lichtschaden (auf Dämon oder Besessenen)','KO-Test (6) (Besessener)\\nErfolg = Schaden geht auf Dämon\\nMisserfolg = Schaden geht auf Besessenen'],['+1 KO-Test Bonus'],'UND','- Berührung'],\n    [9,'Läuterung','Läuterung stellt deine Feinde vor das göttliche Gericht und sie müssen für ihre Sünden büßen. Der Zaubernde prüft den Glauben des Ziels und fügt bei unzufriedenstellendem Ergebnis massiven Schaden zu.',['Zaubernde gibt einen GS-Wert an, welchen das Ziel erreichen muss | Beginnend ab 90 GS\\nErfolg = 4W10 Lichtschaden\\nMisserfolg = 4W20 Lichtschaden'],['-10 GS-Wert-Schwierigkeit','+1W10 (Erfolg) / +1W20 Lichtschaden (Misserfolg)'],'ODER','- Gezielt\\n- 15m'],\n    [9,'Göttliches Wort','Du sprichst ein göttliches Wort, das von der Macht erfüllt ist, die die Welt zu Beginn der Schöpfung geformt hat. Wähle eine beliebige Anzahl Kreaturen in Reichweite, die du sehen kannst. Jede Kreatur, die dich hören kann – Freund und Feind – muss einen Geistige-Stabilität-Test ausführen. Scheitert der Wurf, erleidet die Kreatur einen Effekt anhand ihrer aktuellen Lebenspunkte.',['CHA-Wurf = Anzahl Ziele in Hörreichweite','KO-Test (>CHA-Wurf) für Ziele\\nErfolg = Kein Effekt\\nMisserfolg =\\nHöchstens 60 LP: Eine Minute taub\\nHöchstens 50 LP: Eine Minute taub und blind\\nHöchstens 40 LP: Zehn Minuten lang blind und taub\\nHöchstens 30 LP: 1 Stunde betäubt, blind und taub\\nHöchstens 20 LP: sofortiger Tod'],['Effektbereich erhöht sich um +10 LP'],'UND','o<'],\n    [10,'Schicksal','Die Zaubernde fordert das Schicksal und den Willen der Götter heraus und versucht, das Schicksal zu beeinflussen.',['Jeder Würfel kann bei Bedarf neu gewürfelt werden | bis aufgebraucht\\nAnzahl neuer Würfe = CHA-Test + 3\\nGilt für Zaubernden und alle Verbündeten.'],['+1 neuer Wurf'],'UND','o<'],\n    [10,'Apokalypse','Entfesselt das Ende der Welt, wie von den Göttern vorherbestimmt. Alles im Zielgebiet wird von himmlischen und infernalen Kräften zerrissen.',['10W12 Lichtschaden | 1km Durchmesser','Unnatürlich zerstörtes Gelände | -1W4 GS für alle, die das Gelände zu sehen bekommen'],['+1W12','+100m²'],'ODER','- 100m'],\n    [10,'Auferstehung','Berühre eine tote Kreatur. Ihr Tod darf maximal 200 Jahre zurückliegen und sie darf nicht an Altersschwäche gestorben sein. Ist die Seele der Kreatur frei und bereitwillig, wird sie mit all ihren Lebenspunkten wieder zum Leben erweckt.',['Belebt ein totes Ziel wieder'],['Die Schwierigkeit des Rituals hängt mit der Stufe des Zaubers zusammen.'],'UND','- Berührung']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Default-Daten: Wilde Magie (Schamanin/Waldläuferin) ----------\nfunction defaultWildeMagie(){\n  const listId = uid();\n  const list = {id: listId, name: 'Wilde Magie', description: 'Die Wilde Magie vermittelt zwischen Natur und Geistwelt. Die Seelen und Geister von Tieren und Pflanzen können durch Wilde Magie beeinflusst und manipuliert werden und damit allen Feinden der Natur großen Schaden zufügen oder aber auch Trost und Beistand spenden. Zu leichtfertiges Eingreifen in die Natur und die Geisterwelt kann aber auch gravierende Folgen mit sich ziehen.'};\n  const raw = [\n    [1,'Irrlicht','Beschwört einen kleinen, unvorhersehbaren Energiestrudel, der umherfliegt und zufälligen Zielen geringen Schaden zufügt.',['1W4 Schaden auf 2 zufällige Ziele'],['+1W4','+1 weiteres Ziel'],'UND','- 20m'],\n    [1,'Verschlingende Ranken','Ranken schießen aus dem Boden, verursachen Schaden und halten alles fest, was sich darin befindet. Ein Stärke-Test (4) ist notwendig, um sich daraus zu befreien.',['Festhalten (ST-Test 4) | 2 Runden | 1x1m','1W10 Schaden'],['+1m²','+1x W10','+1 ST-Test'],'ODER','- 10m\\n- K*'],\n    [1,'Ruf der Wildnis','Beschwöre den Geist eines kleinen Tieres zur Unterstützung im Kampf. Die Kreatur verursacht nur geringen Schaden, kann aber Feinde ablenken. Hört auf Kommandos.',['Beschwört eine Kreatur:\\n10 LP | INI = Beschwörer | 4 AP | 1W6 Schaden | 2 Runden'],['+10 LP','+1x W6 Schaden','+1 Runde'],'UND','o<'],\n    [1,'Schleierhafter Tritt','Ziel hinterlässt keine Spuren und bewegt sich lautlos über natürliches Terrain.',['Lautlose Bewegung | 5 min'],['+5 min'],'UND','o<'],\n    [1,'Gute Beere','Leckere Beeren erscheinen in deiner Hand und sind für die Dauer des Zaubers mit Magie durchdrungen. Der Verzehr einer Beere heilt und liefert genug Nahrung für 1 Tag. Werden die Beeren nicht innerhalb von 24h verzehrt, verlieren sie ihren magischen Effekt.',['Beeren zum Essen erscheinen.\\nAnzahl der Beeren = Stufe d. Zaubers','Satt für 24h | +1W4 LP\\nAnm.: Beeren behalten positiven Effekt für 24h'],['+1 Beere'],'UND','o<'],\n    [2,'Arkane Sporen','Es wird eine Wolke magischer Sporen freigesetzt, die in einem kleinen Gebiet leichte Verwirrung und zu Halluzinationen führen können. Ziele in den Sporen greifen ggf. wahllos an. Außerhalb des Kampfes ist es eine beliebte Droge.',['Ziele müssen INT-Test (10) absolvieren\\nErfolg = Kein Effekt\\nMisserfolg = Zufällige Angriffe | 1 Runde'],['-INT-Test Schwierigkeit','+1 Runde'],'ODER','- 10m\\n- K*'],\n    [2,'Flüsternde Flora','Kommuniziere mit Pflanzen.',['Pflanzen beantworten dir eine Frage'],['+1 Frage'],'UND','- 2m'],\n    [2,'Erdverschiebung','Bewegen Sie eine kleine Menge Erde, Sand oder Steine, um Wege zu formen, Verstecke zu schaffen oder vergrabene Gegenstände freizulegen.',['1m³ Erdmasse kann bewegt werden | 3m Radius'],['+1m²'],'UND','- 3m'],\n    [2,'Mit Tieren sprechen','Kommuniziere mit Tieren.',['Tiere reden mit dir und beantworten dir eine Frage'],['+1 Frage'],'UND','- 2m'],\n    [2,'Wetterlaune','Das Wetter wird sich zufällig verändern.',['Wetterveränderung auf 1km²'],['+1km²'],'UND','- Sicht'],\n    [3,'Wunden Heilen','Heilt ein Ziel.',['Heilung | +1W6 LP'],['+1W6 LP'],'UND','- Berührung'],\n    [3,'Weitläufer','Die Geschwindigkeit des Ziels erhöht sich auf 3m im Kampf oder 3 km/h außerhalb des Kampfes.',['Erhöht Geschwindigkeit | 1h\\nKampf: +3m pro Runde\\nKein Kampf: +3km/h'],['+1 weiteres Ziel'],'UND','- Berührung\\n- K*'],\n    [3,'Nachtsicht','Die Schamanin hat die Möglichkeit, im Dunklen zu sehen.',['Im Dunklen sehen | 8h'],['+1h'],'UND','o<'],\n    [4,'Minimorph','Verwandelt sich für kurze Zeit in ein kleines Tier, z.B. einen Falken oder ein Eichhörnchen.',['Verwandlung für 5 min'],['+5 min'],'UND','o<'],\n    [4,'Pflanzenwachstum','Lässt Pflanzen um ein Vielfaches wachsen.',['Pflanzenwachstum | Größe x2 | 1m²'],['Wachstumsfaktor +1','+1m²'],'ODER','- 10m'],\n    [4,'Bändigung','Bändige ein Tier. Je freundlicher dir das Tier gesonnen ist, desto einfacher ist der Zauber. Das Tier folgt simplen Anweisungen, hinterfragt aber den Zauber, sobald es Schaden erleidet. Die Größe des Tieres ist vom Charisma der Schamanin abhängig.',['Gebändigtes Tier = 20kg Tier pro 1 CHA-Test-Wurf | 6 Runden\\nAnm. 1: bspw.: CHA-Test 5 = 5x20kg Tier','KO-Test des zu bändigenden Tieres\\nErfolg = Lässt sich nicht bändigen\\nMisserfolg = Lässt sich bändigen\\nAnm. 2: Wenn Tier Schaden erhält, dann neuer KO-Test'],['+1 CHA-Test'],'UND','- 5m\\n- K*'],\n    [5,'Einklang mit der Natur','Für kurze Zeit wirst du eins mit der Natur und erhältst Wissen um die natürliche Umgebung in deinem Umfeld (z.B. über Flüsse, Höhlen, Berge, o.ä.). Außerdem leitet dich die Natur zu einem der entdeckten Ziele.',['Wissen über Umgebung | 1W6 km Radius'],['+1km'],'UND','o<'],\n    [5,'Insekten Plage','Ein Schwarm beißender und stechender Insekten erscheint und greift alles in einem bestimmten Umkreis an.',['3W6 Schaden | 3x3m Kreis'],['+1W6 Schaden'],'UND','- 12m\\n- K*'],\n    [5,'Rindenhaut','Überziehe die Haut des Ziels mit einer schützenden Rinde, die als Rüstung dient.',['+5 Rüstung | 2 Runden'],['+5 Rüstung'],'UND','o<\\n- K*'],\n    [6,'Spinnenbeine','Bis zum Ende des Zaubers erhält ein Ziel die Fähigkeit, sich aufwärts, abwärts, über vertikale Flächen und kopfüber an Decken entlang zu bewegen, während ihre Hände frei bleiben. Das Ziel erhält außerdem eine Klettergeschwindigkeit, die seiner Gehgeschwindigkeit entspricht.',['Klettern | 10 min'],['+10 min'],'UND','- Berührung\\n- K*'],\n    [6,'Weg der Bäume','Es öffnet sich ein magisches Portal zwischen 2 Bäumen, die die Schamanin entweder sehen kann oder in der Vergangenheit mindestens einmal berührt hat. Eine Minute lang kann das Portal von jedem genutzt werden, aber nur in eine Richtung. Die Erinnerung an den \"Zielbaum\" muss frisch sein, ansonsten kann die Reise auch schief gehen.',['Portal zwischen 2 Bäumen | 1 min\\nAnm.: INT-Test muss min. 4 ergeben für einen Baum, an den man sich aus dem letzten Monat erinnert. +1 INT-Test-Schwierigkeit pro weiterem Monat.'],['+1 INT-Test'],'UND','- Berührung\\n- K*'],\n    [6,'Regenerierung','Auch die ganz kleinen Lebensformen sind Lebensformen. Der Zauber motiviert die hartarbeitenden Einzeller des Ziels, schneller Wunden zu schließen. Die natürliche Regeneration wird unterstützt und der Heilzauber macht nicht abhängig.',['+1W10 LP Heilung pro Nacht | 5 Tage\\nAnm.: Heilung macht nicht abhängig'],['+1 Tag'],'UND','- Berührung'],\n    [7,'Rankenschlag','Aus den Händen der Schamanin schießen Ranken, die entweder Schaden anrichten oder Dinge greifen können.',['2W12 Schaden | 5m','Greifen (ST-Test) | 5m'],['+1W12 Schaden','+1 ST-Test'],'UND','o<\\n- Gezielt'],\n    [7,'Geisterheilung','Heilt eine geschundene Seele. Kann aber nur 1 mal pro Tag eingesetzt werden.',['GS-Heilung +1W2\\nAnm.: GS-Obergrenze bis 50'],['+5 GS-Obergrenze'],'UND','- Berührung'],\n    [7,'Polymorph','Die Schamanin verwandelt sich für kurze Zeit in ein Tier ihrer Wahl. Sie muss das Tier bereits einmal gesehen haben. Die Größe und Stärke der Kreatur ist abhängig von der Stufe des Zaubers.',['Verwandlung | 1h\\nAnm. 1: 100kg Kreatur pro Stufe des Zaubers'],[],'UND','o<'],\n    [8,'Parasit','Ein kleines, parasitäres Insekt befällt ein Ziel und übernimmt dessen Verstand. Die Schamanin kann den Parasiten telepathisch beeinflussen, um den Wirt zu steuern.',['Kontrolle über eine Kreatur | 1h\\nAnm.: Opfer kann sich mit KO-Test (10) wehren','INT und CHA sind auf -3 reduziert'],['+1h Kontrolle'],'UND','- Berührung'],\n    [8,'Verwandlung','Verwandelt das Ziel in eine harmlose und schwache Kreatur wie eine Schnecke oder ein Schaf. Erleidet die verzauberte Kreatur Schaden, erlischt der Zauber.',['Verwandlung des Ziels in eine harmlose Kreatur | 2 Runden'],['+1 Runde'],'UND','- Gezielt\\n- 5m'],\n    [8,'Vorausschau','Du berührst ein williges Ziel und schenkst ihm eine begrenzte Fähigkeit, in die unmittelbare Zukunft zu sehen. Für die Dauer der Berührung kann das Ziel nicht überrascht werden und hat Vorteil bei allen Würfen. Zusätzlich haben andere Kreaturen für die Dauer des Zaubers einen Nachteil bei allen Würfen gegen das Ziel. Dieser Zauber endet sofort, wenn du ihn vor Ablauf seiner Dauer erneut wirkst.',['Ziel kann alle Würfe 2mal werfen; der bessere Wert kann genommen werden | 1h','Gegner müssen den schlechteren von 2 Würfen nehmen.'],['+5 GS für Konzentrationstest'],'UND','- Berührung\\n- K*'],\n    [9,'Vertraute Seele','Der Geist eines verstorbenen Tieres begleitet dich, hört auf deine Befehle und wird dein Vertrauter. Er kann auf deinen Wunsch hin unsichtbar werden, kann in diesem Modus allerdings keine Angriffe ausführen.',['1 Beschwörung | 70 LP | 4W10 Schaden | 6 AP | INI = Zaubernde'],['+5 LP','+1W10 Schaden','+1AP'],'UND','o<'],\n    [9,'Pilz-Mutation','Alle körperlichen Funktionen des Wirts werden von einem mutierten Pilz übernommen, sodass menschenähnliche Zombies entstehen. Die Infizierten greifen andere Menschen in der Umgebung an, wodurch der Pilz verbreitet wird.',['GS wird auf 1 gesenkt und alle Infizierten werden zu willenlosen und gefährlichen Zombies.\\nAnm.: Opfer kann sich mit KO-Test (16) wehren'],['+1 weitere gleichzeitige Infizierung'],'UND','- 2m'],\n    [9,'Hexensicht','Die Schamanin übernimmt die Augen des Ziels und kann entweder durch diese sehen oder dem Ziel Illusionen vorgaukeln.',['Durch die Augen des Ziels sehen | 10 min','Sicht des Ziels beeinflussen durch Illusionen.\\nAnm.: Die Illusionen müssen stimmig in die Umgebung passen'],['+10 min'],'UND','- Berührung\\n- K*'],\n    [10,'Seelenreise','Die Schamanin ist in der Lage, Körper und Geist zu trennen. In Geisterform ist sie immun gegen fast jede Schadensart (außer göttliche Magie). Sie kann selbst entscheiden, ob sie sichtbar ist für die Welt der Sterblichen oder unsichtbar bleibt. Weltliche Barrieren sind keine Hindernisse mehr. Gleichzeitig besitzt sie als Geist aber auch kaum manifestierte Stärke und kann nur wenige reale Dinge bewegen.',['Geisterform | 1h\\nAnm. 1: -10 Stärke-Malus\\nAnm. 2: Wird der sterbliche Körper angegriffen, zwingt dies den Geist, so schnell wie möglich zum Körper zurückzukehren. Schafft er es nicht in der Zeit, bis die LP des Körpers auf 0 fallen, ist die Seele in der Geisterwelt gefangen.'],['Stärke-Bonus + 1'],'UND','o<\\n- K*'],\n    [10,'Verfluchen/Fluch brechen','Die Schamanin verflucht einen Gegenstand, Ort oder ein lebendiges Ziel. Orte oder Gegenstände haben verfluchte Auren, während Personen direkt den Effekt spüren. In der Kreativität der Flüche sind nur wenige Grenzen gesetzt. Man kann mit dem gleichen Zauber auch einen Fluch brechen.',['CHA-Wurf = Stärke des Fluchs\\nUnterschiedliche Flüche wie etwa:\\n-5 LP | Nacht\\n- Nachteil auf alle Würfe | Rest des Lebens\\n- Unfruchtbarkeit\\n- Weitere kreative Optionen möglich','Flüche können gebrochen werden mit einem CHA-Test, welcher größer sein muss als der Zauber des Fluchs.'],['+1 CHA-Test'],'UND','- 15m'],\n    [10,'Hüterin des Waldes','Du hast das uneingeschränkte Vertrauen der Natur erlangt. Alle Lebewesen hören auf dein Kommando und unterstützen dich, so gut sie können.',['5x Ruf der Wildnis | Stufe 10','Verschlingende Ranken | Stufe 10','Irrlicht | Stufe 10','Wetterlaune | Stufe 10','Insektenplage | Stufe 5','Rindenhaut | Stufe 5','Ranke | Stufe 5'],['+1 Stufe auf einen der Effekte.'],'UND','o<']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Default-Daten: Blutmagie (Alle Klassen) ----------\nfunction defaultBlutmagie(){\n  const listId = uid();\n  const list = {id: listId, name: 'Blutmagie', description: 'Blutmagie nutzt die Lebenskraft des Anwenders oder anderer, um mächtige und oft gefährliche Zauber zu wirken. Sie verlangt Opferbereitschaft und birgt hohe Risiken, da Blut als Katalysator dient. Ihre Effekte sind oft physisch spürbar, und der Preis für diese Macht kann ebenso zerstörerisch sein wie ihre Zauber. Hinweis: Für Blutmagie kann sowohl Mana als auch Lebenspunkte genutzt werden. Zudem spielen Tests auf die Geistige Stabilität (GS-Test) eine große Rolle, damit die Zauber gelingen und keine negativen Effekte nach sich ziehen.'};\n  const raw = [\n    [1,'Blutopfer','Der Zauber erlaubt es, Lebenspunkte in Mana umzuwandeln. Die Kontrolle über die Kräfte ist dabei entscheidend, da Fehler gefährlich werden können.',['LP in Mana tausch\\nAnm.: Bestimme als erstes die gewünschte Menge Mana\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Tausch 1LP:1MP\\nMisserfolg = Tausch 2LP:1MP'],['+3 GS-Test'],'UND','o<'],\n    [1,'Lebenstausch','Der Zauber lässt eine Person Lebensenergie an ein anderes Ziel abgeben.',['Lebenspunktetausch 1:1\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = 1 GS-Schaden'],['+3 GS-Test'],'UND','- 5m'],\n    [1,'Lebensader','Entdeckt lebende Kreaturen in einem kurzen Radius, indem ihr Herzschlag wahrgenommen wird.',['Entdeckt lebende Kreaturen | 20m Radius | 10 min\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = 1 GS-Schaden'],['+3 GS-Test','+10m Radius'],'ODER','o<\\n- K*'],\n    [1,'Leuchtfeuer des Lebens','Markieren Sie ein Ziel mit einem Tropfen Ihres eigenen Blutes, sodass Sie dessen Richtung eine Zeit lang wahrnehmen können.',['Markierung | 1km | 10 min\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = 1 GS-Schaden'],['+10 min','+1km'],'UND','- Berührung\\n- K*'],\n    [1,'Blutkochen','Dieser Zauber erhitzt das Blut des Ziels und verursacht Schmerzen. Eine ungenaue Anwendung kann auch dem Zaubernden schaden.',['2 Schaden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Schaden x4\\nMisserfolg = Schaden x2 auf Ziel und Zaubernde'],['+2','+3 GS-Test'],'ODER','- 10m\\n- Gezielt'],\n    [1,'Fluch des Unheils','Ein dauerhafter Fluch, der das Ziel schwächt. Fehlerhafte Anwendung kann den Fluch auf den Zaubernden zurückwerfen. Personen oder Gegenstände können verflucht werden. Letztere haben eine Aura von 5 Metern.',['1 Malus auf alle Würfe\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Fluch wirkt\\nMisserfolg = Fluch trifft Zaubernden'],['+1 Malus','+3 GS-Test'],'ODER','- Berührung\\n- Fluch'],\n    [2,'Blutige Rüstung','Erschafft eine Rüstung aus eigener Lebensenergie. Die Rüstung bietet Schutz, muss aber regelmäßig erneuert werden.',['+1 (magische) Rüstung pro investierten LP | 1 Runde\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = -2 GS-Schaden'],['+1 Rüstung','+3 GS-Test'],'ODER','o<'],\n    [2,'Blutsauger','Der Zauber entzieht dem Ziel Lebenspunkte und überträgt sie auf den Zaubernden oder andere. Fehlerhafte Anwendung kann unerwünschte Effekte haben. Funktioniert auch bei kürzlich Verstorbenen.',['+5 LP Zaubernde | -5 Lebenspunkte Ziel\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Effekt wird umgekehrt'],['+3 GS-Test','+5 LP'],'ODER','- Berührung'],\n    [3,'Blutige Handschrift','Der Zauber versendet kurze Nachrichten an Personen, die der Zauberin bekannt sein müssen. Die Nachrichten erscheinen an einer beliebigen Stelle in Form von feinen Schnitten auf der Haut des Ziels.',['Nachricht versenden | 3 Wörter'],['+1 Wort'],'UND','o<'],\n    [3,'Blutbeschwörung','Ein Ritual, das eine Kreatur aus der Unterwelt durch Blutopfer beschwört. Die Kontrolle über die Kreatur ist schwer und kann verloren gehen.',['Beschwört eine Kreatur:\\n1x W100 LP | INI = LP Zaubernder | 8 AP | 1x W12 Schaden | 2 Runden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Kontrolle\\nMisserfolg = Kontrolle verloren'],['+1x W12 Schaden','+1 Runde'],'ODER','- 2m\\n- K*'],\n    [3,'Blutsverwandt','Blutsverwandt teilt den eingehenden Schaden zwischen der Zauberin und einem Ziel in gleichen Teilen auf.',['50:50 Schadensverteilung zwischen Zauberin und Ziel | 1h\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Beide erhalten 100% Schaden'],['+3 GS-Test'],'UND','- Berührung'],\n    [4,'Aderlass','Das Blut muss fließen. Diese Verzauberung bewirkt, dass das Ziel bei jedem erlittenen Schaden zusätzlich blutet und dadurch zusätzlichen Schaden erleidet.',['+5 Blutungsschaden | 3 Runden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Zauber geht auf Zaubernden'],['+3 GS-Test','+1 Blutungsschaden'],'ODER','- 5m\\n- Gezielt'],\n    [4,'Blutsturm','Ein Sturm, der Gegner schwächt und die Lebensenergie auf Verbündete überträgt. Der Zauber ist mächtig, aber schwer zu kontrollieren.',['1W10 Schaden pro Gegner | 8m Durchmesser','Akkumulierter Schaden wird als LP auf Verbündete verteilt\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Kosten: 2 MP oder LP pro Person im Radius\\nMisserfolg = Kosten 2 MP/LP pro Person im Radius + Alle erleiden Schaden, keiner LP'],['+1W10 Schaden','+3 GS-Test'],'ODER','- 10m'],\n    [4,'Blutschwur','Verbindet das Schicksal des Ziels mit dem des Zaubernden, sodass beide denselben Schaden teilen. Der Zauber endet nur mit dem Tod oder einem sehr schwierigen (20) Fluchbrecher-Ritual.',['Schicksal wird verknüpft\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Entzieht dem Zaubernden 10 LP und 10 MP\\nMisserfolg = Entzieht dem Zaubernden 10 LP und 10 MP + Anderes Ziel im Umkreis wird zufällig gewählt'],['+2 GS-Test'],'UND','- 10m'],\n    [5,'Lebendige Bombe','Der Zauber verwandelt eine lebende Kreatur oder Person in eine laufende Bombe. Die Magierin kann das Ziel, einmal verzaubert, zu jedem Zeitpunkt \"zünden\".',['Lebendige Bombe | 2W10 Schaden | 4m Explosionsradius\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Zauber misslingt | 1 GS-Schaden'],['+2 GS-Test'],'UND','- Berührung\\n- Fluch'],\n    [5,'Infektion','Infiziere das Blut eines Ziels mit einer schleichenden Krankheit. Das Ziel wird jede Nacht aufs Neue geschwächt und kann auch an der Infektion sterben, wenn sie nicht behandelt wird.',['-6 LP pro Nacht\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Infektion geht in den eigenen Körper'],['+2 GS-Test'],'UND','- 30m\\n- Fluch'],\n    [5,'Blutvorrat','Reichere dein Blut an und erhalte temporär weitere Lebenspunkte, welche dich entweder länger am Leben halten oder für Zauber genutzt werden können.',['+temporäre Lebenspunkte | 24h\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = +3 temporäre Lebenspunkte\\nMisserfolg = 1 GS-Schaden'],['+3 temporäre Lebenspunkte'],'UND','o<'],\n    [6,'Gefrorenes Blut','Friere das Blut des Ziels ein, sodass es sich langsamer bewegt oder ganz einfriert.',['Verlangsamt oder Eingefroren\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Eingefroren | 1 Runde\\nMisserfolg = 1 GS-Schaden'],['+1 GS-Test'],'UND','- Gezielt\\n- 12m'],\n    [6,'Scharfe Knochen','Die Knochen deines Ziels verformen sich und bilden messerscharfe Kanten. Bei jeder Bewegung nimmt das Ziel Schaden.',['6 Schaden bei Bewegung | 2 Runden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Keine Konzentration (K*) nötig\\nMisserfolg = Konzentration (K*) nötig'],['+1 Schaden','+1 Runde'],'UND','- 10m\\n- Gezielt\\n- K*'],\n    [6,'Blutbad','Niemand geht nach Hause und es werden keine Gefangenen gemacht. Blutbad zwingt alle in einem bestimmten Radius, einen bestehenden Kampf fortzuführen, bis alle Feinde getötet wurden. Aufgeben oder Fliehen sind keine Optionen.',['Zwang zum Kampf | 15m Radius\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = -2 GS-Schaden'],['+1 Schaden','+1 Runde'],'UND','o<\\n- Fluch'],\n    [7,'Rage','Versetze das Ziel in heißblütige Rage, sodass es sich kaum noch zügeln lässt und besonders schnell und brutal kämpft, dabei aber anfälliger ist für Schaden. Das Ziel muss in jeder Runde Schaden machen, ansonsten verliert es den Zustand und muss dann einen GS-Test bestehen oder eine Runde aussetzen. Zudem muss ein GS-Test gelingen, um den Zustand nach einem erfolgreichen Kampf abzulegen und nicht weiter (auch Verbündete) anzugreifen. Eine befreundete Stimme kann dabei helfen, die Rage zu verlieren.',['Ziel gerät in Rage | 10 Runden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = +10 Schaden | -1 Rüstung | +1 AP\\nMisserfolg = +5 Schaden | -3 Rüstung | +1 AP | 2 G
