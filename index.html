S-Schaden\\nAnm.: Siehe Beschreibung für weitere Details'],['+10/+5 Schaden und -1/-3 Rüstung'],'UND','- 3m'],\n    [7,'Blutbeutel','Mache ein humanoides Ziel zu deinem willenlosen Blutbeutel und bediene dich an dessen Lebenspunkten, bis sie aufgebraucht sind. Der Blutbeutel wird dir (für sehr einfache Befehle) gehorchen und folgen und muss lediglich ab und zu gefüttert werden. Der Fluch kann nur gebrochen, nicht aber einfach beendet werden.',['Person als laufender Lebenspunktespeicher\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Ziel wird zum Feind | 1 GS-Schaden (Zaubernde)'],['+1 GS-Test'],'UND','- Berührung\\n- Fluch'],\n    [7,'Blutige Marionette','Beeinflusse das Blut des Ziels so, dass du seine Bewegungen kontrollieren kannst. Das Ziel bleibt dabei bei vollem Bewusstsein und kann unter großer Anstrengung noch eigenständig denken und sprechen. Der Zauber kann auch misslingen, und der Blutfluss der Magierin wird für kurze Zeit gestoppt.',['Ziel bewegt sich gegen ihren Willen\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt | 10 min | 30m Kontrolle\\nMisserfolg = -2 GS-Schaden'],['+1 GS-Test'],'UND','- 2m\\n- K*'],\n    [8,'Vampirischer Flug','Werde zu deinem tierischen Vorbild – der Fledermaus – und werde zur Königin des Nachthimmels und zum Feind aller Motten. Du kannst zudem das Blut von Tieren und Menschen trinken für einen Lebenspunkte-Bonus. Man kann sich jederzeit zurückverwandeln, außer der Zauber läuft schief – dann muss man für den Zeitraum die Konsequenzen tragen.',['Verwandlung in Fledermaus | Fliegen | 30 min','Blut trinken | +1W10 LP\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Verwandlung in Maus | 30 min (fest)'],['+1 GS-Test','+10 min'],'UND','o<'],\n    [8,'Opferaltar','Erschaffe einen blutigen Altar, auf dem Lebewesen geopfert werden können, um deren Attribute temporär in sich aufzunehmen. Bei einem Misserfolg explodiert der Körper des Ziels gewaltsam und Knochensplitter schießen in alle Richtungen.',['Opfert ein Ziel auf einem Altar','Attributs-Boni d. Ziels als zusätzliche Boni | 24h\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Ziel explodiert | 1W20 Schaden | 5m Radius'],['+24h'],'UND','- Berührung'],\n    [8,'Blutige Runen','Zeichne mit deinem Blut Runen auf Oberflächen und lade sie mit beliebigen Zaubern auf, deren Spruchliste du zumindest kennst. Die Zauber aktivieren sich automatisch, wenn jemand daran vorbeiläuft.',['Rune mit entsprechendem Effekt | 1m Radius\\nAnm.: Effekt und Rune müssen gezaubert werden\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Runen gehen sofort los'],['+1 GS-Test'],'UND','- Berührung'],\n    [9,'Jungbrunnen','Dein Blut hält dich jung und fit, und du stehst in deiner absoluten Blüte – aber zu einem Preis. Jede Kampfaktion ist verstärkt, verjüngt dich aber auch unaufhaltsam.',['+20 Schaden | +2 AP\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Stufe d. Zaubers = Verjüngung in Monaten\\nMisserfolg = Stufe d. Zaubers = Verjüngung x2 in Monaten'],['+10 Schaden','+1AP'],'UND','o<\\n- Fluch'],\n    [9,'Blutdurst','Erschaffe eine zerstörerische Waffe, die nach dem Blut deiner Feinde dürstet – oder nach deinem, wenn du nicht aufpasst.',['Waffe | +15 Treffen | +15 Schaden | +15% Krit.\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Waffe entzieht 10 LP pro Runde | 1 GS-Schaden'],['Erfolg = +5 Treffen/Schaden/Krit | Misserfolg = +5 LP Entzug'],'UND','o<'],\n    [9,'Wiedergeburt','Die Zaubernde opfert selbst alles bis auf einen Lebenspunkt, um ein Ziel vollständig zu heilen und wiederzubeleben. Die Zaubernde verliert danach ihr Bewusstsein und erleidet einen hohen Geistigen-Stabilitäts-Schaden, da das Ritual enorm dramatisierend ist.',['Wiederbelebung eines kürzlich (24h) Verstorbenen\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = -10 GS-Schaden\\nMisserfolg = -20 GS-Schaden'],['+1 GS-Test'],'UND','- Berührung'],\n    [10,'Blutige Herrschaft','Du hast absolute Kontrolle über das Blut deiner Feinde. Mit nur einer Handbewegung entziehst du es aus Körpern und nutzt es für die eigene Heilung, als Schutzschild und/oder komprimierst es zu tödlichen Geschossen.',['Blut entziehen | 1W20 | 3 Person | 15m\\nOpt. 1: Heilung mit entzogenem Blut\\nOpt. 2: Entzogenes Blut als Geschoss nutzen | 15m\\nOpt. 3: Entzogenes Blut als Schild nutzen\\nAnm. 1: Optionen können auch aufgeteilt werden.\\nAnm. 2: Heilung, Schild & Schaden = Wert entzogenes Blut\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = -5 GS-Schaden'],['+1 Person','+1W20'],'ODER','o<\\n- Gezielt (1x)'],\n    [10,'Wandelnde Leiche','Das Ziel stirbt nicht, wenn seine Lebenspunkte unter 0 fallen, sondern geht mit dem entsprechenden Schaden in den negativen Bereich der Lebenspunkte und wird untot. Der Untote reduziert sein Charisma und Intelligenz auf -2, erhöht aber seine Stärke um 2. Der Untote kann nicht heilen, außer er verzehrt humanoide Gehirne (+5 Heilung). Erst sobald der Untote wieder im positiven Lebenspunkte-Bereich ist, kann der Fluch (oder Segen?) gebrochen werden. Fallen die negativen Lebenspunkte des Untoten unter -30, dann ist er dauerhaft getötet.',['Untoter | -2 CHA und INT | +2 ST\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Ziel wird sofort zum Untoten mit -10 LP'],['+1 GS-Test'],'UND','- 3m\\n- Fluch'],\n    [10,'Herz der Finsternis','Das Herz steht im Mittelpunkt jedes Wirkens der Blutmagie, und ein humanoides Herz ist ein wertvolles Artefakt. Ein verzaubertes Herz nimmt alle negativen Geistigen-Stabilitäts-Effekte für die Zaubernde in sich auf. Jeder Blutzauber kann ohne einen GS-Test gezaubert werden und gelingt immer. Jeder Blutzauber entzieht dem Herz (Geistige) Stabilität – angefangen an dem GS-Stabilitätswert des \"Spenders\". Der GS-Schaden an das Herz entspricht dem Level des gewirkten Zaubers. Die gesammelte negative Energie des Herzens kann jederzeit – wie eine Bombe – freigesetzt werden und richtet Schaden in Höhe des gesammelten GS-Schadens an, zerstört dabei aber das Herz.',['Erzeugt \"Herz der Finsternis\"-Artefakt','Mit diesem Artefakt im Inventar gelingen alle Blutmagie-Zauber ohne GS-Tests.','Ist das Artefakt voller negativer Energie, kann dieser als Bombe freigesetzt werden.\\nAnm.: Schaden Bombe = gesammelter GS-Schaden | 30m Radius\\nGS-Test (+INT-/CHA-Wurf):\\nErfolg = Zauber gelingt\\nMisserfolg = Herz explodiert in der Hand | 2W20 Schaden | 5m'],['+1 GS-Test'],'UND','- Berührung']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Default-Daten: Weiße Magie (Magierin/Paladine/Klerikerin) ----------\nfunction defaultWeisseMagie(){\n  const listId = uid();\n  const list = {id: listId, name: 'Weiße Magie', description: 'Weiße Magie verkörpert nicht nur Heilung und Schutz, sondern auch die Macht, das \"Gute\" mit Nachdruck durchzusetzen. Sie kann ebenso gnadenlos wie gnädig sein – brennendes Licht, das Dunkelheit vernichtet und der Feinde richtet. Ob zur Verteidigung der Schwachen oder zur Bekämpfung des Bösen, Weiße Magie vereint Reinheit und Stärke, um Ordnung und Gerechtigkeit zu sichern – notfalls mit Gewalt.'};\n  const raw = [\n    [1,'Lichtstrahl','Projiziert einen Lichtstrahl auf ein Ziel, der geringen Strahlungsschaden verursacht.',['+1W6 Strahlungsschaden'],['+1W6'],'UND','- 20m\\n- Gezielt'],\n    [1,'Wort der Macht: Inspiration','Inspiriere ein Ziel und motiviere es zu großen und edlen Taten. Das Ziel erhält einen Bonus auf seine Fähigkeiten für eine begrenzte Anzahl an Würfen.',['Fertigkeitsbonus +1 | 1 Ziel | 1 Wurf'],['+1 Bonus','+1 Person','+1 Wurf'],'ODER','- 15m'],\n    [1,'Emotionen besänftigen','Beruhigt die Gemüter der Ziele in einem kleinen Bereich, baut Aggressionen ab oder mindert die Angst. Das funktioniert aber nicht immer und ist abhängig von der Geistigen Stabilität des Ziels und dessen Gemütszustand.',['Beruhigt Gemüter | 1 Ziel\\nGS-Test (Ziel):\\nErfolg = Ziel beruhigt sich nicht\\nMisserfolg = Ziel beruhigt sich'],['+1 Person','-2 GS-Test Schwierigkeit'],'UND','- 5m'],\n    [1,'Heilende Berührung','Stellt mit einer sanften Berührung eine kleine Menge Gesundheit für ein einzelnes Ziel wieder her.',['Heilung | 1W6 LP'],['+1W6'],'UND','- Berührung'],\n    [1,'Reparieren','Dieser Zauber repariert einen einzelnen Bruch oder Riss (bis zu 20cm) in einem Gegenstand, den du berührst, z.B. ein zerbrochenes Kettenglied, einen zerrissenen Mantel o.ä.',['Repariert | bis zu 20cm Schaden'],['+20cm Reparatur'],'UND','- Berührung'],\n    [2,'Licht in der Dunkelheit','Erzeugt kleine Lichtkugeln, die den Zaubernden begleiten und den Weg erhellen. Außerdem heilt sie den Zaubernden und verleiht ihm zusätzliche magische Rüstung.',['Licht | 10m Durchmesser | 10 min','Heilt | 5 LP am Tag','+5 magische Rüstung'],['+5 min','+5m Radius'],'ODER','o<\\n- K*'],\n    [2,'Reflektierender Schutzwall','Erzeugt eine magische Barriere um sich selbst oder einen Verbündeten, die einen Teil des eingehenden Zauberschadens auf den Angreifer zurückwirft.',['Reflektion von 1W4 Schaden | 2 Runden'],['+1W4','+1 Runde'],'ODER','- 10m\\n- K*'],\n    [2,'Kampf der Gerechten','Hüllt ein Ziel in Licht und erhöht dessen Aktionspunkte.',['+1 AP | 1 Runde'],['+1 AP','+1 Runde'],'ODER','- 15m\\n- K*'],\n    [2,'Einsicht','Gibt grobe Einsicht in die Gedanken und Motive des Ziels, indem du eine Ja/Nein-Frage stellst. Diese muss wahrheitsgemäß beantwortet werden, allerdings hat das Unterbewusstsein eine Chance, sich zu wehren, mit entsprechenden Tests.',['Beantwortung Ja/Nein-Frage | 1x Frage\\nINT-Test 5 (Ziel):\\nErfolg = Ziel beantwortet Frage\\nMisserfolg = Ziel beantwortet keine Frage'],['+1 Frage','+1 INT-Test Schwierigkeit'],'ODER','- 2m'],\n    [2,'Läuterndes Feuer','Setzt einen Schwall weißer Flammen frei, der allen Kreaturen in einem kleinen Kegel Strahlungsschaden zufügt, aber nicht tödlich für Verbündete ist.',['2W8 Schaden | 2x1m Kegel'],['+1W8','+2x1m Kegel'],'ODER','o<'],\n    [2,'Wort der Macht: Wahrheit','Du erschaffst eine magische Zone, die Lügen verhindert. Alle im Bereich müssen einen CHA-Test durchführen. Bei Misserfolg können sie nur die Wahrheit sagen oder die Antwort verweigern. Bei Erfolg erkennen sie den Zauber und können lügen.',['CHA-Test (4) | 5m Radius'],['+1 CHA-Test Schwierigkeit'],'UND','o<\\n- K*'],\n    [3,'Gegenzauber (Reaktion)','Dieser Zauber kann einen anderen Zauber kontern. Der Zauber kann als Reaktion eingesetzt werden, auch außerhalb der eigenen Runde, und kostet keine AP. Ein INT-Test gegen das Ziel entscheidet über Erfolg oder Misserfolg.',['Kontert einmal pro Kampf einen Zauber\\nINT-Test Magierin vs. Magierin:\\n--> Höherer Wert gewinnt\\nAnm.: Differenz zum Zauberlevel wird als Malus gewertet'],['+1 Kontermöglichkeit pro Kampf'],'UND','- 25m'],\n    [3,'Ätherisches Wandeln','Verzaubert dich selbst oder ein anderes Ziel dazu, sich für einige Augenblicke durch feste Objekte wie Wände oder Türen zu bewegen.',['Durch feste Materie gehen | 10 sek.'],['+10 sek.'],'UND','- Berührung'],\n    [3,'Teleportation','Teleportiere dich selbst oder ein anderes Ziel zu einer anderen Fläche. Der Start- und Zielort müssen gesehen und anvisiert werden können.',['Teleportation | 5m'],['+5m'],'UND','- 50m'],\n    [4,'Weitsicht','Du erschaffst einen unsichtbaren Sensor an einem dir bekannten Ort (einem Ort, den du schon einmal besucht oder gesehen hast). Du wählst zwischen Sehen und Hören und nutzt den entsprechenden Effekt, allerdings mit eingeschränkter Wahrnehmung.',['Sehen | 1 Wahrnehmung | 5 min','Hören | 1 Wahrnehmung | 5 min'],['+1 auf Wahrnehmung','+5 min'],'ODER','o<'],\n    [4,'Telekinese','Du hast die Kontrolle über ein Ziel (Kreatur oder Objekt) in Reichweite und kannst es ohne Berührung bewegen. Das Gewicht des Ziels ist abhängig von der Stufe des Zaubers. Das Objekt kann auch als Projektil eingesetzt werden:\\nProjektil:\\nSchlecht geeignet (weich): 1W4 Schaden\\nMittel geeignet (brüchig): 1W6 Schaden\\nGut geeignet (fest): 1W10 Schaden\\nSehr gut geeignet (fest und spitz): 1W20 Schaden',['1 Objekt | 1kg | 20m\\nAnm.: Schaden x kg'],['+1 Objekt','+1kg'],'ODER','- Gezielt\\n- 30m'],\n    [4,'Magie erkennen','Durch Fokussierung auf ein Objekt, eine grobe Richtung oder deine Umgebung kannst du vorhandene Magie wahrnehmen. Dickere Barrieren oder auch Metall behindern die Wahrnehmung. Die Qualität des Ergebnisses ist von einem INT-/CHA-Wurf abhängig.',['Erkennt Magie | INT-/CHA-Wurf\\nAnm.: Der Erfolg ist neben dem Wurf davon abhängig, wie weit etwas Magisches entfernt ist oder wie spezifisch oder unspezifisch etwas untersucht wird.'],['+1 INT-/CHA-Wurf'],'UND','- Sicht'],\n    [5,'Auflösen','Weiße Blitze, komprimiert in einem feinen dünnen Strahl, treffen ein Ziel in Reichweite und lösen das Ziel auf, wenn dessen LP auf 0 fallen. Der Zauber löst auch nichtmagische oder kleinere magische Objekte oder Strukturen auf. Magische Gegenstände sind von diesem Zauber unberührt.',['+2W10 Strahlungsschaden\\nAnm.: Bei 0 LP löst sich Ziel und dessen Gegenstände auf'],['+1W10'],'UND','- Gezielt\\n- 15m'],\n    [5,'Schutz (Reaktion)','Dieser Zauber kann eingehenden Schaden reduzieren. Der Zauber kann als Reaktion eingesetzt werden, auch außerhalb der eigenen Runde, und kostet keine AP. U.a. ein INT-Wurf entscheidet über die Höhe des abgewehrten Schadens.',['Schadensreduzierung = INT-/CHA-Wurf +1W10 | Reduziert einmal pro Kampf eingehenden Schaden'],['+1W10'],'UND','- 15m'],\n    [5,'Wort der Macht: Mut','Wenn das Ziel einen Geistigen-Stabilitäts-Wurf nicht schafft, kann dieser Zauber dem Ziel Mut geben und es erneut würfeln lassen mit einem Bonus.',['Neuer GS-Test | +1W4 GS-Test'],['+1W4 GS-Test'],'UND','- 5m'],\n    [6,'Fluch brechen','Durchbreche einen Fluch in einer Person, einem Objekt oder einem Ort.',['Flüche werden aufgehoben\\nINT-/CHA-Test (höher als Qualität des Fluchs):\\nErfolg = Fluch aufgehoben\\nMisserfolg = Fluch nicht aufgehoben'],['+1 INT-/CHA-Test'],'UND','- 3m'],\n    [6,'Wort der Macht: Vorschlag','Du schlägst Zielen in Reichweite eine vernünftig klingende Handlung vor. Sie müssen danach einen INT-Test machen und bei Misserfolg führen sie die Handlung nach besten Kräften aus. Schädliche Vorschläge oder erlittener Schaden durch die Magierin oder ihre Verbündeten brechen den Zauber.',['INT-/CHA-Wurf Magierin = Qualität d. Vorschlag | 4 Ziele\\nINT-Test (Ziele):\\nErfolg: Vorschlag wird befolgt | 2h\\nMisserfolg: Vorschlag wird nicht befolgt\\nAnm.: Der Erfolg ist neben dem Wurf davon abhängig, wie gut der Vorschlag ist und in welchem Gemütszustand sich die Ziele befinden.'],['+1 Ziel','+2h'],'ODER','- 4m\\n- K*'],\n    [6,'Gedanken Manipulieren','Du verzauberst eine Kreatur in Reichweite, die einen INT-Test machen muss. Bei Misserfolg wird sie handlungsunfähig und nimmt ihre Umgebung nicht wahr, kann dich aber hören. Während der Zauberdauer kannst du eine Erinnerung der letzten Stunden verändern, löschen oder erschaffen, sofern das Ziel deine Sprache versteht. Der Effekt bleibt bestehen, wenn der Zauber endet, außer er wird durch einen \"Fluch brechen\"-Zauber aufgehoben.',['1x Erinnerung manipulieren (INT-Test 4) | letzte 2h\\nAnm.: INT- oder CHA-Wurf bestimmt Stärke des Fluchs'],['+1 INT-Test Schwierigkeit','+2h'],'ODER','- 2m\\n- Fluch'],\n    [7,'Auge des Lichts','Erlaubt es dem Zaubernden, durch Wände und Dunkelheit hindurchzusehen, um Verbündete oder Gefahren zu entdecken. Allerdings mit eingeschränkter Wahrnehmung.',['Durch Wände oder Dunkelheit sehen | 1 Wahrnehmung | 5 min'],['+1 auf Wahrnehmung','+5 min'],'ODER','o<\\n- K*'],\n    [7,'Segen der Gemeinschaft','Verbessert die Fähigkeiten einer Gruppe, indem alle Verbündeten ihre Werte für kurze Zeit teilen. Der höchste Wert eines Verbündeten gilt für alle Fertigkeitswürfe (außer Kampf-Fertigkeiten).',['Höchste Gruppenfertigkeit gilt für alle | 3m Radius | 1 min'],['+1 min'],'UND','o<\\n- K*'],\n    [7,'Reinigung des Geistes','Manchmal braucht man etwas Licht im Leben. Reinigung des Geistes hilft dem Ziel, Traumata zu verarbeiten, und steigert so dessen Geistige Stabilität dauerhaft.',['GS-Heilung +1W2\\nAnm.: GS-Obergrenze bis 50'],['+5 GS-Obergrenze'],'UND','- Berührung'],\n    [8,'Lichtklinge','Dieser Zauber verstärkt eine Waffe und lässt diese so stark leuchten, dass Angreifer geblendet sind und jeder Angriff auf die Trägerin der Waffe erschwert ist.',['Waffe (des Ziels) +2W20 Lichtschaden | +10% Krit. | +5 Trefferzone'],['+1W20 Schaden'],'UND','- 10m'],\n    [8,'Wort der Macht: Betäubung','Du sprichst ein Machtwort, das den Verstand einer Kreatur in Reichweite überwältigen kann und sie sprachlos macht. Die Höhe der Lebenspunkte des Ziels bestimmt, ob der Zauber wirkt und das Ziel betäubt wird. Das betäubte Ziel muss am Ende jeder seiner Runden einen KO-Test ablegen. Bei einem erfolgreichen Wurf endet der Betäubungseffekt.',['Betäubt Ziel von bis zu 2W20 + 20 Lebenspunkten\\nKO-Test 6 (Ziel):\\nErfolg: Ziel wird nicht betäubt\\nMisserfolg: Ziel wird betäubt'],['+1W20 +10 LP','+1 KO-Test-Schwierigkeit'],'ODER','- 15m'],\n    [8,'Macht Käfig','Ein magischer Käfig entsteht in Reichweite. Kreaturen vollständig im Bereich werden gefangen, andere davon weggedrückt. Kreaturen können den Käfig nur mit einem erfolgreichen CHA-/INT-Test magisch verlassen (z.B. Teleportation). Der Käfig ist immun gegen Angriffe aller Art.',['Käfig | 3x3m | 24h\\nINT-Test 8 (Ziel):\\nErfolg: Ziel wird nicht betäubt\\nMisserfolg: Ziel wird betäubt'],['+1x1m','+1 INT-Test-Schwierigkeit'],'ODER','- 5m\\n- K*'],\n    [9,'Wort der Macht: Dominanz','Du dominierst ein Ziel in Reichweite, das einen Konstitutionswurf bestehen muss. Bei Misserfolg bist du telepathisch verbunden und kannst ihm Befehle geben, die es befolgt. Erleidet das Ziel Schaden, macht es erneut einen KO-Test. Das dominierte Ziel muss am Ende jeder seiner Runden einen KO-Test ablegen. Bei einem erfolgreichen Wurf endet der Effekt.',['Dominiert Ziel von bis zu 2W20 + 20 Lebenspunkten\\nKO-Test 6 (Ziel):\\nErfolg: Ziel wird nicht dominiert\\nMisserfolg: Ziel wird dominiert'],['+1W20 +10 LP','+1 KO-Test-Schwierigkeit'],'ODER','- 10m\\n- K*'],\n    [9,'Schlagfertigkeit','Bis zum Ende des Zaubers erhöht sich dein Charisma und jeder in deiner Umgebung wird dein Wort als bare Münze nehmen. Zauber, die dich zwingen würden die Wahrheit zu sagen, wirken nicht auf dich. Das zusätzliche Charisma hat keine Auswirkungen auf andere Zauberfähigkeiten.',['+1 Charisma | 10 min'],['+1 Charisma'],'UND','- K*'],\n    [9,'Massenheilung','Ein mächtiger Heilzauber, der mehreren Zielen Lebenspunkte zurückgibt.',['+1W10 +5 Heilung | 4 Personen | 5m Radius'],['+1W10 +5 Heilung','+2 Person'],'UND','o<'],\n    [10,'Sonneneruption','Eine mächtige Sonneneruption explodiert um dich herum. Alle Kreaturen in Reichweite müssen einen Konstitutionswurf machen. Bei Misserfolg erleiden sie Strahlenschaden und sind 1 Minute geblendet; bei Erfolg halbiert sich der Schaden, und sie werden nicht geblendet. Untote und Monster haben einen Nachteil. Geblendete Kreaturen können den Effekt am Ende ihrer Runde beenden durch einen erfolgreichen Wahrnehmungswurf. Der Zauber vertreibt magische Dunkelheit im Bereich.',['4W20 Strahlenschaden | 4m Radius\\nKO-Test 8 (Ziele):\\nErfolg: Ziel erleidet halben Schaden\\nMisserfolg: Ziel erleidet vollen Schaden und ist geblendet','Geblendet | -10 Wahrnehmung/Treffen | 30 sek.\\nWahrnehmungstest 10 (Ziele):\\nErfolg: Ziel ist nicht (mehr) geblendet\\nMisserfolg: Ziel ist und bleibt geblendet'],['+1W20 Strahlenschaden','+1m Radius'],'UND','o<'],\n    [10,'Zeit anhalten','Du hältst um dich herum den Fluss der Zeit für alle außer dir kurzzeitig an. Für andere Kreaturen vergeht keine Zeit, während du mehrere Runden hintereinander machst, in denen du dich wie gewohnt bewegen und Aktionen ausführen kannst. Bewegst du dich, bleibt der Bereich, in welchem die Zeit angehalten ist, dort, wo er gezaubert wurde. Betritt ein weiteres Ziel den Bereich, wird auch es in der Zeit angehalten. Erhält ein Ziel mehr als 50% seiner Lebenspunkte Schaden, erwacht es aus der Zeitschleife.',['Zeit anhalten für +1 Runden | 10m Radius'],['+1 Runde'],'UND','o<\\n- K*'],\n    [10,'Wort der Macht: Tod','Du sprichst ein Machtwort, das eine Kreatur, die du in Reichweite sehen kannst, zum sofortigen Tod zwingen kann. Die Höhe der Lebenspunkte des Ziels bestimmt, ob der Zauber wirkt und das Ziel stirbt.',['Zwingt zum sofortigen Tod für Ziel von bis zu 2W20 + 20 Lebenspunkten\\nKO-Test 10 (Ziel):\\nErfolg: Ziel muss nicht sterben\\nMisserfolg: Ziel stirbt'],['+1W20 +10 LP','+1 KO-Test-Schwierigkeit'],'ODER','- 10m']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Default-Daten: Freie Magie (Alle Klassen) — nur Level 1–6, Rest folgt später ----------\nfunction defaultFreieMagie(){\n  const listId = uid();\n  const list = {id: listId, name: 'Freie Magie', description: 'Freie Magie entzieht sich festen Regeln und klassischen Schulen. Sie ist vielseitig, wandelbar und oft pragmatisch – ein Werkzeug, das sich an den Willen des Zaubernden anpasst. Ob Telekinese, Verwandlungen, einfache Zaubertricks oder rohe Energie, Freie Magie wird nach Bedarf geformt. Sie dient weder einem reinen Zweck noch einer Ideologie, sondern verkörpert die Freiheit, Magie nach Belieben einzusetzen.'};\n  const raw = [\n    [1,'Siegel','Erzeugt ein schimmerndes Zeichen auf einer Oberfläche, das schwache magische Wirkung speichern oder freisetzen kann. Es kann mit erlernten Zaubern aufgeladen werden, die erst bei Berührung aktiviert und freigesetzt werden.',['Siegel für einen Zauber | max. 2MP Kapazität | 1h\\nOpt. 1: Unbegrenzte Dauer für 50 MP\\nOpt. 2: Dauerhafter Effekt für 60 MP'],['+2 MP Kapazität','+1h'],'ODER','- Berührung'],\n    [1,'Inspirieren','Deine Magie inspiriert ein Ziel für eine bestimmte Zeit. Die Inspiration kann genutzt werden, um einen beliebigen Wurf neu zu würfeln. Der bessere Wurf zählt.',['Neuer Wurf | 1h'],['+1h'],'UND','- Berührung'],\n    [1,'Blenden','Diese Form erzeugt einen grellen Blitz, der ein Ziel blenden kann. Geblendete erhalten einen Malus auf alle Manöver, die Sicht erfordern.',['-2 auf Zielen | 10m Umkreis | 1 Runde'],['-2 Zielen','+1 Runde'],'ODER','- 10m'],\n    [1,'Lichtkugel','Erzeugt kleine Lichtkugeln, die die Magierin begleiten und den Weg erhellen. Sollte die Magierin angegriffen werden, während der Zauber aktiv ist, \"opfert\" sich die Lichtkugel und absorbiert einen Teil des eingehenden Schadens.',['Licht | 5m Licht Radius | 10 min','+5 temporäre Rüstung'],['+5 min','+1 temp. Rüstung'],'ODER','o<\\n- K*'],\n    [2,'Kleine Heilung','Lege einem Ziel die Hand auf und heile dieses.',['+2 LP Heilung'],['+2 LP Heilung'],'UND','- 4m Radius'],\n    [2,'Magische Fessel','Magische Fesseln schießen aus dem Boden, verursachen Schaden und halten alles fest, was sich darin befindet. Ein Stärke-Test (4) ist notwendig, um sich daraus zu befreien.',['Festhalten (ST-Test 4) | 2 Runden | 1m²','1W6 Schaden'],['+1m²','+1W6','+1 ST-Test Malus'],'ODER','- 8m\\n- K*'],\n    [2,'Kleine Illusion','Du erzeugst ein Geräusch oder ein Bild eines Objekts in Reichweite, das bis zum Ende des Zaubers bestehen bleibt. Geräusche können variieren, Bilder dürfen eine gewisse Größe nicht überschreiten. Physische Interaktion oder ein erfolgreicher Wahrnehmungstest (11) enthüllt die Illusion.',['Illusion (Wahr.-Test: 11) | 1h | 1m³\\nOpt.: Dauerhafter Effekt für 40MP'],['+1m³','+1h','+1 Wahr.-Test Malus'],'ODER','- 30m'],\n    [2,'Gegenzauber (Reaktion)','Dieser Zauber kann einen anderen Zauber kontern. Der Zauber kann als Reaktion eingesetzt werden, auch außerhalb der eigenen Runde. Ein INT-Test gegen das Ziel entscheidet über Erfolg oder Misserfolg.',['Kontert einmal pro Kampf einen Zauber\\nINT-Test Magierin vs. Magierin:\\n--> Höherer Wert gewinnt\\nAnm.: Differenz zum Zauberlevel wird als Malus gewertet'],['+1 Kontermöglichkeit pro Kampf'],'UND','- 25m'],\n    [2,'Zwang','Ziele deiner Wahl in Reichweite machen einen INT-Test. Bei Misserfolg zwingst du sie in eine Richtung deiner Wahl. Nach jeder Bewegung können sie erneut einen INT-Test absolvieren. Tödliche Gefahren meiden sie.',['Zwang zur Bewegung (INT-Test 5) | 2 Runden'],['+1 Runde','+1 INT-Test Malus'],'ODER','- 15m\\n- K*'],\n    [3,'Schlaf','Dieser Zauber versetzt Ziele (KO-Test) in einen magischen Schlaf für eine bestimmte Zeit.',['Schlaf (KO-Test 4) | 1h\\nAnm. 1: Im Kampf nur auf Berührung\\nAnm. 2: Im Kampf KO-Test 2'],['+1 KO-Test Malus','+1h'],'ODER','- 2m\\n- K*'],\n    [3,'Licht & Dunkelheit','Dieser Spruch erschafft magisches Licht oder Dunkelheit um einen Gegenstand oder eine Kreatur. Das Licht oder die Dunkelheit strömen aus der geschaffenen Quelle. Diese kann nicht natürlich gelöscht oder zerstört, aber eingeschlossen werden (wie z.B. ein Tuch um den Stab wickeln, auf den die Dunkelheit gewirkt wurde). Licht kann Dunkelheit aufheben und Dunkelheit entsprechend Licht.',['Zauber | 2m Kugel | 1h'],['+2m','+1h'],'ODER','- 100m'],\n    [3,'Magische Rüstung','Eine magische Rüstung umgibt ein Ziel und schützt vor magischem und physischem Schaden.',['Rüstung +3 | 1 Runde'],['+3 Rüstung','+1 Runde'],'ODER','- 10m'],\n    [3,'Federfall (Reaktion)','Das Ziel erleidet keinen Fallschaden.',['Kein Fallschaden | 10m'],['+10m Distanz'],'UND','- 10m'],\n    [4,'Magisches Einfrieren (Reaktion)','Ein aktiver magischer Effekt oder aber auch ein Pfeil, Bolzen o.ä. wird eingefroren, als würde die Zeit darin stehen bleiben.',['Zauber | 1 Runde'],['+1 Runde'],'UND','- 15m\\n- K*'],\n    [4,'Spiegelbild','Illusorische Duplikate von dir erscheinen und ahmen deine Bewegungen nach. Wenn eine Kreatur dich angreift, bestimmt der Zufall jedes Mal aufs Neue, ob das richtige Ziel attackiert wird. Ein Duplikat wird bei Schaden zerstört. Kreaturen, die dich nicht sehen können oder Illusionen durchschauen (INT-Test 8), sind nicht betroffen.',['1 Duplikat | 3 Runden\\nAnm.: INT-Test 8 erkennt Illusion'],['+1 Duplikat','+1 Runde'],'ODER','o<\\n- K*'],\n    [4,'Schweben','Lässt ein Ziel langsam schweben.',['Schweben | 20kg | 2 Runden | 1m in alle Richtungen'],['+20kg','+2 Runden','+1m in alle Richtungen'],'ODER','- 5m'],\n    [5,'Energiegeschoss','Schleudert einen konzentrierten Energiestrahl, der moderaten Schaden verursacht.',['1W12 Energieschaden'],['+1W12'],'UND','- 15m'],\n    [5,'Unbewegliches Objekt','Der verzauberte Gegenstand wird sich nicht mehr bewegen, egal ob am Boden liegend oder in der Luft schwebend. Keine Kraft der Welt kann das Objekt bewegen.',['Zauber | 10cm³ | 10 min'],['+10cm³','+10 min'],'ODER','- Berührung'],\n    [5,'Teleportation','Teleportiere dich selbst oder ein anderes Ziel zu einer anderen Fläche. Der Start- und Zielort muss gesehen und anvisiert werden können.',['Teleportation | 5m'],['+5m'],'UND','- 50m'],\n    [6,'Telekinese','Du hast die Kontrolle über ein Objekt in Reichweite und kannst es ohne Berührung bewegen. Das Gewicht des Ziels ist abhängig von der Stufe des Zaubers. Das Objekt kann auch als Projektil eingesetzt werden:\\nProjektil:\\nSchlecht geeignet (weich): 1W4 Schaden\\nMittel geeignet (brüchig): 1W6 Schaden\\nGut geeignet (fest): 1W10 Schaden\\nSehr gut geeignet (fest und spitz): 1W20 Schaden',['1 Objekt | 1kg | 20m\\nAnm.: Schaden x kg'],['+1 Objekt','+1kg'],'ODER','- 5m'],\n    [6,'Mana Regeneration','Ruhe dich aus und nutze deine verbleibenden Kräfte, um neue Energie zu sammeln.',['+1W8 MP'],['+1W8 MP'],'UND','o<'],\n    [6,'Schnelligkeit','Gib dir oder einem anderen Ziel mehr (temporäre) Aktionspunkte.',['+1 AP'],['+1 AP'],'UND','- 15m']\n  ];\n  const sp = raw.map(r => ({id: uid(), listId, level:r[0], name:r[1], desc:r[2], effekt:r[3], steigerung:r[4], steigerungModus:r[5], details:r[6]}));\n  return {lists:[list], spells:sp};\n}\n\n// ---------- Vorlagen-Registry ----------\nconst DEFAULT_TEMPLATES = [\n  {name: 'Elementare Magie', seedFn: defaultElementareMagie},\n  {name: 'Zeichen & Wunder', seedFn: defaultZeichenUndWunder},\n  {name: 'Wilde Magie', seedFn: defaultWildeMagie},\n  {name: 'Blutmagie', seedFn: defaultBlutmagie},\n  {name: 'Weiße Magie', seedFn: defaultWeisseMagie},\n  {name: 'Freie Magie', seedFn: defaultFreieMagie}\n];\nfunction findTemplate(name){ return DEFAULT_TEMPLATES.find(t => t.name === name); }\nfunction templateOptionsHtml(){\n  return DEFAULT_TEMPLATES.map(t => `<option value=\"${escapeHtml(t.name)}\">${escapeHtml(t.name)}<\/option>`).join('');\n}\n\n// ---------- State ----------\nlet spellLists = [];   // {id, name}\nlet spells = [];       // {id, listId, level(1-10), name, desc, effekt:string[], steigerung:string[], details}\nlet character = {\n  learned: {},           // spellId -> Stufe (1-10)\n  castStufe: {},           // spellId -> gewählte Wirk-Stufe\n  steigerungChoice: {},     // spellId -> [optionIndex, ...] Länge = castStufe-1\n  levels: {},               // listId -> Level der Spruchliste (bestimmt Punkte: Level*3)\n  activeList: null,          // aktuell gewählter Tab auf der Hauptseite\n  pointsListSelect: null    // aktuell im Dropdown gewählte Liste\n};\nlet expandedSpells = new Set(); // nur zur Laufzeit, nicht gespeichert\nlet effektDraft = [];           // Effekt-Felder des gerade geöffneten Zauber-Formulars (Laufzeit)\nlet steigerungDraft = [];       // Steigerung-Felder des gerade geöffneten Zauber-Formulars (Laufzeit)\nlet dbFormTarget = null;        // null | 'new' | spellId — steuert, wo das Zauber-Formular angezeigt wird\nlet sfDraftMeta = null;         // {listId, level, name, desc, details, steigerungModus} des offenen Formulars\n\nconst $ = sel => document.querySelector(sel);\nconst $$ = sel => Array.from(document.querySelectorAll(sel));\nfunction uid(){ return Math.random().toString(36).slice(2,9); }\nfunction setStatus(msg){ $('#statusBar').textContent = msg; }\nfunction escapeHtml(s){ return (s||'').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction normalizeList(e){\n  if(Array.isArray(e)) return e.filter(x => typeof x === 'string');\n  if(typeof e === 'string' && e.trim() !== '') return [e];\n  return [];\n}\nconst DETAIL_ABBREVIATIONS = [\n  [/^o\\s*<$/i, 'Geht vom Zaubernden aus (o<)'],\n  [/^K\\*$/i, 'Konzentration nötig (K*)']\n];\nfunction expandDetailsText(text){\n  if(!text) return text;\n  return text.split('\\n').map(line => {\n    const trimmed = line.replace(/^-\\s*/, '').trim();\n    for(const [re, full] of DETAIL_ABBREVIATIONS){\n      if(re.test(trimmed)){\n        return line.replace(trimmed, full);\n      }\n    }\n    return line;\n  }).join('\\n');\n}\nfunction renderDetailsHtml(sp){\n  if(!sp.details) return '';\n  return `<div class=\"spell-details-wrap\"><div class=\"spell-details-label\">Details<\/div><div class=\"spell-details\">${escapeHtml(expandDetailsText(sp.details))}<\/div><\/div>`;\n}\n// Markiert \"Kegel\"-Erwähnungen (kegelförmige Zauberwirkung, z.B. \"10x2m Kegel\" = 10m lang, an der Spitze 2m breit)\n// mit einem kleinen Symbol, direkt im HTML-escapten Text.\nfunction formatSpellText(text){\n  return escapeHtml(text).replace(/\\bKegel\\b/g, 'Kegel <span class=\"kegel-icon\" title=\"Kegelförmige Fläche, ausgehend vom Zaubernden\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20 4 5h16z\"/><\/svg><\/span>');\n}\nfunction renderMultiHtml(arr, wrapClass, label){\n  const list = normalizeList(arr);\n  if(list.length === 0) return '';\n  if(list.length === 1){\n    return `<div class=\"${wrapClass}\"><b>${label}:<\/b> ${formatSpellText(list[0])}<\/div>`;\n  }\n  return list.map((e,i)=>`<div class=\"${wrapClass}\"><b>${label} ${i+1}:<\/b> ${formatSpellText(e)}<\/div>`).join('');\n}\nfunction renderSteigerungRefHtml(sp){\n  const arr = normalizeList(sp.steigerung);\n  if(arr.length === 0) return '';\n  if(arr.length === 1){\n    return `<div class=\"spell-effekt\"><b>Steigerung:<\/b> ${formatSpellText(arr[0])}<\/div>`;\n  }\n  const modus = sp.steigerungModus ? (sp.steigerungModus==='ODER'?'ODER':'UND') : 'ODER';\n  let html = '';\n  arr.forEach((opt, i) => {\n    html += `<div class=\"spell-effekt\"><b>Steigerung ${i+1}:<\/b> ${formatSpellText(opt)}<\/div>`;\n    if(i < arr.length-1){\n      html += `<div class=\"steigerung-connector\">${modus}<\/div>`;\n    }\n  });\n  return html;\n}\n\n// Erkennt Widerstand/Test-Referenzen (z.B. \"(ST-Test 4)\", \"GS-Test (+INT-/CHA-Wurf):\") direkt im Text,\n// statt sie separat zu pflegen — bleibt so immer mit Effekt/Details synchron, auch bei eigenen Zaubern.\nconst TEST_PATTERNS = [\n  [/Geistige-?\\s*Stabilit[aä]t-?Test/i, 'GS-Test'],\n  [/\\bGS-Test\\b/i, 'GS-Test'],\n  [/\\bSt[äa]rke-Test\\b/i, 'ST-Test'],\n  [/\\bSt-Test\\b/i, 'ST-Test'],\n  [/\\bST-Test\\b/i, 'ST-Test'],\n  [/\\bGE-Test\\b/i, 'GE-Test'],\n  [/\\bINT-Test\\b/i, 'INT-Test'],\n  [/\\bCHA-Test\\b/i, 'CHA-Test'],\n  [/\\bKO-Test\\b/i, 'KO-Test'],\n  [/\\bWahrnehmungs-?Test(?:-Test)?\\b/i, 'Wahrnehmungstest'],\n  [/\\bList-Test\\b/i, 'List-Test']\n];\nfunction extractTestRefs(sp){\n  const text = [sp.desc||'', ...normalizeList(sp.effekt), sp.details||''].join('\\n');\n  const results = []; // [{canon, numbers: [string,...]}]\n  function addNumber(canon, num){\n    let entry = results.find(r => r.canon === canon);\n    if(!entry){ entry = {canon, numbers: []}; results.push(entry); }\n    if(num !== null && !entry.numbers.includes(num)) entry.numbers.push(num);\n  }\n  TEST_PATTERNS.forEach(([re, canon]) => {\n    const numRe = new RegExp(re.source + '\\\\s*\\\\(?\\\\+?(-?\\\\d+)', 'gi');\n    let m; let any = false;\n    while((m = numRe.exec(text))){ addNumber(canon, m[1]); any = true; }\n    if(!any && re.test(text)) addNumber(canon, null);\n  });\n  // Sonderfall: Zahl steht VOR \"List-Test\", z.B. \"(>9) List-Test\"\n  const beforeMatch = text.match(/\\((>?\\s*\\d+)\\)\\s*List-Test/i);\n  if(beforeMatch){\n    const entry = results.find(r => r.canon === 'List-Test');\n    if(entry && entry.numbers.length === 0) entry.numbers.push(beforeMatch[1].trim());\n  }\n  return results.map(r => r.numbers.length ? `${r.canon} ${r.numbers.join('/')}` : r.canon);\n}\nfunction renderTestRefHtml(sp){\n  const tests = extractTestRefs(sp);\n  if(tests.length === 0) return '';\n  return `<div class=\"spell-details-wrap\"><div class=\"spell-details-label\">Widerstand / Test<\/div><div class=\"spell-details\">${tests.map(escapeHtml).join(', ')}<\/div><\/div>`;\n}\n\n// ---------- Storage ----------\nfunction ensureDefaultTemplatesPresent(){\n  let changed = false;\n  DEFAULT_TEMPLATES.forEach(t => {\n    if(!spellLists.some(l => l.name === t.name)){\n      const seed = t.seedFn();\n      spellLists.push(seed.lists[0]);\n      spells = spells.concat(seed.spells);\n      changed = true;\n    }\n  });\n  return changed;\n}\n\n// Ergänzt fehlende Beschreibungen bei bereits vorhandenen Standard-Spruchlisten (z.B. aus älteren Ständen),\n// ohne Zauber oder Charakterfortschritt anzurühren.\nfunction patchMissingListDescriptions(){\n  let changed = false;\n  spellLists.forEach(l => {\n    if(!l.description){\n      const tpl = findTemplate(l.name);\n      if(tpl){\n        const seedList = tpl.seedFn().lists[0];\n        if(seedList.description){\n          l.description = seedList.description;\n          changed = true;\n        }\n      }\n    }\n  });\n  return changed;\n}\n\nasync function loadAll(){\n  let dbLoaded = false;\n  try{\n    const d = await window.storage.get('zauber-datenbank');\n    if(d){\n      const p = JSON.parse(d.value);\n      spellLists = p.spellLists||[];\n      spells = (p.spells||[]).map(s => Object.assign({}, s, {effekt: normalizeList(s.effekt), steigerung: normalizeList(s.steigerung)}));\n      dbLoaded = true;\n    }\n  }catch(e){}\n  if(!dbLoaded){ spellLists = []; spells = []; }\n  const added = ensureDefaultTemplatesPresent();\n  const patched = patchMissingListDescriptions();\n  if(!dbLoaded || added || patched) await saveDb();\n  try{\n    const c = await window.storage.get('charakter');\n    if(c){ character = Object.assign(character, JSON.parse(c.value)); }\n  }catch(e){}\n  if(!character.steigerungChoice) character.steigerungChoice = {};\n  if(!character.levels) character.levels = {};\n  const openAdmin=!!character.__openAdmin;\n  if(openAdmin){ delete character.__openAdmin; saveChar(); }\n  render();\n  if(openAdmin){ $('#verwaltungPanel').style.display=''; $('#verwaltungToggleBtn').classList.add('active'); }\n  setStatus('bereit — wird beim Charakter gespeichert.');\n}\nasync function saveDb(){\n  try{\n    const r = await window.storage.set('zauber-datenbank', JSON.stringify({spellLists, spells}), false);\n    if(!r) setStatus('Speichern fehlgeschlagen — Änderungen evtl. nicht dauerhaft.');\n  }catch(e){ setStatus('Speichern fehlgeschlagen — Änderungen evtl. nicht dauerhaft.'); }\n}\nasync function saveChar(){\n  try{\n    const r = await window.storage.set('charakter', JSON.stringify(character), false);\n    if(!r) setStatus('Speichern fehlgeschlagen — Änderungen evtl. nicht dauerhaft.');\n  }catch(e){ setStatus('Speichern fehlgeschlagen — Änderungen evtl. nicht dauerhaft.'); }\n}\n\n// ---------- Modal ----------\nlet modalResolve = null;\nfunction openModal(message, opts){\n  opts = opts || {};\n  return new Promise(resolve => {\n    modalResolve = resolve;\n    $('#modalMsg').textContent = message;\n    const inp = $('#modalInput');\n    if(opts.withInput){ inp.style.display='block'; inp.value = opts.defaultValue||''; }\n    else { inp.style.display='none'; }\n    $('#modalOverlay').classList.add('open');\n  });\n}\nfunction closeModal(result){\n  $('#modalOverlay').classList.remove('open');\n  if(modalResolve) modalResolve(result);\n  modalResolve = null;\n}\n$('#modalCancel').addEventListener('click', () => closeModal(null));\n$('#modalOk').addEventListener('click', () => {\n  const inp = $('#modalInput');\n  if(inp.style.display!=='none') closeModal(inp.value);\n  else closeModal(true);\n});\n\n// ---------- Helpers ----------\nfunction listById(id){ return spellLists.find(l=>l.id===id); }\nfunction spellById(id){ return spells.find(s=>s.id===id); }\nfunction spellsOfList(listId){ return spells.filter(s=>s.listId===listId).sort((a,b)=>a.level-b.level || a.name.localeCompare(b.name)); }\nfunction levelOf(listId){ return character.levels[listId] || 0; }\nfunction pointsSpent(listId){\n  return spellsOfList(listId).reduce((sum, sp) => sum + (character.learned[sp.id] || 0), 0);\n}\nfunction pointsTotal(listId){ return levelOf(listId) * 3; }\n\n// stellt sicher, dass die Verteilung (Anzahl pro Steigerungs-Option) für einen Zauber gültig ist:\n// Länge = Anzahl Optionen, Summe darf die verfügbaren Punkte (slotsNeeded) nicht übersteigen\nfunction ensureSteigerungCounts(spellId, slotsNeeded, optionsLen){\n  let arr = character.steigerungChoice[spellId];\n  const valid = Array.isArray(arr) && arr.length === optionsLen\n    && arr.every(n => Number.isInteger(n) && n >= 0)\n    && arr.reduce((a,b)=>a+b,0) <= slotsNeeded;\n  if(!valid){\n    arr = new Array(optionsLen).fill(0);\n    if(optionsLen > 0) arr[0] = slotsNeeded;\n  }\n  character.steigerungChoice[spellId] = arr;\n  return arr;\n}\n\n// ---------- Render ----------\nfunction render(){\n  renderPointsListSelect();\n  renderListLevelCounter();\n  renderListDescBox();\n  renderPointsSpellList();\n  renderListManage();\n  renderDbFilterSelect();\n  renderDbSpellList();\n  renderTemplateSelect();\n  renderTabBar();\n  renderActiveSpells();\n}\n\n// --- Punkte-Vergabe / Zauberbuch in einem ---\nfunction renderPointsListSelect(){\n  const sel = $('#pointsListSelect');\n  if(spellLists.length === 0){\n    sel.innerHTML = '<option value=\"\">— keine Spruchlisten —<\/option>';\n    return;\n  }\n  if(!character.pointsListSelect || !listById(character.pointsListSelect)){\n    character.pointsListSelect = spellLists[0].id;\n  }\n  sel.innerHTML = spellLists.map(l => `<option value=\"${l.id}\" ${l.id===character.pointsListSelect?'selected':''}>${escapeHtml(l.name)}<\/option>`).join('');\n}\n\nfunction renderListLevelCounter(){\n  const counterEl = $('#listLevelCounter');\n  const noteEl = $('#listPointsNote');\n  const listId = character.pointsListSelect;\n  if(!listId || spellLists.length === 0){\n    counterEl.style.display = 'none';\n    noteEl.style.display = 'none';\n    return;\n  }\n  counterEl.style.display = '';\n  noteEl.style.display = '';\n  const lvl = levelOf(listId);\n  $('#listLevelVal').textContent = lvl;\n  const spent = pointsSpent(listId);\n  const total = pointsTotal(listId);\n  noteEl.innerHTML = `${spent} von <b>${total}<\/b> Punkten`;\n}\n\nfunction renderListDescBox(){\n  const wrap = $('#listDescWrap');\n  const box = $('#listDescBox');\n  const listId = character.pointsListSelect;\n  const l = listId ? listById(listId) : null;\n  if(!l || !l.description){\n    wrap.style.display = 'none';\n    return;\n  }\n  wrap.style.display = '';\n  box.innerHTML = `<b>${escapeHtml(l.name)}:<\/b> ${escapeHtml(l.description)}`;\n  box.classList.add('clamp-3');\n  $('#listDescToggleArrow').classList.remove('open');\n  $('#listDescToggleBtn').querySelector('span:last-child').textContent = 'mehr';\n}\n\nfunction renderTemplateSelect(){\n  const sel = $('#templateListSelect');\n  if(!sel) return;\n  sel.innerHTML = DEFAULT_TEMPLATES.map(t => {\n    const already = spellLists.some(l => l.name === t.name);\n    return `<option value=\"${escapeHtml(t.name)}\">${escapeHtml(t.name)}${already ? ' (bereits vorhanden)' : ''}<\/option>`;\n  }).join('');\n}\n\n// --- Hauptseite: Tab-Leiste + aktive Zauber ---\nfunction hasLearnedSpells(listId){\n  return spellsOfList(listId).some(sp => (character.learned[sp.id]||0) > 0);\n}\n\nfunction renderTabBar(){\n  const bar = $('#listTabBar');\n  const known = spellLists.filter(l => hasLearnedSpells(l.id));\n  if(known.length > 0){\n    if(!character.activeList || !known.some(l=>l.id===character.activeList)){\n      character.activeList = known[0].id;\n      saveChar();\n    }\n  }\n  bar.innerHTML = known.map(l => `\n    <button class=\"tab-chip ${l.id===character.activeList?'active':''}\" data-act=\"selectTab\" data-list=\"${l.id}\">${escapeHtml(l.name)}<\/button>\n  `).join('');\n}\n\nfunction spellCardHtml(sp, l){\n  const stufe = character.learned[sp.id] || 0;\n  return `\n    <div class=\"spell-card\">\n      <div class=\"spell-top\">\n        <div>\n          <div class=\"spell-name\"><span class=\"lvl-tag\">Lvl ${sp.level}<\/span>${escapeHtml(sp.name)}<\/div>\n          <div class=\"spell-list-tag\">${escapeHtml(l.name)}<\/div>\n        <\/div>\n        <span class=\"stufe-badge\">Stufe ${stufe}<\/span>\n      <\/div>\n      ${sp.desc ? `<div class=\"spell-desc\">${formatSpellText(sp.desc)}<\/div>` : ''}\n      ${renderMultiHtml(sp.effekt, 'spell-effekt', 'Effekt')}\n      ${renderSteigerungRefHtml(sp)}\n      ${renderTestRefHtml(sp)}\n      ${renderDetailsHtml(sp)}\n      ${renderCastSectionHtml(sp, stufe)}\n    <\/div>`;\n}\n\nfunction renderActiveSpells(){\n  const container = $('#activeSpellsList');\n  const known = spellLists.filter(l => hasLearnedSpells(l.id));\n  if(known.length === 0){\n    if(spellLists.length === 0){\n      container.innerHTML = `<div class=\"empty\">Noch keine Spruchliste vorhanden.<br><br>\n        <select class=\"tpl-select\" id=\"quickTplSelectMain\">${templateOptionsHtml()}<\/select>\n        <button class=\"btn primary\" data-act=\"loadTemplateQuick\" data-target=\"quickTplSelectMain\">Vorlage laden<\/button>\n      <\/div>`;\n    } else {\n      container.innerHTML = '<div class=\"empty\">Noch keine Zauber gelernt. Öffne oben rechts die Bibliothek (Buch-Symbol) und verteile Stufen — die Spruchliste erscheint hier automatisch, sobald du etwas gelernt hast.<\/div>';\n    }\n    return;\n  }\n  const l = listById(character.activeList) && known.some(k=>k.id===character.activeList) ? listById(character.activeList) : known[0];\n  const knownSpells = spellsOfList(l.id).filter(sp => (character.learned[sp.id]||0) > 0);\n  container.innerHTML = knownSpells.map(sp => spellCardHtml(sp, l)).join('');\n}\n\nfunction renderCastSectionHtml(sp, stufe){\n  if(stufe <= 0) return '';\n  const options = normalizeList(sp.steigerung);\n  const modus = sp.steigerungModus ? (sp.steigerungModus==='ODER'?'ODER':'UND') : (options.length>1?'ODER':'UND');\n  const castStufe = Math.min(character.castStufe[sp.id] || stufe, stufe);\n  const cost = sp.level + castStufe;\n  const slotsNeeded = castStufe - 1;\n\n  let extra = '';\n  if(slotsNeeded > 0 && options.length === 0){\n    extra = `<div class=\"steig-auto\">Dieser Zauber hat keine Steigerung.<\/div>`;\n  } else if(slotsNeeded > 0){\n    if(options.length <= 1 || modus === 'UND'){\n      const combinedText = options.join(' und ');\n      extra = `<div class=\"steig-auto\">${slotsNeeded}× <b>${escapeHtml(combinedText)}<\/b> (automatisch)<\/div>`;\n    } else {\n      const counts = ensureSteigerungCounts(sp.id, slotsNeeded, options.length);\n      const remaining = slotsNeeded - counts.reduce((a,b)=>a+b,0);\n      const rows = options.map((opt,i) => `\n        <div class=\"steig-count-row\">\n          <span class=\"steig-count-label\">${formatSpellText(opt)}<\/span>\n          <span class=\"counter\">\n            <button class=\"counter-btn\" data-act=\"steigCount-1\" data-spell=\"${sp.id}\" data-opt=\"${i}\" ${counts[i]<=0?'disabled':''}>−<\/button>\n            <span class=\"counter-val\">${counts[i]}×<\/span>\n            <button class=\"counter-btn\" data-act=\"steigCount+1\" data-spell=\"${sp.id}\" data-opt=\"${i}\" ${remaining<=0?'disabled':''}>+<\/button>\n          <\/span>\n        <\/div>`).join('');\n      extra = `\n        <div class=\"steig-slot-label\">Steigerung verteilen (max. ${slotsNeeded}, noch ${remaining} übrig):<\/div>\n        ${rows}`;\n    }\n  }\n\n  return `<div class=\"cast-row\">\n    <div class=\"cast-top\">\n      <span class=\"counter\">\n        Wirken auf Stufe\n        <button class=\"counter-btn\" data-act=\"cast-1\" data-spell=\"${sp.id}\" ${castStufe<=1?'disabled':''}>−<\/button>\n        <span class=\"counter-val\">${castStufe}<\/span>\n        <button class=\"counter-btn\" data-act=\"cast+1\" data-spell=\"${sp.id}\" ${castStufe>=stufe?'disabled':''}>+<\/button>\n      <\/span>\n      <span class=\"cost-badge\">${cost} Mana<\/span>\n      <button class=\"btn small primary\" data-act=\"castSpell\" data-spell=\"${sp.id}\">Wirken<\/button>\n    <\/div>\n    ${extra}\n  <\/div>`;\n}\n\nfunction renderPointsSpellList(){\n  const container = $('#pointsSpellList');\n  const listId = character.pointsListSelect;\n  if(!listId){\n    container.innerHTML = `<div class=\"empty\">Keine Spruchliste vorhanden.<br><br>\n      <select class=\"tpl-select\" id=\"quickTplSelectAdmin\">${templateOptionsHtml()}<\/select>\n      <button class=\"btn primary\" data-act=\"loadTemplateQuick\" data-target=\"quickTplSelectAdmin\">Vorlage laden<\/button>\n    <\/div>`;\n    return;\n  }\n  const list = spellsOfList(listId);\n  if(list.length === 0){\n    container.innerHTML = '<div class=\"empty\">Diese Spruchliste hat noch keine Zauber. Über das Zahnrad unten kannst du welche anlegen.<\/div>';\n    return;\n  }\n  container.innerHTML = list.map(sp => {\n    const stufe = character.learned[sp.id] || 0;\n    const open = expandedSpells.has(sp.id);\n    return `\n    <div class=\"points-spell-row\">\n      <div class=\"points-spell-header\" data-act=\"toggleSpellExpand\" data-spell=\"${sp.id}\">\n        <span class=\"points-spell-title\">\n          <span class=\"expand-arrow ${open?'open':''}\">▶<\/span>\n          ${escapeHtml(sp.name)}\n          <span class=\"points-spell-lvl\">Lvl ${sp.level}<\/span>\n        <\/span>\n        <span class=\"counter\">\n          Stufe\n          <button class=\"counter-btn\" data-act=\"learn-1\" data-spell=\"${sp.id}\" ${stufe<=0?'disabled':''}>−<\/button>\n          <span class=\"counter-val\">${stufe}<\/span>\n          <button class=\"counter-btn\" data-act=\"learn+1\" data-spell=\"${sp.id}\" ${stufe>=10?'disabled':''}>+<\/button>\n        <\/span>\n      <\/div>\n      ${open ? `<div class=\"points-spell-body\">\n        ${sp.desc ? `<div class=\"spell-desc\">${formatSpellText(sp.desc)}<\/div>` : ''}\n        ${renderMultiHtml(sp.effekt, 'spell-effekt', 'Effekt')}\n        ${renderSteigerungRefHtml(sp)}\n        ${renderTestRefHtml(sp)}\n        ${renderDetailsHtml(sp)}\n        ${renderCastSectionHtml(sp, stufe)}\n      <\/div>` : ''}\n    <\/div>`;\n  }).join('');\n}\n\n// --- Spruchlisten verwalten (hinter Zahnrad) ---\nfunction renderListManage(){\n  const container = $('#listManageContainer');\n  if(spellLists.length === 0){\n    container.innerHTML = '<div class=\"empty\">Noch keine Spruchlisten angelegt.<\/div>';\n    return;\n  }\n  container.innerHTML = spellLists.map(l => `\n    <div class=\"list-manage-row\">\n      <input type=\"text\" data-act=\"renameList\" data-list=\"${l.id}\" value=\"${escapeHtml(l.name)}\">\n      <span class=\"hint\">${spellsOfList(l.id).length} Zauber<\/span>\n      <button class=\"btn small danger\" data-act=\"deleteList\" data-list=\"${l.id}\">Löschen<\/button>\n    <\/div>`).join('');\n}\n\nfunction renderDbFilterSelect(){\n  const sel = $('#dbFilterList');\n  const cur = sel.value;\n  sel.innerHTML = '<option value=\"\">Alle Spruchlisten<\/option>' + spellLists.map(l => `<option value=\"${l.id}\">${escapeHtml(l.name)}<\/option>`).join('');\n  if(cur) sel.value = cur;\n}\n\nfunction renderDbSpellList(){\n  const filterId = $('#dbFilterList').value;\n  const container = $('#dbSpellList');\n  const lists = filterId ? spellLists.filter(l=>l.id===filterId) : spellLists;\n  if(lists.length === 0 || spells.length === 0){\n    container.innerHTML = '<div class=\"empty\">Keine Zauber vorhanden.<\/div>';\n    return;\n  }\n  const newFormHtml = (dbFormTarget === 'new') ? spellFormHtml(false) : '';\n  container.innerHTML = newFormHtml + lists.map(l => {\n    const sp = spellsOfList(l.id);\n    if(sp.length === 0) return '';\n    return `<div class=\"section-title\">${escapeHtml(l.name)}<\/div>` + sp.map(s => {\n      let html = `\n      <div class=\"db-list-card\">\n        <div class=\"db-spell-row\">\n          <b>${escapeHtml(s.name)}<\/b>\n          <span class=\"hint\">Level ${s.level}<\/span>\n          <span>\n            <button class=\"btn small\" data-act=\"editSpell\" data-spell=\"${s.id}\">Bearbeiten<\/button>\n            <button class=\"btn small danger\" data-act=\"deleteSpell\" data-spell=\"${s.id}\">Löschen<\/button>\n          <\/span>\n        <\/div>\n      <\/div>`;\n      if(dbFormTarget === s.id){ html += spellFormHtml(true); }\n      return html;\n    }).join('');\n  }).join('');\n  if(dbFormTarget){ renderEffektFields(); renderSteigerungFields(); }\n}\n\n// --- Zauber-Formular (mit dynamischen Effekt- und Steigerung-Feldern) ---\nfunction renderMultiFields(containerId, draftArr, labelPrefix, actName){\n  const wrap = document.getElementById(containerId);\n  if(!wrap) return;\n  wrap.innerHTML = draftArr.map((val, idx) => `\n    <div class=\"multi-field-row\" data-idx=\"${idx}\">\n      <label>${labelPrefix} ${idx+1}<textarea data-act=\"${actName}Input\" data-idx=\"${idx}\">${escapeHtml(val)}<\/textarea><\/label>\n      <button type=\"button\" class=\"btn small danger\" data-act=\"remove${actName}Field\" data-idx=\"${idx}\">×<\/button>\n    <\/div>`).join('');\n}\nfunction renderEffektFields(){ renderMultiFields('sf-effekt-list', effektDraft, 'Effekt', 'effekt'); }\nfunction renderSteigerungFields(){ renderMultiFields('sf-steigerung-list', steigerungDraft, 'Steigerung', 'steigerung'); }\n\nfunction startEditSpell(sp){\n  dbFormTarget = sp.id;\n  sfDraftMeta = {listId: sp.listId, level: sp.level, name: sp.name, desc: sp.desc, details: sp.details, steigerungModus: sp.steigerungModus==='ODER'?'ODER':'UND'};\n  effektDraft = normalizeList(sp.effekt);\n  if(effektDraft.length === 0) effektDraft = [''];\n  steigerungDraft = normalizeList(sp.steigerung);\n  if(steigerungDraft.length === 0) steigerungDraft = [''];\n  renderDbSpellList();\n}\nfunction startNewSpell(){\n  dbFormTarget = 'new';\n  sfDraftMeta = {listId: ($('#dbFilterList').value || character.pointsListSelect || (spellLists[0]||{}).id), level:1, name:'', desc:'', details:'', steigerungModus:'UND'};\n  effektDraft = [''];\n  steigerungDraft = [''];\n  renderDbSpellList();\n}\nfunction cancelSpellForm(){\n  dbFormTarget = null; sfDraftMeta = null;\n  effektDraft = []; steigerungDraft = [];\n  renderDbSpellList();\n}\n\nfunction spellFormHtml(isEditing){\n  const s = sfDraftMeta;\n  const listOptions = spellLists.map(l => `<option value=\"${l.id}\" ${l.id===s.listId?'selected':''}>${escapeHtml(l.name)}<\/option>`).join('');\n  return `\n  <div class=\"db-list-card\" id=\"spellFormBox\">\n    <div class=\"form-grid\">\n      <label>Spruchliste<select id=\"sf-list\">${listOptions}<\/select><\/label>\n      <label>Level (1-10)<input type=\"number\" id=\"sf-level\" min=\"1\" max=\"10\" value=\"${s.level}\"><\/label>\n      <label>Name<input type=\"text\" id=\"sf-name\" value=\"${escapeHtml(s.name)}\"><\/label>\n    <\/div>\n    <div class=\"form-grid\">\n      <label style=\"flex:1 1 100%;\">Beschreibung<textarea id=\"sf-desc\">${escapeHtml(s.desc)}<\/textarea><\/label>\n    <\/div>\n    <div class=\"section-title\" style=\"margin:12px 0 6px;\">Effekte<\/div>\n    <div id=\"sf-effekt-list\"><\/div>\n    <button type=\"button\" class=\"btn small\" id=\"sf-add-effekt\">+ Effekt<\/button>\n\n    <div class=\"section-title\" style=\"margin:16px 0 6px;\">Steigerungs-Optionen<\/div>\n    <div class=\"multi-hint\">Trage jede mögliche Steigerung als eigenes Feld ein. Rechts wählst du, ob sie bei jeder Stufe über 1 alle zusammen gelten (UND) oder ob der Spieler pro Stufen-Schritt eine davon auswählt (ODER).<\/div>\n    <div class=\"form-grid\">\n      <label>Verknüpfung<select id=\"sf-steigerung-modus\">\n        <option value=\"UND\" ${s.steigerungModus!=='ODER'?'selected':''}>UND (immer alle zusammen)<\/option>\n        <option value=\"ODER\" ${s.steigerungModus==='ODER'?'selected':''}>ODER (pro Stufe wählbar)<\/option>\n      <\/select><\/label>\n    <\/div>\n    <div id=\"sf-steigerung-list\"><\/div>\n    <button type=\"button\" class=\"btn small\" id=\"sf-add-steigerung\">+ Steigerungs-Option<\/button>\n\n    <div class=\"form-grid\" style=\"margin-top:14px;\">\n      <label style=\"flex:1 1 100%;\">Details (z.B. \"- Gezielt&#10;- 25m\")<textarea id=\"sf-details\">${escapeHtml(s.details)}<\/textarea><\/label>\n    <\/div>\n    <div class=\"toolbar\">\n      <button class=\"btn primary\" id=\"sf-save\">${isEditing ? 'Speichern' : 'Zauber anlegen'}<\/button>\n      <button class=\"btn\" id=\"sf-cancel\">Abbrechen<\/button>\n    <\/div>\n  <\/div>`;\n}\n\n// ---------- Events ----------\ndocument.addEventListener('click', (e) => {\n  const btn = e.target.closest('[data-act]');\n  if(!btn) return;\n  const act = btn.dataset.act;\n  const listId = btn.dataset.list;\n  const spellId = btn.dataset.spell;\n\n  if(act==='toggleSpellExpand'){\n    if(expandedSpells.has(spellId)) expandedSpells.delete(spellId);\n    else expandedSpells.add(spellId);\n    renderPointsSpellList();\n  }\n  else if(act==='learn-1' || act==='learn+1'){\n    let cur = character.learned[spellId] || 0;\n    cur = act==='learn-1' ? Math.max(0, cur-1) : Math.min(10, cur+1);\n    if(cur === 0) delete character.learned[spellId];\n    else character.learned[spellId] = cur;\n    saveChar(); renderPointsSpellList(); renderListLevelCounter(); renderTabBar(); renderActiveSpells();\n  }\n  else if(act==='listLevel-1' || act==='listLevel+1'){\n    const listId = character.pointsListSelect;\n    if(!listId) return;\n    let lvl = levelOf(listId);\n    lvl = act==='listLevel-1' ? Math.max(0, lvl-1) : Math.min(10, lvl+1);\n    if(lvl === 0) delete character.levels[listId];\n    else character.levels[listId] = lvl;\n    saveChar(); renderListLevelCounter();\n  }\n  else if(act==='castSpell'){\n    const sp = spellById(spellId); if(!sp) return;\n    const learnedStufe = character.learned[spellId] || 1;\n    const cs = Math.min(character.castStufe[spellId] || learnedStufe, learnedStufe);\n    const P=window.parent&&window.parent.__sb;\n    if(P&&P.cast) P.cast(sp.level+cs, sp.name, cs);\n  }\n  else if(act==='cast-1' || act==='cast+1'){\n    const sp = spellById(spellId);\n    const learnedStufe = character.learned[spellId] || 1;\n    let cur = Math.min(character.castStufe[spellId] || learnedStufe, learnedStufe);\n    cur = act==='cast-1' ? Math.max(1, cur-1) : Math.min(learnedStufe, cur+1);\n    character.castStufe[spellId] = cur;\n    const options = normalizeList(sp.steigerung);\n    ensureSteigerungCounts(spellId, cur-1, options.length);\n    saveChar(); renderPointsSpellList(); renderActiveSpells();\n  }\n  else if(act==='steigCount-1' || act==='steigCount+1'){\n    const sp = spellById(spellId);\n    const options = normalizeList(sp.steigerung);\n    const learnedStufe = character.learned[spellId] || 1;\n    const castStufe = Math.min(character.castStufe[spellId] || learnedStufe, learnedStufe);\n    const slotsNeeded = castStufe - 1;\n    const counts = ensureSteigerungCounts(spellId, slotsNeeded, options.length);\n    const optIdx = parseInt(btn.dataset.opt,10);\n    if(act==='steigCount-1'){\n      if(counts[optIdx] > 0) counts[optIdx]--;\n    } else {\n      const total = counts.reduce((a,b)=>a+b,0);\n      if(total < slotsNeeded) counts[optIdx]++;\n    }\n    character.steigerungChoice[spellId] = counts;\n    saveChar(); renderPointsSpellList(); renderActiveSpells();\n  }\n  else if(act==='selectTab'){\n    const k=knownLists(), from=k.findIndex(l=>l.id===character.activeList), to=k.findIndex(l=>l.id===listId);\n    if(to>=0 && to!==from) goList(to, reduced()?0:(to>from?1:-1));\n  }\n  else if(act==='deleteList'){\n    const l = listById(listId);\n    openModal(`Spruchliste \"${l?l.name:''}\" inkl. aller ihrer Zauber wirklich löschen?`).then(ok => {\n      if(!ok) return;\n      const spIds = spellsOfList(listId).map(s=>s.id);\n      spells = spells.filter(s=>s.listId!==listId);\n      spellLists = spellLists.filter(x=>x.id!==listId);\n      spIds.forEach(id2 => { delete character.learned[id2]; delete character.castStufe[id2]; delete character.steigerungChoice[id2]; });\n      delete character.levels[listId];\n      if(character.pointsListSelect === listId) character.pointsListSelect = null;\n      if(character.activeList === listId) character.activeList = null;\n      saveDb(); saveChar(); render();\n    });\n  }\n  else if(act==='editSpell'){\n    const sp = spellById(spellId);\n    if(dbFormTarget === spellId){ cancelSpellForm(); }\n    else { startEditSpell(sp); }\n  }\n  else if(act==='deleteSpell'){\n    openModal('Diesen Zauber wirklich löschen?').then(ok => {\n      if(!ok) return;\n      spells = spells.filter(s=>s.id!==spellId);\n      delete character.learned[spellId]; delete character.castStufe[spellId]; delete character.steigerungChoice[spellId];\n      if(dbFormTarget === spellId) { dbFormTarget = null; sfDraftMeta = null; effektDraft = []; steigerungDraft = []; }\n      saveDb(); saveChar(); render();\n    });\n  }\n  else if(act==='removeeffektField'){\n    const idx = parseInt(btn.dataset.idx,10);\n    effektDraft.splice(idx,1);\n    if(effektDraft.length === 0) effektDraft = [''];\n    renderEffektFields();\n  }\n  else if(act==='removesteigerungField'){\n    const idx = parseInt(btn.dataset.idx,10);\n    steigerungDraft.splice(idx,1);\n    if(steigerungDraft.length === 0) steigerungDraft = [''];\n    renderSteigerungFields();\n  }\n  else if(act==='loadTemplateQuick'){\n    const sel = document.getElementById(btn.dataset.target);\n    if(!sel || !sel.value) return;\n    const tpl = findTemplate(sel.value);\n    if(!tpl) return;\n    if(spellLists.some(l => l.name === tpl.name)){\n      openModal(`\"${tpl.name}\" ist bereits vorhanden und wird auf den Standard zurückgesetzt. Fortfahren?`).then(ok => { if(ok) loadDefaultList(tpl.name, tpl.seedFn); });\n    } else {\n      loadDefaultList(tpl.name, tpl.seedFn);\n    }\n  }\n});\n\n\n$('#loadTemplateBtn').addEventListener('click', () => {\n  const sel = $('#templateListSelect');\n  const tpl = findTemplate(sel.value);\n  if(!tpl) return;\n  if(spellLists.some(l => l.name === tpl.name)){\n    openModal(`\"${tpl.name}\" ist bereits vorhanden und wird auf den Standard zurückgesetzt. Fortfahren?`).then(ok => { if(ok) loadDefaultList(tpl.name, tpl.seedFn); });\n  } else {\n    loadDefaultList(tpl.name, tpl.seedFn);\n  }\n});\n\ndocument.addEventListener('input', (e) => {\n  const eTa = e.target.closest('[data-act=\"effektInput\"]');\n  if(eTa){ effektDraft[parseInt(eTa.dataset.idx,10)] = eTa.value; return; }\n  const sTa = e.target.closest('[data-act=\"steigerungInput\"]');\n  if(sTa){ steigerungDraft[parseInt(sTa.dataset.idx,10)] = sTa.value; return; }\n});\n\n$('#pointsListSelect').addEventListener('change', (e) => {\n  character.pointsListSelect = e.target.value;\n  saveChar(); renderListLevelCounter(); renderListDescBox(); renderPointsSpellList();\n});\n\n$('#rulesToggleBtn').addEventListener('click', () => {\n  const box = $('#rulesBox');\n  const arrow = $('#rulesToggleArrow');\n  const collapsed = box.style.display === 'none';\n  box.style.display = collapsed ? '' : 'none';\n  arrow.classList.toggle('open', collapsed);\n});\n\n$('#listDescToggleBtn').addEventListener('click', () => {\n  const box = $('#listDescBox');\n  const arrow = $('#listDescToggleArrow');\n  const label = $('#listDescToggleBtn').querySelector('span:last-child');\n  const expanded = box.classList.contains('clamp-3');\n  box.classList.toggle('clamp-3', !expanded);\n  arrow.classList.toggle('open', expanded);\n  label.textContent = expanded ? 'weniger' : 'mehr';\n});\n\n$('#dbGearBtn').addEventListener('click', () => {\n  const wrap = $('#dbManagePanel');\n  const btn = $('#dbGearBtn');\n  const collapsed = wrap.style.display === 'none';\n  wrap.style.display = collapsed ? '' : 'none';\n  btn.classList.toggle('active', collapsed);\n});\n\n$('#listManageContainer').addEventListener('change', (e) => {\n  const inp = e.target.closest('[data-act=\"renameList\"]');\n  if(!inp) return;\n  const l = listById(inp.dataset.list);\n  if(l){ l.name = inp.value.trim() || l.name; saveDb(); render(); }\n});\n\n$('#newSpellBtn').addEventListener('click', () => {\n  if(spellLists.length === 0){ openModal('Lege zuerst eine Spruchliste an.'); return; }\n  startNewSpell();\n});\n\ndocument.addEventListener('click', (e) => {\n  if(e.target.id === 'sf-add-effekt'){\n    effektDraft.push('');\n    renderEffektFields();\n  } else if(e.target.id === 'sf-add-steigerung'){\n    steigerungDraft.push('');\n    renderSteigerungFields();\n  }\n});\n\ndocument.addEventListener('input', (e) => {\n  if(!sfDraftMeta) return;\n  if(e.target.id === 'sf-name') sfDraftMeta.name = e.target.value;\n  else if(e.target.id === 'sf-desc') sfDraftMeta.desc = e.target.value;\n  else if(e.target.id === 'sf-details') sfDraftMeta.details = e.target.value;\n  else if(e.target.id === 'sf-level') sfDraftMeta.level = e.target.value;\n});\ndocument.addEventListener('change', (e) => {\n  if(!sfDraftMeta) return;\n  if(e.target.id === 'sf-list') sfDraftMeta.listId = e.target.value;\n  else if(e.target.id === 'sf-steigerung-modus') sfDraftMeta.steigerungModus = e.target.value === 'ODER' ? 'ODER' : 'UND';\n});\n\ndocument.addEventListener('click', (e) => {\n  if(e.target.id === 'sf-save'){\n    const cleanedEffekt = effektDraft.map(v => (v||'').trim()).filter(v => v !== '');\n    const cleanedSteigerung = steigerungDraft.map(v => (v||'').trim()).filter(v => v !== '');\n    const data = {\n      listId: $('#sf-list').value,\n      level: Math.max(1, Math.min(10, parseInt($('#sf-level').value,10)||1)),\n      name: $('#sf-name').value.trim(),\n      desc: $('#sf-desc').value,\n      effekt: cleanedEffekt,\n      steigerung: cleanedSteigerung,\n      steigerungModus: $('#sf-steigerung-modus').value === 'ODER' ? 'ODER' : 'UND',\n      details: $('#sf-details').value\n    };\n    if(!data.name || !data.listId){ return; }\n    const editingId = (dbFormTarget && dbFormTarget !== 'new') ? dbFormTarget : null;\n    if(editingId){\n      const sp = spellById(editingId);\n      Object.assign(sp, data);\n      delete character.steigerungChoice[editingId];\n    } else {\n      spells.push(Object.assign({id: uid()}, data));\n    }\n    saveDb();\n    dbFormTarget = null; sfDraftMeta = null;\n    effektDraft = []; steigerungDraft = [];\n    saveChar(); render();\n  }\n  else if(e.target.id === 'sf-cancel'){\n    cancelSpellForm();\n  }\n});\n\n$('#dbFilterList').addEventListener('change', renderDbSpellList);\n\n$('#addListBtn').addEventListener('click', () => {\n  const inp = $('#newListName');\n  const name = inp.value.trim();\n  if(!name) return;\n  spellLists.push({id: uid(), name});\n  inp.value = '';\n  saveDb(); render();\n});\n\nfunction loadDefaultList(listName, seedFn){\n  const existing = spellLists.find(l => l.name === listName);\n  if(existing){\n    const spIds = spellsOfList(existing.id).map(s=>s.id);\n    spells = spells.filter(s=>s.listId!==existing.id);\n    spellLists = spellLists.filter(l=>l.id!==existing.id);\n    spIds.forEach(id => { delete character.learned[id]; delete character.castStufe[id]; delete character.steigerungChoice[id]; });\n    if(character.activeList===existing.id) character.activeList=null;\n    if(character.pointsListSelect===existing.id) character.pointsListSelect=null;\n  }\n  const seed = seedFn();\n  spellLists.push(seed.lists[0]);\n  spells = spells.concat(seed.spells);\n  saveDb(); saveChar(); render();\n  setStatus('\"'+listName+'\" wurde geladen.');\n}\n\n// ---------- Import / Export ----------\nfunction download(filename, text, mime){\n  const P=window.parent&&window.parent.__sb;\n  if(P&&P.download){P.download(filename,text).then(ok=>{if(!ok)setStatus('Speichern als Datei ist hier nicht möglich.');});return;}\n  setStatus('Speichern als Datei ist hier nicht möglich.');\n}\n$('#exportDbBtn').addEventListener('click', () => download('zauber-datenbank.json', JSON.stringify({spellLists, spells}, null, 2)));\n$('#exportCharBtn').addEventListener('click', () => download('charakter.json', JSON.stringify(character, null, 2)));\n\nfunction importDb(replace){\n  let data;\n  try{ data = JSON.parse($('#importDbArea').value); }\n  catch(e){ openModal('Ungültiges JSON.'); return; }\n  const newLists = data.spellLists || [];\n  const newSpells = data.spells || [];\n  if(replace){\n    spellLists = []; spells = [];\n    character.learned = {}; character.castStufe = {}; character.steigerungChoice = {}; character.levels = {}; character.activeList = null; character.pointsListSelect = null;\n  }\n  const nameToId = {};\n  spellLists.forEach(l => nameToId[l.name] = l.id);\n  newLists.forEach(l => {\n    if(!nameToId[l.name]){\n      const nl = {id: uid(), name: l.name};\n      spellLists.push(nl); nameToId[l.name] = nl.id;\n    }\n  });\n  newSpells.forEach(s => {\n    let listId = s.listId;\n    if(!listId && s.list){\n      if(!nameToId[s.list]){ const nl={id:uid(), name:s.list}; spellLists.push(nl); nameToId[s.list]=nl.id; }\n      listId = nameToId[s.list];\n    }\n    if(!listId) return;\n    spells.push({\n      id: uid(), listId,\n      level: Math.max(1, Math.min(10, parseInt(s.level,10)||1)),\n      name: s.name || 'Unbenannt',\n      desc: s.desc || '', effekt: normalizeList(s.effekt), steigerung: normalizeList(s.steigerung),\n      steigerungModus: s.steigerungModus === 'ODER' ? 'ODER' : 'UND',\n      details: s.details || ''\n    });\n  });\n  saveDb(); saveChar(); render();\n  setStatus(`Import abgeschlossen: ${newLists.length} Listen, ${newSpells.length} Zauber verarbeitet.`);\n}\n$('#importDbMergeBtn').addEventListener('click', () => importDb(false));\n$('#importDbReplaceBtn').addEventListener('click', () => {\n  openModal('Wirklich die GESAMTE Datenbank ersetzen? Das kann nicht rückgängig gemacht werden.').then(ok => { if(ok) importDb(true); });\n});\n$('#importCharBtn').addEventListener('click', () => {\n  let data;\n  try{ data = JSON.parse($('#importCharArea').value); }\n  catch(e){ openModal('Ungültiges JSON.'); return; }\n  openModal('Aktuellen Charakter wirklich ersetzen?').then(ok => {\n    if(!ok) return;\n    character = Object.assign({learned:{},castStufe:{},steigerungChoice:{},levels:{},activeList:null,pointsListSelect:null}, data);\n    if(!character.steigerungChoice) character.steigerungChoice = {};\n    saveChar(); render();\n  });\n});\n\n// ---------- Verwaltungs-Panel über Header-Icon ----------\nfunction closeVerwaltung(){\n  $('#verwaltungPanel').style.display = 'none';\n  $('#verwaltungToggleBtn').classList.remove('active');\n}\n$('#verwaltungToggleBtn').addEventListener('click', () => {\n  closeInfo();\n  const wrap = $('#verwaltungPanel');\n  const btn = $('#verwaltungToggleBtn');\n  const collapsed = wrap.style.display === 'none';\n  wrap.style.display = collapsed ? '' : 'none';\n  btn.classList.toggle('active', collapsed);\n});\n\n// ---------- Info-Panel (Regeln) ----------\nfunction closeInfo(){\n  $('#infoPanel').style.display = 'none';\n  $('#infoToggleBtn').classList.remove('active');\n}\n$('#infoToggleBtn').addEventListener('click', () => {\n  closeVerwaltung();\n  const wrap = $('#infoPanel');\n  const btn = $('#infoToggleBtn');\n  const collapsed = wrap.style.display === 'none';\n  wrap.style.display = collapsed ? '' : 'none';\n  btn.classList.toggle('active', collapsed);\n});\n$('#closeInfoBtn').addEventListener('click', closeInfo);\n\n$$('.info-subnav button').forEach(btn => {\n  btn.addEventListener('click', () => {\n    $$('.info-subnav button').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    const tab = btn.dataset.tab;\n    $('#infoTabGrundlagen').style.display = tab === 'grundlagen' ? '' : 'none';\n    $('#infoTabBegriffe').style.display = tab === 'begriffe' ? '' : 'none';\n  });\n});\n\n// ---------- Druckansicht (DIN A4) ----------\nfunction printEffektHtml(sp){\n  const arr = normalizeList(sp.effekt);\n  if(arr.length === 0) return '';\n  if(arr.length === 1) return `<div class=\"p-line\"><span class=\"p-label\">Effekt<\/span> ${formatSpellText(arr[0])}<\/div>`;\n  return arr.map((e,i)=>`<div class=\"p-line\"><span class=\"p-label\">Effekt ${i+1}<\/span> ${formatSpellText(e)}<\/div>`).join('');\n}\nfunction printSteigerungHtml(sp){\n  const arr = normalizeList(sp.steigerung);\n  if(arr.length === 0) return '';\n  if(arr.length === 1) return `<div class=\"p-line\"><span class=\"p-label\">Steigerung<\/span> ${formatSpellText(arr[0])}<\/div>`;\n  const modus = sp.steigerungModus === 'ODER' ? 'ODER' : 'UND';\n  return `<div class=\"p-line\"><span class=\"p-label\">Steigerung<\/span> ${arr.map(formatSpellText).join(` <i>${modus}<\/i> `)}<\/div>`;\n}\n\nfunction printSpellCardHtml(sp){\n  const stufe = character.learned[sp.id] || 0;\n  const tests = extractTestRefs(sp);\n  return `<div class=\"p-spell\">\n    <div class=\"p-spell-head\">\n      <span class=\"p-spell-name\">${escapeHtml(sp.name)}<\/span>\n      <span class=\"p-badges\"><span class=\"p-badge\">Lvl ${sp.level}<\/span><span class=\"p-badge accent\">Stufe ${stufe}<\/span><\/span>\n    <\/div>\n    ${sp.desc ? `<div class=\"p-desc\">${formatSpellText(sp.desc)}<\/div>` : ''}\n    ${printEffektHtml(sp)}\n    ${printSteigerungHtml(sp)}\n    ${tests.length ? `<div class=\"p-line\"><span class=\"p-label\">Widerstand/Test<\/span> ${tests.map(escapeHtml).join(', ')}<\/div>` : ''}\n    ${sp.details ? `<div class=\"p-details\">${escapeHtml(expandDetailsText(sp.details))}<\/div>` : ''}\n  <\/div>`;\n}\n\nfunction printRulesHtml(){\n  return `<div class=\"p-rules\">\n    <div class=\"p-rules-col\">\n      <div class=\"p-rules-item\"><b>Level<\/b> Bestimmt, welche Zauber in der Spruchliste freigeschaltet sind.<\/div>\n      <div class=\"p-rules-item\"><b>Stufe<\/b> Wie oft ein Zauber gesteigert wurde (1–10). Pro Level in der Spruchliste gibt es 3 Punkte zum Verteilen.<\/div>\n      <div class=\"p-rules-item\"><b>Mana-Kosten<\/b> = Level des Zaubers + gewirkte Stufe.<\/div>\n      <div class=\"p-rules-item\"><b>Steigerung UND<\/b> Bei Stufe &gt; 1 gelten automatisch alle Optionen zusammen.<\/div>\n      <div class=\"p-rules-item\"><b>Steigerung ODER<\/b> Punkte frei auf die Optionen verteilen (max. Stufe − 1).<\/div>\n    <\/div>\n    <div class=\"p-rules-col\">\n      <div class=\"p-rules-item\"><b>o&lt;<\/b> Zauber geht von der Zaubernden aus.<\/div>\n      <div class=\"p-rules-item\"><b>Berührung<\/b> Ziel muss berührt werden.<\/div>\n      <div class=\"p-rules-item\"><b>Sicht<\/b> Ziel muss nur gesehen werden.<\/div>\n      <div class=\"p-rules-item\"><b>Gezielt<\/b> Ziel muss getroffen werden (\"Gezielte Sprüche\").<\/div>\n      <div class=\"p-rules-item\"><b>Fluch<\/b> Qualitätsstufe via INT-/CHA-Test; bricht nur mit höherem Test.<\/div>\n      <div class=\"p-rules-item\"><b>K*<\/b> Konzentration nötig; bricht bei erlittenem Schaden ohne bestandenen GS-Test.<\/div>\n    <\/div>\n  <\/div>`;\n}\n\nfunction buildPrintBodyHtml(){\n  const known = spellLists.filter(l => hasLearnedSpells(l.id));\n  let html = `<div class=\"p-page-header\"><h1>Spruchbuch<\/h1><div class=\"p-subtitle\">Gelernte Zauber<\/div><\/div>`;\n  html += printRulesHtml();\n  if(known.length === 0){\n    html += '<p>Noch keine Zauber gelernt.<\/p>';\n  } else {\n    known.forEach(l => {\n      const knownSpells = spellsOfList(l.id).filter(sp => (character.learned[sp.id]||0) > 0);\n      html += `<div class=\"p-list-block\">\n        <div class=\"p-list-title\">${escapeHtml(l.name)}<\/div>\n        <div class=\"p-spell-grid\">${knownSpells.map(sp => printSpellCardHtml(sp)).join('')}<\/div>\n      <\/div>`;\n    });\n  }\n  return html;\n}\n\nfunction buildPrintDocument(){\n  const bodyHtml = buildPrintBodyHtml();\n  return `<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Spruchbuch<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap\" rel=\"stylesheet\">\n<style>\n  @page{ size: A4; margin: 1.4cm; }\n  *{ box-sizing:border-box; }\n  body{\n    font-family: \"EB Garamond\", Georgia, serif; color:#2c2013; background:#fff;\n    margin:0; padding:0 22px; font-size:11.5px; line-height:1.35;\n  }\n  .p-page-header{ text-align:center; margin-bottom:16px; border-bottom:2px solid #a3781f; padding-bottom:10px; }\n  .p-page-header h1{ font-family:\"Cinzel\", serif; font-size:26px; font-weight:700; margin:0; letter-spacing:0.03em; color:#2c2013; }\n  .p-subtitle{ font-size:12px; color:#6b5636; font-style:italic; margin-top:2px; }\n\n  .p-list-block{ break-before: auto; margin-bottom:14px; }\n  .p-list-title{\n    font-family:\"Cinzel\", serif; font-size:16px; font-weight:600; color:#7a3b12;\n    background: linear-gradient(to right, #f3dca0, transparent);\n    padding:5px 10px; margin-bottom:8px; border-left:4px solid #a3781f;\n    break-after: avoid;\n  }\n\n  .p-spell-grid{ column-count:2; column-gap:14px; }\n\n  .p-spell{\n    break-inside: avoid; display:inline-block; width:100%;\n    background:#f2e8d3; border:1px solid #cbb488; border-radius:6px;\n    padding:8px 10px; margin-bottom:10px;\n  }\n  .p-spell-head{ display:flex; align-items:baseline; justify-content:space-between; gap:6px; flex-wrap:wrap; margin-bottom:3px; }\n  .p-spell-name{ font-family:\"Cinzel\", serif; font-weight:700; font-size:13px; color:#2c2013; }\n  .p-badges{ display:flex; gap:4px; flex-wrap:wrap; }\n  .p-badge{\n    font-family: ui-monospace, \"SF Mono\", Consolas, monospace; font-size:9px; font-weight:700;\n    border:1px solid #a3781f; color:#7a3b12; background:#f3dca0; border-radius:8px; padding:1px 6px;\n    white-space:nowrap;\n  }\n  .p-badge.accent{ border-color:#4b6b3a; color:#4b6b3a; background:#e2ead9; }\n\n  .p-rules{\n    display:flex; gap:18px; background:#f2e8d3; border:1px solid #cbb488; border-radius:6px;\n    padding:8px 12px; margin-bottom:16px; font-size:9.5px; color:#3a2d16;\n    break-after: avoid; break-inside: avoid;\n  }\n  .p-rules-col{ flex:1; }\n  .p-rules-item{ margin:2px 0; }\n  .p-rules-item b{ color:#7a3b12; }\n\n  .p-desc{ font-style:italic; color:#52411f; font-size:10.5px; margin:3px 0 5px; }\n  .p-line{ margin:2px 0; }\n  .p-label{ font-weight:700; color:#7a3b12; margin-right:3px; }\n  .p-details{ font-size:9.5px; color:#6b5636; white-space:pre-line; margin-top:5px; padding-top:4px; border-top:1px dashed #cbb488; }\n\n  @media print{\n    .p-list-block{ break-inside: avoid-page; }\n  }\n<\/style>\n<\/head>\n<body>\n${bodyHtml}\n<\/body>\n<\/html>`;\n}\n\n$('#printBtn').addEventListener('click', () => {\n  download('zauberbuch.html', buildPrintDocument(), 'text/html');\n  setStatus('Zauber-Liste als Datei heruntergeladen. Öffne sie und drucke sie von dort aus (Strg/Cmd+P) als PDF.');\n});\n\n// ---------- Speichern / Laden (lokale Datei) ----------\n// Wichtig: window.storage funktioniert nur in der Claude-Vorschau. Wird die Datei separat im\n// eigenen Browser geöffnet (z.B. von Spieler:innen), bleibt sonst nichts erhalten — daher hier\n// ein vollständiger Spielstand (Datenbank + Charakter) als Datei zum Sichern/Wiederherstellen.\n$('#saveFileBtn').addEventListener('click', () => {\n  const payload = { spellLists, spells, character, savedAt: new Date().toISOString() };\n  download('spruchbuch-speicherstand.json', JSON.stringify(payload, null, 2), 'application/json');\n  setStatus('Spielstand als Datei gespeichert.');\n});\n\n$('#loadFileBtn').addEventListener('click', () => {\n  $('#loadFileInput').value = '';\n  $('#loadFileInput').click();\n});\n\n$('#loadFileInput').addEventListener('change', (e) => {\n  const file = e.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = () => {\n    let data;\n    try{ data = JSON.parse(reader.result); }\n    catch(err){ openModal('Diese Datei ist kein gültiger Spruchbuch-Spielstand.'); return; }\n    if(!data.spellLists || !data.spells){ openModal('Diese Datei ist kein gültiger Spruchbuch-Spielstand.'); return; }\n    openModal('Aktuellen Spielstand (Datenbank + Charakter) durch die Datei ersetzen? Nicht gespeicherte Änderungen gehen dabei verloren.').then(ok => {\n      if(!ok) return;\n      spellLists = data.spellLists || [];\n      spells = (data.spells || []).map(s => Object.assign({}, s, {effekt: normalizeList(s.effekt), steigerung: normalizeList(s.steigerung)}));\n      character = Object.assign({learned:{},castStufe:{},steigerungChoice:{},levels:{},activeList:null,pointsListSelect:null}, data.character || {});\n      if(!character.steigerungChoice) character.steigerungChoice = {};\n      if(!character.levels) character.levels = {};\n      saveDb(); saveChar(); render();\n      setStatus('Spielstand aus Datei geladen.');\n    });\n  };\n  reader.readAsText(file);\n});\n\n// ---------- Einstellungen-Menü (Speichern/Laden/Drucken) ----------\n$('#settingsMenuBtn').addEventListener('click', (e) => {\n  e.stopPropagation();\n  const menu = $('#settingsMenu');\n  const collapsed = menu.style.display === 'none';\n  menu.style.display = collapsed ? '' : 'none';\n  $('#settingsMenuBtn').classList.t
